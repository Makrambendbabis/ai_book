sh McLennan","ar":"AXA، Marsh McLennan"},"p":{"fr":"Assistants internes sécurisés dès 2023 (Secure GPT, LenAI), puis déploiement mondial de Microsoft 365 Copilot chez AXA en 2026.","en":"Secure internal assistants from 2023 (Secure GPT, LenAI), then global roll-out of Microsoft 365 Copilot at AXA in 2026.","ar":"مساعدون داخليون آمنون منذ 2023 (Secure GPT، LenAI)، ثم نشر عالمي لـ Microsoft 365 Copilot لدى AXA في 2026."},"ref":"axa-securegpt"},{"h":{"fr":"Régulateur saoudien","en":"Saudi regulator","ar":"الجهة التنظيمية السعودية"},"p":{"fr":"Accord Insurance Authority × HUMAIN (août 2026) : accès sécurisé aux données sectorielles et cas d'usage prioritaires portés par le régulateur.","en":"Insurance Authority × HUMAIN agreement (August 2026): secure access to sector data and priority use cases driven by the regulator.","ar":"اتفاقية هيئة التأمين × HUMAIN (أغسطس 2026): وصول آمن إلى البيانات القطاعية وحالات استخدام ذات أولوية تقودها الجهة التنظيمية."},"ref":"ia-humain"}]},"map":{"chainBarsTitle":{"fr":"Où se concentre le potentiel : somme des scores de valeur par maillon","en":"Where the potential concentrates: sum of value scores by value-chain step","ar":"أين يتركز الإمكان: مجموع درجات القيمة حسب الحلقة"},"chainBarsNote":{"fr":"Somme des scores de valeur (1 à 5) des cas d'usage de chaque maillon ; le nombre de cas est rappelé entre parenthèses. Les sinistres, la souscription, la tarification et les contrats concentrent le potentiel ; le support en porte une part importante par le nombre de cas, pas par leur poids unitaire.","en":"Sum of the value scores (1 to 5) of the use cases in each value-chain step; the number of cases is shown in brackets. Claims, underwriting, pricing and policy administration concentrate the potential; support carries a significant share through the number of cases, not their unit weight.","ar":"مجموع درجات القيمة (من 1 إلى 5) لحالات الاستخدام في كل حلقة؛ ويُذكر عدد الحالات بين قوسين. تتركز الإمكانات في المطالبات والاكتتاب والتسعير والعقود؛ ويحمل الدعم حصة مهمة بعدد الحالات لا بوزنها الوحدوي."},"quickTitle":{"fr":"Gains rapides : valeur et faisabilité de 4 ou plus, horizon 0-18 mois","en":"Quick wins: value and feasibility of 4 or more, 0-18 month horizon","ar":"مكاسب سريعة: قيمة وجدوى بدرجة 4 أو أكثر، أفق 0-18 شهرًا"},"quickNote":{"fr":"{nq} cas atteignent ce double seuil à l'horizon H1 ; les dix premiers sont classés par valeur puis faisabilité. Leurs preuves de marché renvoient aux fiches du chapitre 13.","en":"{nq} cases meet this double threshold at horizon H1; the top ten are ranked by value then feasibility. Their market evidence refers to the chapter 13 sheets.","ar":"{nq} حالة تبلغ هذه العتبة المزدوجة في الأفق H1؛ والعشر الأولى مرتبة حسب القيمة ثم الجدوى. وتحيل أدلة السوق الخاصة بها إلى بطاقات الفصل 13."},"betsTitle":{"fr":"Paris structurants : valeur maximale, faisabilité de 3 ou moins","en":"Structural bets: maximum value, feasibility of 3 or less","ar":"رهانات هيكلية: قيمة قصوى، جدوى بدرجة 3 أو أقل"},"betsNote":{"fr":"{nb} cas ont une valeur de 5 et une faisabilité de 3 ou moins ; tous reposent sur au moins un socle mutualisé (orchestration, simulation, données, vision, graphe, gouvernance des modèles) que les gains rapides doivent financer.","en":"{nb} cases have a value of 5 and a feasibility of 3 or less; all rest on at least one shared capability (orchestration, simulation, data, vision, graph, model governance) that the quick wins must fund.","ar":"{nb} حالة لها قيمة 5 وجدوى 3 أو أقل؛ وتستند جميعها إلى قدرة مشتركة واحدة على الأقل (التنسيق، المحاكاة، البيانات، الرؤية الحاسوبية، الرسم البياني، حوكمة النماذج) يتعين على المكاسب السريعة تمويلها."},"profileTitle":{"fr":"Profil du portefeuille","en":"Portfolio profile","ar":"ملف المحفظة"}},"vt":{"simTitle":{"fr":"Application à un assureur type : la value tree quantifiée","en":"Application to a reference insurer: the quantified value tree","ar":"التطبيق على شركة تأمين نموذجية: شجرة القيمة المقدَّرة كميًا"},"simIntro":{"fr":"Les sections qui suivent appliquent la méthode à un assureur type fictif : un composite de 5 000 M€ de primes, 6 000 ETP et un ratio combiné non-vie de 94,5 %. Aucune donnée client n'est utilisée ; chaque valeur est un paramètre, modifiable dans le simulateur ci-dessous et dans le fichier de calcul livré avec le book. L'objectif n'est pas de prédire, mais de montrer comment calculer, avec quelles hypothèses, et où se loge l'incertitude.","en":"The following sections apply the method to a fictitious reference insurer: a composite with €5,000m of premiums, 6,000 FTEs and a non-life combined ratio of 94.5%. No client data is used; every value is a parameter, editable in the simulator below and in the calculation file delivered with the book. The aim is not to predict, but to show how to calculate, with which assumptions, and where the uncertainty lies.","ar":"تطبّق الأقسام التالية المنهجية على شركة تأمين نموذجية افتراضية: شركة مركبة بأقساط قدرها 5 000 مليون يورو و6 000 موظف بدوام كامل ونسبة مجمعة لغير الحياة تبلغ 94,5%. لم تُستخدم أي بيانات عملاء؛ وكل قيمة معامل قابل للتعديل في المحاكي أدناه وفي ملف الحساب المرفق بالدليل. الهدف ليس التنبؤ، بل بيان كيفية الحساب، وبأي فرضيات، وأين يكمن عدم اليقين."},"baselineTitle":{"fr":"L'assureur type : un cas d'école de 5 000 M€ de primes","en":"The reference insurer: a reference case with €5,000m of premiums","ar":"شركة التأمين النموذجية: حالة دراسية افتراضية بأقساط قدرها 5 000 مليون يورو"},"baselineFte":{"fr":"Effectifs : {fte} ETP à {fteCost} k€ de coût chargé, dont sinistres {clm}, souscription et contrats {uwpol}, distribution {dist}, relation client {svc}, actuariat et risques {actfin}, IT et data {it}, support {sup}.","en":"Headcount: {fte} FTEs at €{fteCost}k loaded cost, of which claims {clm}, underwriting and policy administration {uwpol}, distribution {dist}, customer service {svc}, actuarial and risk {actfin}, IT and data {it}, support {sup}.","ar":"القوى العاملة: {fte} موظفًا بدوام كامل بتكلفة محمَّلة قدرها {fteCost} ألف يورو، منهم المطالبات {clm}، والاكتتاب والعقود {uwpol}، والتوزيع {dist}، وعلاقات العملاء {svc}، والاكتواريا والمخاطر {actfin}، وتقنية المعلومات والبيانات {it}، والدعم {sup}."},"baselineExp":{"fr":"Frais internes {internalExp} M€, commissions {commission} des primes non-vie ; ratio combiné non-vie {cor0} = S/P {lr0} + frais {er0}.","en":"Internal expenses €{internalExp}m, commissions {commission} of non-life premiums; non-life combined ratio {cor0} = loss ratio {lr0} + expenses {er0}.","ar":"المصاريف الداخلية {internalExp} مليون يورو، والعمولات {commission} من أقساط غير الحياة؛ النسبة المجمعة لغير الحياة {cor0} = نسبة الخسائر {lr0} + المصاريف {er0}."},"baselineBs":{"fr":"SCR {scr} M€ et coût du capital {coc} ; fraude détectée {fraud} M€ par an ; rétention auto et habitation {retention} ; marges de contribution appliquées à la croissance : {mRetail} particuliers, {mComm} entreprises, {mLife} de valeur des affaires nouvelles vie.","en":"SCR €{scr}m and cost of capital {coc}; fraud detected €{fraud}m per year; motor and home retention {retention}; contribution margins applied to growth: {mRetail} retail, {mComm} commercial, {mLife} of life new business value.","ar":"SCR {scr} مليون يورو وتكلفة رأس المال {coc}؛ الاحتيال المكتشف {fraud} مليون يورو سنويًا؛ الاحتفاظ بعملاء السيارات والمنازل {retention}؛ هوامش المساهمة المطبقة على النمو: {mRetail} للأفراد، و{mComm} للشركات، و{mLife} من قيمة الأعمال الجديدة في تأمين الحياة."},"baselineNote":{"fr":"Composite fictif ; S/P et charge sinistres calculés sur le non-vie ({gwpNL} M€ de primes) ; volumes indicatifs pour situer les ordres de grandeur.","en":"Fictitious composite; loss ratio and claims cost calculated on non-life (€{gwpNL}m of premiums); indicative volumes to situate orders of magnitude.","ar":"شركة مركبة افتراضية؛ نسبة الخسائر وعبء المطالبات محسوبان على غير الحياة ({gwpNL} مليون يورو من الأقساط)؛ أحجام إرشادية لتحديد ترتيب الحجم."},"unitTitle":{"fr":"Du chiffre publié à l'effet unitaire retenu","en":"From the published figure to the unit effect retained","ar":"من الرقم المنشور إلى الأثر الوحدوي المعتمد"},"unitRows":[{"obs":{"fr":"−80 % de temps de traitement sur des sinistres simples","en":"−80% processing time on simple claims","ar":"−80% من زمن المعالجة في المطالبات البسيطة"},"src":{"fr":"Allianz Australie, 2025","en":"Allianz Australia, 2025","ar":"Allianz أستراليا، 2025"},"ref":"allianz-nemo","trans":{"fr":"Capacité sinistres libérée : 12 à 25 %","en":"Claims capacity released: 12 to 25%","ar":"قدرة محرَّرة في المطالبات: 12 إلى 25%"},"block":{"fr":"E1 · frais","en":"E1 · expenses","ar":"E1 · المصاريف"}},{"obs":{"fr":"29 % des heures de travail automatisables, 36 % augmentables","en":"29% of working hours automatable, 36% augmentable","ar":"29% من ساعات العمل قابلة للأتمتة، و36% قابلة للتعزيز"},"src":{"fr":"Accenture, nov. 2024","en":"Accenture, Nov. 2024","ar":"Accenture، نوفمبر 2024"},"ref":"accenture-genai-hours","trans":{"fr":"Support et IT 6 à 14 % ; actuariat, finance, risques 8 à 18 %","en":"Support and IT 6 to 14%; actuarial, finance, risk 8 to 18%","ar":"الدعم وتقنية المعلومات 6 إلى 14%؛ الاكتواريا والمالية والمخاطر 8 إلى 18%"},"block":{"fr":"E5, E6 · frais","en":"E5, E6 · expenses","ar":"E5, E6 · المصاريف"}},{"obs":{"fr":"60 minutes par soumission ; 75 % de demandes vie sans intervention ; 58 % d'approbations automatiques","en":"60 minutes per submission; 75% of life applications without intervention; 58% automatic approvals","ar":"60 دقيقة لكل طلب اكتتاب؛ 75% من طلبات الحياة دون تدخل؛ 58% موافقات آلية"},"src":{"fr":"Zurich, Swiss Re, Manulife","en":"Zurich, Swiss Re, Manulife","ar":"Zurich، Swiss Re، Manulife"},"ref":"zurich-sixfold","trans":{"fr":"Capacité souscription et contrats : 10 à 22 %","en":"Underwriting and policy administration capacity: 10 to 22%","ar":"قدرة محرَّرة في الاكتتاب والعقود: 10 إلى 22%"},"block":{"fr":"E2 · frais","en":"E2 · expenses","ar":"E2 · المصاريف"}},{"obs":{"fr":"80 % du service client rendu par des agents vocaux","en":"80% of customer service delivered by voice agents","ar":"80% من خدمة العملاء يقدمها وكلاء صوتيون"},"src":{"fr":"Ping An, 2024","en":"Ping An, 2024","ar":"Ping An، 2024"},"ref":"pingan-ai","trans":{"fr":"30 à 50 % des contacts simples (60 % du total) ; la borne haute de Ping An n'est pas retenue","en":"30 to 50% of simple contacts (60% of the total); Ping An's upper bound is not retained","ar":"30 إلى 50% من الاتصالات البسيطة (60% من الإجمالي)؛ ولم يُعتمد الحد الأعلى لدى Ping An"},"block":{"fr":"E3 · frais","en":"E3 · expenses","ar":"E3 · المصاريف"}},{"obs":{"fr":"Environ 8 heures gagnées par semaine et par collaborateur","en":"Around 8 hours saved per week and per employee","ar":"نحو 8 ساعات مكتسبة أسبوعيًا لكل موظف"},"src":{"fr":"Marsh McLennan, 2023","en":"Marsh McLennan, 2023","ar":"Marsh McLennan، 2023"},"ref":"marsh-lenai","trans":{"fr":"Capacité distribution : 5 à 12 % (chiffre déclaratif)","en":"Distribution capacity: 5 to 12% (self-reported figure)","ar":"قدرة محرَّرة في التوزيع: 5 إلى 12% (رقم تصريحي)"},"block":{"fr":"E4 · frais","en":"E4 · expenses","ar":"E4 · المصاريف"}},{"obs":{"fr":"Fraude détectée doublée (≈ 20 → 40 M€) ; +34 % au premier semestre 2025","en":"Fraud detected doubled (≈ €20m → €40m); +34% in the first half of 2025","ar":"مضاعفة الاحتيال المكتشف (≈ 20 → 40 مليون يورو)؛ +34% في النصف الأول 2025"},"src":{"fr":"Generali France ; Allianz UK","en":"Generali France; Allianz UK","ar":"Generali فرنسا؛ Allianz المملكة المتحدة"},"ref":"generali-shift","trans":{"fr":"Fraude évitée : +40 à +100 %","en":"Fraud prevented: +40 to +100%","ar":"الاحتيال المُتجنَّب: +40 إلى +100%"},"block":{"fr":"L1 · sinistres","en":"L1 · claims","ar":"L1 · المطالبات"}},{"obs":{"fr":"Cotation en secondes ; décisions sinistres en moins de 60 secondes","en":"Quotes in seconds; claims decisions in under 60 seconds","ar":"تسعير في ثوانٍ؛ قرارات مطالبات في أقل من 60 ثانية"},"src":{"fr":"Ki, Ping An Life","en":"Ki, Ping An Life","ar":"Ki، Ping An Life"},"ref":"ki-brit","trans":{"fr":"Délais suivis au cockpit ; aucun effet en M€ compté","en":"Cycle times tracked in the cockpit; no €m effect counted","ar":"آجال تُتابع في لوحة القيادة؛ لا يُحتسب أي أثر بالمليون يورو"},"block":{"fr":"cockpit","en":"cockpit","ar":"لوحة القيادة"}},{"obs":{"fr":"Aucun chiffre public : fuite de valeur, tarification, prévention, recours, rétention, capital","en":"No public figure: leakage, pricing, prevention, recoveries, retention, capital","ar":"لا رقم منشور: تسرب القيمة، التسعير، الوقاية، الاسترداد، الاحتفاظ، رأس المال"},"src":{"fr":"—","en":"—","ar":"—"},"ref":"","trans":{"fr":"Hypothèses d'expert : 0,1 à 1,5 % (L2 à L6, G1) ; 1 à 8 % des primes (G2 à G4) ; 1 à 3 % du SCR (C1)","en":"Expert assumptions: 0.1 to 1.5% (L2 to L6, G1); 1 to 8% of premiums (G2 to G4); 1 to 3% of SCR (C1)","ar":"فرضيات خبراء: 0,1 إلى 1,5% (L2 إلى L6، G1)؛ 1 إلى 8% من الأقساط (G2 إلى G4)؛ 1 إلى 3% من SCR (C1)"},"block":{"fr":"L2-L6, G, C","en":"L2-L6, G, C","ar":"L2-L6, G, C"}}],"unitRule":{"fr":"Règle de transposition : un résultat publié sur un périmètre étroit borne le haut de la fourchette ; le bas suppose une adoption partielle et des cas plus complexes. Les transpositions sont des hypothèses du modèle, modifiables.","en":"Transposition rule: a result published on a narrow scope bounds the top of the range; the bottom assumes partial adoption and more complex cases. Transpositions are model assumptions, and editable.","ar":"قاعدة النقل: النتيجة المنشورة على نطاق ضيق تحدّ أعلى النطاق؛ ويفترض الحد الأدنى تبنيًا جزئيًا وحالات أكثر تعقيدًا. عمليات النقل فرضيات للنموذج قابلة للتعديل."},"treeTitle":{"fr":"La value tree : quatre leviers, dix-sept blocs","en":"The value tree: four levers, seventeen blocks","ar":"شجرة القيمة: أربع روافع، سبع عشرة كتلة"},"treeSub":{"fr":"Valeur brute annuelle en régime de croisière : {lo} à {hi} M€, soit {pctLo} à {pctHi} des primes ; nette du coût de possession : {netLo} à {netHi} M€.","en":"Annual gross value in steady state: €{lo}m to €{hi}m, i.e. {pctLo} to {pctHi} of premiums; net of the cost of ownership: €{netLo}m to €{netHi}m.","ar":"القيمة الإجمالية السنوية في الوضع المستقر: {lo} إلى {hi} مليون يورو، أي {pctLo} إلى {pctHi} من الأقساط؛ وصافية من تكلفة الامتلاك: {netLo} إلى {netHi} مليون يورو."},"nonMonet":{"h":{"fr":"Leviers non monétisés, suivis au cockpit","en":"Non-monetised levers, tracked in the cockpit","ar":"روافع غير مقوَّمة نقديًا، تُتابع في لوحة القيادة"},"p":{"fr":"Expérience client (satisfaction, délais) et risque-conformité (inventaire, explicabilité, taux d'annulation en appel) sont des conditions de licence à opérer, pas des M€ : ils figurent au cockpit, jamais dans le total.","en":"Customer experience (satisfaction, cycle times) and risk-compliance (inventory, explainability, appeal overturn rate) are licence-to-operate conditions, not €m: they appear in the cockpit, never in the total.","ar":"تجربة العملاء (الرضا، الآجال) والمخاطر والامتثال (الجرد، القابلية للتفسير، معدل الإلغاء عند الاستئناف) شروط لرخصة مزاولة النشاط، لا ملايين يورو: تظهر في لوحة القيادة، ولا تدخل أبدًا في الإجمالي."}},"reading":{"h":{"fr":"Lecture des fourchettes","en":"Reading the ranges","ar":"قراءة النطاقات"},"p":{"fr":"Bas : adoption partielle et effets unitaires prudents. Haut : socles complets et adoption pleine. Les blocs ne s'additionnent pas cas par cas mais par socle et par processus, pour ne jamais compter deux fois la même économie.","en":"Low: partial adoption and prudent unit effects. High: complete capabilities and full adoption. Blocks are not added case by case but by capability and by process, so that the same saving is never counted twice.","ar":"الأدنى: تبنٍّ جزئي وآثار وحدوية حذرة. الأعلى: قدرات مشتركة مكتملة وتبنٍّ كامل. لا تُجمع الكتل حالة بحالة بل حسب القدرة المشتركة وحسب العملية، كي لا يُحتسب الوفر نفسه مرتين أبدًا."}},"blocksTitle":{"fr":"Les dix-sept blocs, leurs bases, leurs effets et leurs preuves","en":"The seventeen blocks, their bases, their effects and their evidence","ar":"الكتل السبع عشرة وقواعدها وآثارها وأدلتها"},"blocksNote":{"fr":"Base × part adressable × effet unitaire = indicateur tangible (M€ de frais, de sinistres, de primes ou de SCR) ; × facteur résultat (marge de contribution pour la croissance, coût du capital pour le SCR) = résultat en M€ par an. « Hypothèse d'expert » signale l'absence de chiffre public.","en":"Base × addressable share × unit effect = tangible indicator (€m of expenses, claims, premiums or SCR); × result factor (contribution margin for growth, cost of capital for SCR) = result in €m per year. \"Expert assumption\" flags the absence of a public figure.","ar":"القاعدة × الحصة القابلة للمعالجة × الأثر الوحدوي = مؤشر ملموس (مليون يورو من المصاريف أو المطالبات أو الأقساط أو SCR)؛ × معامل النتيجة (هامش المساهمة للنمو، وتكلفة رأس المال لـ SCR) = النتيجة بالمليون يورو سنويًا. «فرضية خبير» تشير إلى غياب رقم منشور."},"chainTitle":{"fr":"Par maillon : les sinistres portent un tiers de la valeur","en":"By value-chain step: claims carry a third of the value","ar":"حسب الحلقة: المطالبات تحمل ثلث القيمة"},"chainNote":{"fr":"{clmShare} de la valeur simulée vient des sinistres ; environ {coreShare} des maillons souscription, contrats, prévention, sinistres et fraude. Réassurance et stratégie n'ont pas de bloc monétisé : leur valeur passe par le capital, la tarification et le mix produit, et se mesure au cockpit.","en":"{clmShare} of the simulated value comes from claims; around {coreShare} from the underwriting, policy administration, prevention, claims and fraud steps. Reinsurance and strategy have no monetised block: their value flows through capital, pricing and product mix, and is measured in the cockpit.","ar":"{clmShare} من القيمة المحاكاة تأتي من المطالبات؛ ونحو {coreShare} من حلقات الاكتتاب والعقود والوقاية والمطالبات والاحتيال. ليس لإعادة التأمين والاستراتيجية كتلة مقوَّمة نقديًا: تمر قيمتهما عبر رأس المال والتسعير ومزيج المنتجات، وتُقاس في لوحة القيادة."},"lobTitle":{"fr":"Par ligne de business : l'automobile et l'habitation d'abord","en":"By line of business: motor and home first","ar":"حسب خط الأعمال: السيارات والمنازل أولًا"},"lobNote":{"fr":"Répartition des blocs selon la structure de l'assureur type (primes, charge sinistres, effectifs) ; la vie, l'épargne et la prévoyance pèsent moins par construction, parce que leurs effets passent par la croissance et le capital plutôt que par le ratio combiné.","en":"Allocation of blocks according to the structure of the reference insurer (premiums, claims cost, headcount); life, savings and protection weigh less by construction, because their effects flow through growth and capital rather than through the combined ratio.","ar":"توزيع الكتل وفق هيكل شركة التأمين النموذجية (الأقساط، عبء المطالبات، القوى العاملة)؛ ويقل وزن الحياة والادخار والحماية بحكم البناء، لأن آثارها تمر عبر النمو ورأس المال لا عبر النسبة المجمعة."},"rampTitle":{"fr":"Montée en charge 2027-2030 : les frais d'abord, la sinistralité ensuite","en":"Ramp-up 2027-2030: expenses first, loss experience next","ar":"التصاعد 2027-2030: المصاريف أولًا، ثم الخسائر"},"yearsTitle":{"fr":"Trajectoire financière : ce que le COMEX s'engage à financer","en":"Financial trajectory: what the executive committee (COMEX) commits to fund","ar":"المسار المالي: ما تلتزم اللجنة التنفيذية (COMEX) بتمويله"},"yearsNotes":[{"h":{"fr":"2027 · Fondations","en":"2027 · Foundations","ar":"2027 · الأسس"},"p":{"fr":"Socles financés avant la valeur : {tco27} M€ de coût pour {gross27} M€ de valeur ; l'année se juge sur les prérequis livrés, pas sur les M€.","en":"Capabilities funded before value: €{tco27}m of cost for €{gross27}m of value; the year is judged on the prerequisites delivered, not on the €m.","ar":"قدرات مشتركة تُموَّل قبل القيمة: {tco27} مليون يورو من التكلفة مقابل {gross27} مليون يورو من القيمة؛ وتُقيَّم السنة بالمتطلبات المسبقة المسلَّمة، لا بالملايين."}},{"h":{"fr":"2028 · Premiers retours","en":"2028 · First returns","ar":"2028 · العوائد الأولى"},"p":{"fr":"Frais et fraude portent la valeur ; point mort atteint dans le scénario haut ; les effets sur la sinistralité restent à confirmer par les groupes de contrôle.","en":"Expenses and fraud carry the value; break-even reached in the high scenario; loss-experience effects remain to be confirmed by the control groups.","ar":"المصاريف والاحتيال يحملان القيمة؛ وتُبلغ نقطة التعادل في السيناريو الأعلى؛ وتبقى الآثار على الخسائر رهن التأكيد بالمجموعات الضابطة."}},{"h":{"fr":"2029 · Échelle","en":"2029 · Scale","ar":"2029 · التوسع"},"p":{"fr":"Délégation sous seuils (L3) généralisée sur les sinistres simples et la souscription ; cumul net positif dans les deux scénarios.","en":"Delegation within thresholds (L3) generalised on simple claims and underwriting; cumulative net positive in both scenarios.","ar":"تعميم التفويض ضمن العتبات (L3) على المطالبات البسيطة والاكتتاب؛ وصافٍ تراكمي موجب في السيناريوهين."}},{"h":{"fr":"2030 · Croisière proche","en":"2030 · Near steady state","ar":"2030 · قرب الوضع المستقر"},"p":{"fr":"80 à 95 % de l'effet de croisière atteint ; {net30} M€ nets ; au-delà, {netLo} à {netHi} M€ par an en régime de croisière.","en":"80 to 95% of the steady-state effect reached; €{net30}m net; beyond that, €{netLo}m to €{netHi}m per year in steady state.","ar":"بلوغ 80 إلى 95% من أثر الوضع المستقر؛ {net30} مليون يورو صافية؛ وما بعد ذلك، {netLo} إلى {netHi} مليون يورو سنويًا في الوضع المستقر."}}],"yearsLag":{"fr":"Les gains de frais apparaissent en mois, les gains de sinistralité en 12 à 24 mois, les gains de capital à la clôture suivante : le plan de financement assume ce décalage plutôt que de promettre des retours immédiats.","en":"Expense gains appear in months, loss-experience gains in 12 to 24 months, capital gains at the next close: the funding plan accepts this lag rather than promising immediate returns.","ar":"تظهر مكاسب المصاريف في غضون أشهر، ومكاسب الخسائر في 12 إلى 24 شهرًا، ومكاسب رأس المال عند الإقفال التالي: تتحمل خطة التمويل هذا التأخر بدلًا من الوعد بعوائد فورية."},"corTitle":{"fr":"Pont de ratio combiné non-vie : de {cor0} à {corLo} ou {corHi}","en":"Non-life combined ratio bridge: from {cor0} to {corLo} or {corHi}","ar":"جسر النسبة المجمعة لغير الحياة: من {cor0} إلى {corLo} أو {corHi}"},"corNote":{"fr":"Gains de frais et coût de possession rapportés au non-vie au prorata des primes ; le coût de possession est ajouté, les gains retranchés. Un point de ratio combiné vaut {ptValue} M€ sur l'assureur type.","en":"Expense gains and cost of ownership allocated to non-life pro rata to premiums; the cost of ownership is added, the gains deducted. One point of combined ratio is worth €{ptValue}m on the reference insurer.","ar":"مكاسب المصاريف وتكلفة الامتلاك منسوبة إلى غير الحياة بنسبة الأقساط؛ تُضاف تكلفة الامتلاك وتُطرح المكاسب. تساوي نقطة واحدة من النسبة المجمعة {ptValue} مليون يورو لدى شركة التأمين النموذجية."},"tornadoTitle":{"fr":"Sensibilités : ce qui fait bouger la valeur nette de croisière","en":"Sensitivities: what moves steady-state net value","ar":"الحساسيات: ما يحرّك القيمة الصافية في الوضع المستقر"},"tornadoNote":{"fr":"Valeur nette annuelle de croisière, une hypothèse à la fois, autour du cas médian ({mid} M€). L'adoption effective et le choix RH sur la capacité libérée pèsent plus que le coût de possession.","en":"Annual steady-state net value, one assumption at a time, around the median case (€{mid}m). Effective adoption and the HR choice on released capacity weigh more than the cost of ownership.","ar":"القيمة الصافية السنوية في الوضع المستقر، بفرضية واحدة في كل مرة، حول الحالة الوسيطة ({mid} مليون يورو). التبني الفعلي وخيار الموارد البشرية بشأن القدرة المحرَّرة أثقل وزنًا من تكلفة الامتلاك."},"cockpitTitle":{"fr":"Le cockpit : douze indicateurs tangibles","en":"The cockpit: twelve tangible indicators","ar":"لوحة القيادة: اثنا عشر مؤشرًا ملموسًا"},"cockpitIntro":{"fr":"La valeur se constate au cockpit, elle ne se déclare pas. Chaque bloc de la value tree a un indicateur lisible en mois, une référence T0 mesurée avant le déploiement, un propriétaire unique ; deux garde-fous ne doivent jamais se dégrader pendant qu'un indicateur de valeur s'améliore.","en":"Value is observed in the cockpit, not declared. Each block of the value tree has an indicator readable in months, a T0 baseline measured before deployment, a single owner; two guardrails must never worsen while a value indicator improves.","ar":"القيمة تُلاحظ في لوحة القيادة، لا تُعلن. لكل كتلة في شجرة القيمة مؤشر يُقرأ في غضون أشهر، وخط أساس T0 مقيس قبل النشر، ومالك واحد؛ ويجب ألا يتدهور ضابطا أمان أبدًا بينما يتحسن مؤشر قيمة."},"cockpitNote":{"fr":"Cibles indicatives de l'assureur type, à recalibrer sur la mesure T0 réelle ; les deux derniers indicateurs sont des garde-fous.","en":"Indicative targets for the reference insurer, to be recalibrated on the actual T0 measurement; the last two indicators are guardrails.","ar":"أهداف إرشادية لشركة التأمين النموذجية، تُعاد معايرتها على قياس T0 الفعلي؛ والمؤشران الأخيران ضابطا أمان."},"limitsTitle":{"fr":"Ce que la simulation ne dit pas","en":"What the simulation does not say","ar":"ما لا تقوله المحاكاة"},"limits":[{"fr":"Elle ne prédit rien : c'est un cas d'école qui montre comment calculer, avec quelles hypothèses, et où se trouve l'incertitude.","en":"It predicts nothing: it is a reference case that shows how to calculate, with which assumptions, and where the uncertainty lies.","ar":"لا تتنبأ بشيء: إنها حالة دراسية افتراضية تبيّن كيفية الحساب، وبأي فرضيات، وأين يكمن عدم اليقين."},{"fr":"Dix blocs sur dix-sept reposent sur des hypothèses d'expert faute de chiffre public ; ils pèsent {expLo} à {expHi} de la valeur et toute la croissance.","en":"Ten blocks out of seventeen rest on expert assumptions for want of a public figure; they weigh {expLo} to {expHi} of the value and all of the growth.","ar":"تستند عشر كتل من أصل سبع عشرة إلى فرضيات خبراء لغياب رقم منشور؛ وتمثل {expLo} إلى {expHi} من القيمة وكامل النمو."},{"fr":"Les blocs ne s'additionnent pas librement : deux cas sur le même processus partagent la même économie ; consolider par socle, pas par cas.","en":"Blocks do not add up freely: two cases on the same process share the same saving; consolidate by capability, not by case.","ar":"لا تُجمع الكتل بحرية: حالتان على العملية نفسها تتقاسمان الوفر نفسه؛ فليكن التجميع حسب القدرة المشتركة لا حسب الحالة."},{"fr":"La capacité libérée n'est une économie que si l'organisation décide de la convertir ; sinon elle devient du service ou de la croissance, à mesurer autrement.","en":"Released capacity is a saving only if the organisation decides to convert it; otherwise it becomes service or growth, to be measured differently.","ar":"القدرة المحرَّرة ليست وفرًا إلا إذا قررت المنظمة تحويلها؛ وإلا تحولت إلى خدمة أو نمو، يُقاسان بطريقة مختلفة."},{"fr":"Les effets sur le ratio sinistres se lisent avec 12 à 24 mois de recul et ne sont jamais isolables sans groupe de contrôle ou déploiement progressif.","en":"Effects on the loss ratio are read with 12 to 24 months of hindsight and can never be isolated without a control group or phased deployment.","ar":"الآثار على نسبة الخسائر تُقرأ بتأخر 12 إلى 24 شهرًا ولا يمكن عزلها أبدًا دون مجموعة ضابطة أو نشر تدريجي."},{"fr":"Les chiffres de benchmark sont déclarés par les entreprises sur des périmètres étroits, sans audit ; ils bornent, ils ne garantissent pas.","en":"Benchmark figures are reported by the companies on narrow scopes, without audit; they bound, they do not guarantee.","ar":"أرقام المقارنة المرجعية تصرّح بها الشركات على نطاقات ضيقة ودون تدقيق؛ وهي تحدّ ولا تضمن."},{"fr":"Rien n'est compté pour les risques nouveaux (fraude par IA, dépendance aux fournisseurs, conformité) ni pour les revenus de nouveaux produits.","en":"Nothing is counted for new risks (AI-enabled fraud, vendor dependency, compliance) or for revenue from new products.","ar":"لا يُحتسب شيء للمخاطر الجديدة (الاحتيال بالذكاء الاصطناعي، الاعتماد على المزودين، الامتثال) ولا لإيرادات المنتجات الجديدة."},{"fr":"La première étape chez vous n'est donc pas de discuter ces chiffres, mais de mesurer vos références T0 et de lancer deux pilotes contrôlés.","en":"The first step in your organisation is therefore not to debate these figures, but to measure your T0 baselines and launch two controlled pilots.","ar":"الخطوة الأولى لديكم إذًا ليست مناقشة هذه الأرقام، بل قياس خطوط الأساس T0 لديكم وإطلاق تجربتين مضبوطتين."}],"fileNote":{"fr":"Le fichier de calcul livré avec le book (value-tree-assureur-type.xlsx) contient les hypothèses, les formules et les résultats, modifiables ligne par ligne ; le simulateur ci-dessous en est la version interactive.","en":"The calculation file delivered with the book (value-tree-assureur-type.xlsx) contains the assumptions, formulas and results, editable line by line; the simulator below is its interactive version.","ar":"يحتوي ملف الحساب المرفق بالدليل (value-tree-assureur-type.xlsx) على الفرضيات والصيغ والنتائج، قابلة للتعديل سطرًا بسطر؛ والمحاكي أدناه نسخته التفاعلية."},"simulatorTitle":{"fr":"Simulateur : recalculer la value tree avec vos ordres de grandeur","en":"Simulator: recalculate the value tree with your orders of magnitude","ar":"المحاكي: إعادة حساب شجرة القيمة بأرقامكم الإرشادية"},"simulatorIntro":{"fr":"Remplacez les hypothèses de l'assureur type par les vôtres : primes, ratios sinistres, effectifs, coûts, effets unitaires par bloc. Les graphiques et tableaux de cette section se recalculent ; le reste du book garde les chiffres de l'assureur type.","en":"Replace the reference insurer's assumptions with your own: premiums, loss ratios, headcount, costs, unit effects by block. The charts and tables in this section recalculate; the rest of the book keeps the reference insurer's figures.","ar":"استبدلوا بفرضيات شركة التأمين النموذجية فرضياتكم: الأقساط، ونسب الخسائر، والقوى العاملة، والتكاليف، والآثار الوحدوية لكل كتلة. تُعاد حسابات الرسوم البيانية والجداول في هذا القسم؛ ويحتفظ باقي الدليل بأرقام شركة التأمين النموذجية."},"simulatorNote":{"fr":"Le simulateur reproduit exactement le modèle du fichier de calcul ; il ne remplace pas une mesure T0 ni un pilote contrôlé. Les saisies restent dans votre navigateur et ne sont transmises nulle part.","en":"The simulator reproduces the calculation file model exactly; it does not replace a T0 measurement or a controlled pilot. Entries stay in your browser and are transmitted nowhere.","ar":"يعيد المحاكي إنتاج نموذج ملف الحساب بدقة؛ ولا يحل محل قياس T0 ولا تجربة مضبوطة. تبقى المدخلات في متصفحكم ولا تُرسل إلى أي جهة."}},"found":{"intro":{"fr":"Rien de ce qui précède ne fonctionne sans fondations : des données en produits, une plateforme qui expose les systèmes cœur et les modèles, des agents outillés, journalisés et bornés, une sécurité qui traite les agents comme des identités, des compétences. Ce chapitre décrit les dix fondations, ce que chaque famille de cas exige des données, l'architecture cible de la plateforme de données et de modèles, l'anatomie d'un agent d'assurance, l'échelle d'autonomie, la sécurité, les compétences, puis le niveau de maturité exigé de chaque fondation à chaque vague et la grille pour s'auto-évaluer.","en":"None of the above works without foundations: data as products, a platform that exposes core systems and models, agents that are tooled, logged and bounded, security that treats agents as identities, skills. This chapter describes the ten foundations, what each case family requires of data, the target architecture of the data and model platform, the anatomy of an insurance agent, the autonomy scale, security, skills, then the maturity level required of each foundation at each wave and the grid for self-assessment.","ar":"لا شيء مما سبق يعمل من دون أسس: بيانات في شكل منتجات، ومنصة تكشف الأنظمة الأساسية والنماذج، ووكلاء مجهزون بالأدوات ومسجلون ومحدودو النطاق، وأمن يعامل الوكلاء بوصفهم هويات، ومهارات. يصف هذا الفصل الأسس العشرة، وما تتطلبه كل عائلة حالات من البيانات، والهيكل المستهدف لمنصة البيانات والنماذج، وتشريح وكيل التأمين، وسلّم الاستقلالية، والأمن، والمهارات، ثم مستوى النضج المطلوب من كل أساس في كل موجة وشبكة التقييم الذاتي."},"tenTitle":{"fr":"Dix fondations à financer avant la valeur","en":"Ten foundations to fund before value","ar":"عشرة أسس تُموَّل قبل القيمة"},"cost":{"fr":"Coût dans la simulation : 19 à 25 M€ par an de socles, données, intégration, changement et conformité, soit 0,4 à 0,5 % des primes de l'assureur type ; le plan de Generali pèse à peu près autant (1,2 à 1,3 milliard d'euros sur 2025-2027 pour 95,2 milliards de primes 2024).","en":"Cost in the simulation: €19m to €25m per year of capabilities, data, integration, change and compliance, i.e. 0.4 to 0.5% of the reference insurer's premiums; Generali's plan weighs roughly as much (1.2 to 1.3 billion euros over 2025-2027 for 95.2 billion of 2024 premiums).","ar":"التكلفة في المحاكاة: 19 إلى 25 مليون يورو سنويًا للقدرات المشتركة والبيانات والتكامل والتغيير والامتثال، أي 0,4 إلى 0,5% من أقساط شركة التأمين النموذجية؛ وتزن خطة Generali ما يقارب ذلك (1,2 إلى 1,3 مليار يورو على 2025-2027 مقابل 95,2 مليار يورو من أقساط 2024)."},"order":{"fr":"Ordre de construction : les fondations 1, 6 et 7 d'abord (sans données, sans API ni identité, rien ne tourne), puis 2, 4, 5 et 8 ensemble, 3 et 9 dès le premier prototype, 10 en programme de fond.","en":"Build order: foundations 1, 6 and 7 first (without data, APIs or identity, nothing runs), then 2, 4, 5 and 8 together, 3 and 9 from the first prototype, 10 as a background programme.","ar":"ترتيب البناء: الأسس 1 و6 و7 أولًا (من دون بيانات ولا API ولا هوية، لا شيء يعمل)، ثم 2 و4 و5 و8 معًا، و3 و9 منذ أول نموذج أولي، و10 برنامجًا أساسيًا مستمرًا."},"dataTitle":{"fr":"Données : ce que chaque famille de cas exige avant de démarrer","en":"Data: what each case family requires before starting","ar":"البيانات: ما تتطلبه كل عائلة حالات قبل الانطلاق"},"dataRows":[{"f":{"fr":"Sinistres et fraude","en":"Claims and fraud","ar":"المطالبات والاحتيال"},"d":{"fr":"Historique de cinq ans ligne à ligne, pièces et photos, réparateurs, graphe des tiers","en":"Five-year line-by-line history, documents and photos, repairers, third-party graph","ar":"سجل خمس سنوات سطرًا بسطر، مستندات وصور، جهات إصلاح، رسم بياني للأطراف الثالثة"},"q":{"fr":"Champs clés complets, pièces indexées, consentement pour les données externes","en":"Key fields complete, documents indexed, consent for external data","ar":"حقول رئيسية مكتملة، مستندات مفهرسة، موافقة على البيانات الخارجية"},"i":{"fr":"Taux de dossiers complets","en":"Rate of complete files","ar":"معدل الملفات المكتملة"}},{"f":{"fr":"Souscription et contrats","en":"Underwriting and policy administration","ar":"الاكتتاب والعقود"},"d":{"fr":"Soumissions et pièces, registres, imagerie, géo-climat, appétence codifiée","en":"Submissions and documents, registers, imagery, geo-climate, codified appetite","ar":"طلبات اكتتاب ومستندات، سجلات، صور، بيانات جغرافية-مناخية، شهية مخاطر مقننة"},"q":{"fr":"Référentiel produit unique, délégations écrites, API vers les systèmes cœur","en":"Single product reference, written delegations, APIs to core systems","ar":"مرجع منتجات موحد، تفويضات مكتوبة، API نحو الأنظمة الأساسية"},"i":{"fr":"Part des règles codifiées","en":"Share of codified rules","ar":"حصة القواعد المقننة"}},{"f":{"fr":"Tarification et provisions","en":"Pricing and reserving","ar":"التسعير والمخصصات"},"d":{"fr":"Expositions et sinistres au bon grain, variables externes, triangles","en":"Exposures and claims at the right grain, external variables, triangles","ar":"تعرضات ومطالبات بالدقة المناسبة، متغيرات خارجية، مثلثات"},"q":{"fr":"Lignage documenté, tables versionnées, pistes d'audit","en":"Documented lineage, versioned tables, audit trails","ar":"نسب موثق، جداول مؤرخة الإصدارات، مسارات تدقيق"},"i":{"fr":"Écart entre base tarifaire et base comptable","en":"Gap between pricing base and accounting base","ar":"الفجوة بين قاعدة التسعير والقاعدة المحاسبية"}},{"f":{"fr":"Relation client et distribution","en":"Customer service and distribution","ar":"علاقات العملاء والتوزيع"},"d":{"fr":"Identité client unique, contrats, historique omnicanal, consentements","en":"Single customer identity, policies, omnichannel history, consents","ar":"هوية عميل موحدة، عقود، سجل متعدد القنوات، موافقات"},"q":{"fr":"Dédoublonnage, oppositions, finalités déclarées","en":"Deduplication, opt-outs, declared purposes","ar":"إزالة التكرار، الاعتراضات، أغراض معلنة"},"i":{"fr":"Taux de clients uniques","en":"Rate of unique customers","ar":"معدل العملاء الموحدين"}},{"f":{"fr":"Capital, ALM, réassurance","en":"Capital, ALM, reinsurance","ar":"رأس المال وALM وإعادة التأمين"},"d":{"fr":"Bilan au grain contrat, actifs transparisés, traités","en":"Balance sheet at policy grain, look-through assets, treaties","ar":"ميزانية بدقة العقد، أصول شفافة، اتفاقيات إعادة تأمين"},"q":{"fr":"Réconciliation comptable, clôture reproductible","en":"Accounting reconciliation, reproducible close","ar":"تسوية محاسبية، إقفال قابل للتكرار"},"i":{"fr":"Écarts de réconciliation","en":"Reconciliation differences","ar":"فروق التسوية"}},{"f":{"fr":"Assistants et agents internes","en":"Internal assistants and agents","ar":"المساعدون والوكلاء الداخليون"},"d":{"fr":"Corpus gouverné (procédures, conditions, notes), droits d'accès","en":"Governed corpus (procedures, terms and conditions, notes), access rights","ar":"مجموعة نصوص محكومة (إجراءات، شروط، مذكرات)، حقوق وصول"},"q":{"fr":"Propriétaire par document, classification de sensibilité","en":"Owner per document, sensitivity classification","ar":"مالك لكل مستند، تصنيف للحساسية"},"i":{"fr":"Taux de réponses sourcées","en":"Rate of sourced answers","ar":"معدل الإجابات الموثقة بمصدر"}}],"dataNote":{"fr":"Un produit de données a un propriétaire métier, un contrat de qualité, un accès par API et une documentation ; sans ces quatre attributs, ce n'est pas un socle. Les données de santé restent réservées à la prévention et aux prestations ; les consentements sont tracés (RGPD ; loi saoudienne de protection des données, PDPL). Cadre juridique : RGPD article 22, Opinion EIOPA 2025, bulletin NAIC et règles du Colorado sur les données externes.","en":"A data product has a business owner, a quality contract, API access and documentation; without these four attributes, it is not a capability. Health data remains reserved for prevention and benefits; consents are tracked (GDPR; Saudi Personal Data Protection Law, PDPL). Legal framework: GDPR article 22, EIOPA Opinion 2025, NAIC bulletin and Colorado rules on external data.","ar":"لمنتج البيانات مالك من الأعمال، وعقد جودة، ووصول عبر API، وتوثيق؛ ومن دون هذه السمات الأربع لا يكون قدرة مشتركة. تبقى البيانات الصحية مقصورة على الوقاية والمنافع؛ وتُتتبع الموافقات (اللائحة العامة لحماية البيانات (GDPR)؛ نظام حماية البيانات الشخصية السعودي PDPL). الإطار القانوني: المادة 22 من GDPR، ورأي EIOPA 2025، ونشرة NAIC وقواعد كولورادو بشأن البيانات الخارجية."},"dpTitle":{"fr":"Plateforme de données cible : cinq couches, deux transverses","en":"Target data platform: five layers, two cross-cutting","ar":"منصة البيانات المستهدفة: خمس طبقات واثنتان عرضيتان"},"dpIntro":{"fr":"Architecture de référence indépendante des éditeurs ; exemples de marché : Core Tech chez Generali (2026), Global AI Hub chez AXA (2026). Chaque usage lit des produits de données, jamais les systèmes sources.","en":"Vendor-independent reference architecture; market examples: Core Tech at Generali (2026), Global AI Hub at AXA (2026). Every use reads data products, never the source systems.","ar":"هيكل مرجعي مستقل عن الموردين؛ أمثلة من السوق: Core Tech لدى Generali (2026)، وGlobal AI Hub لدى AXA (2026). كل استخدام يقرأ منتجات بيانات، لا الأنظمة المصدرية أبدًا."},"dpLayers":[{"h":{"fr":"5 · Consommation","en":"5 · Consumption","ar":"5 · الاستهلاك"},"p":{"fr":"Agents et copilotes, modèles de machine learning, moteurs tarifaires et actuariels, reporting et BI, API partenaires.","en":"Agents and copilots, machine learning models, pricing and actuarial engines, reporting and BI, partner APIs.","ar":"الوكلاء والمساعدون الذكيون، ونماذج التعلم الآلي، ومحركات التسعير والمحركات الاكتوارية، والتقارير وذكاء الأعمال، وAPI الشركاء."}},{"h":{"fr":"4 · Sémantique, features, index","en":"4 · Semantics, features, indexes","ar":"4 · الدلالات والخصائص والفهارس"},"p":{"fr":"Modèle sémantique métier (contrat, sinistre, client, risque), feature store tarifaire versionné, index documentaire et vectoriel pour le RAG, graphe client et fraude.","en":"Business semantic model (policy, claim, customer, risk), versioned pricing feature store, document and vector index for RAG, customer and fraud graph.","ar":"نموذج دلالي للأعمال (العقد، المطالبة، العميل، الخطر)، ومخزن خصائص تسعير مؤرخ الإصدارات، وفهرس مستندي ومتجهي لـ RAG، ورسم بياني للعملاء والاحتيال."}},{"h":{"fr":"3 · Lakehouse gouverné","en":"3 · Governed lakehouse","ar":"3 · Lakehouse محكوم"},"p":{"fr":"Zones brute, raffinée et produit ; catalogue, lignage, contrats de qualité, propriétaires ; historisation au grain contrat et dossier ; rétention et droit à l'effacement.","en":"Raw, refined and product zones; catalogue, lineage, quality contracts, owners; history at policy and file grain; retention and right to erasure.","ar":"مناطق خام ومنقحة ومنتجات؛ كتالوج، ونسب، وعقود جودة، ومالكون؛ أرشفة تاريخية بدقة العقد والملف؛ الاحتفاظ والحق في المحو."}},{"h":{"fr":"2 · Ingestion et intégration","en":"2 · Ingestion and integration","ar":"2 · الاستيعاب والتكامل"},"p":{"fr":"Flux événementiels depuis les systèmes cœur, API, batchs, capture documentaire (OCR, extraction), données externes sous contrat (registres, géo-climat, télématique, réseaux de soins).","en":"Event streams from core systems, APIs, batches, document capture (OCR, extraction), external data under contract (registers, geo-climate, telematics, care networks).","ar":"تدفقات أحداث من الأنظمة الأساسية، وAPI، ودفعات، والتقاط مستندي (OCR، استخراج)، وبيانات خارجية بموجب عقود (سجلات، بيانات جغرافية-مناخية، قياس عن بُعد، شبكات رعاية)."}},{"h":{"fr":"1 · Sources","en":"1 · Sources","ar":"1 · المصادر"},"p":{"fr":"Systèmes cœur contrats et sinistres, gestion documentaire, télécoms et canaux, comptabilité et actuariat, partenaires et courtiers, objets connectés.","en":"Policy and claims core systems, document management, telecoms and channels, accounting and actuarial, partners and brokers, connected devices.","ar":"الأنظمة الأساسية للعقود والمطالبات، وإدارة المستندات، والاتصالات والقنوات، والمحاسبة والاكتواريا، والشركاء والوسطاء، والأجهزة المتصلة."}}],"dpTrans":[{"h":{"fr":"Transverse · Sécurité et identité","en":"Cross-cutting · Security and identity","ar":"عرضي · الأمن والهوية"},"p":{"fr":"Identités des humains et des agents, moindre privilège, chiffrement, consentements, classification de sensibilité, journal d'accès.","en":"Identities for humans and agents, least privilege, encryption, consents, sensitivity classification, access log.","ar":"هويات البشر والوكلاء، والحد الأدنى من الامتيازات، والتشفير، والموافقات، وتصنيف الحساسية، وسجل الوصول."}},{"h":{"fr":"Transverse · Observabilité et FinOps","en":"Cross-cutting · Observability and FinOps","ar":"عرضي · المراقبة وFinOps"},"p":{"fr":"Qualité, fraîcheur, coûts de calcul et de stockage par produit de données et par cas d'usage ; alertes de dérive.","en":"Quality, freshness, compute and storage costs per data product and per use case; drift alerts.","ar":"الجودة، والحداثة، وتكاليف الحوسبة والتخزين لكل منتج بيانات ولكل حالة استخدام؛ وتنبيهات الانحراف."}}],"dpMin":{"fr":"Prérequis minimal pour la vague 1 : couches 1 à 3 sur les domaines sinistres et contrats, index documentaire (couche 4) et identité des agents (transverse) ; le reste se construit en vague 2.","en":"Minimum prerequisite for wave 1: layers 1 to 3 on the claims and policy domains, document index (layer 4) and agent identity (cross-cutting); the rest is built in wave 2.","ar":"الحد الأدنى من المتطلبات المسبقة للموجة 1: الطبقات 1 إلى 3 على مجالي المطالبات والعقود، والفهرس المستندي (الطبقة 4)، وهوية الوكلاء (عرضي)؛ ويُبنى الباقي في الموجة 2."},"mpTitle":{"fr":"Plateforme de modèles : un guichet unique, réversible, mesuré","en":"Model platform: a single, reversible, measured gateway","ar":"منصة النماذج: نافذة موحدة، قابلة للعكس، مقيسة"},"mpCards":[{"h":{"fr":"Passerelle multi-fournisseurs","en":"Multi-vendor gateway","ar":"بوابة متعددة المزودين"},"p":{"fr":"Un accès unique aux modèles (hébergés, cloud, open source), routage vers le modèle suffisant le moins cher, bascule sans réécriture.","en":"Single access to models (hosted, cloud, open source), routing to the cheapest sufficient model, switching without rewriting.","ar":"وصول موحد إلى النماذج (مستضافة، سحابية، مفتوحة المصدر)، وتوجيه نحو النموذج الكافي الأقل تكلفة، وتبديل دون إعادة كتابة."}},{"h":{"fr":"Registre et cycle de vie","en":"Registry and lifecycle","ar":"السجل ودورة الحياة"},"p":{"fr":"Modèles, prompts, agents et jeux d'évaluation versionnés ; promotion par environnement ; lien avec l'inventaire AI Act.","en":"Versioned models, prompts, agents and evaluation sets; promotion by environment; link to the AI Act inventory.","ar":"نماذج وتعليمات ووكلاء ومجموعات تقييم مؤرخة الإصدارات؛ ترقية حسب البيئة؛ ربط بجرد قانون الذكاء الاصطناعي الأوروبي (AI Act)."}},{"h":{"fr":"Évaluation continue","en":"Continuous evaluation","ar":"التقييم المستمر"},"p":{"fr":"Jeux de test métier par cas (dossiers annotés), seuils d'acceptation, re-test à chaque changement de modèle ou de prompt, suivi de la dérive.","en":"Business test sets per case (annotated files), acceptance thresholds, re-testing at every model or prompt change, drift monitoring.","ar":"مجموعات اختبار مهنية لكل حالة (ملفات معلَّمة)، وعتبات قبول، وإعادة اختبار عند كل تغيير في النموذج أو التعليمات، ومتابعة الانحراف."}},{"h":{"fr":"Garde-fous","en":"Guardrails","ar":"ضوابط الأمان"},"p":{"fr":"Filtrage des entrées et des sorties, détection d'injection, masquage des données personnelles, outils limités, réponses sourcées.","en":"Input and output filtering, injection detection, personal data masking, limited tools, sourced answers.","ar":"تصفية المدخلات والمخرجات، وكشف الحقن، وإخفاء البيانات الشخصية، وأدوات محدودة، وإجابات موثقة بمصدر."}},{"h":{"fr":"Observabilité et coût par transaction","en":"Observability and cost per transaction","ar":"المراقبة والتكلفة لكل معاملة"},"p":{"fr":"Traces, latence, qualité, jetons consommés ; budgets par cas d'usage, cache, alertes ; 10 % de la valeur brute dans la simulation.","en":"Traces, latency, quality, tokens consumed; budgets per use case, caching, alerts; 10% of gross value in the simulation.","ar":"آثار، وزمن استجابة، وجودة، ورموز مستهلكة؛ ميزانيات لكل حالة استخدام، وذاكرة مؤقتة، وتنبيهات؛ 10% من القيمة الإجمالية في المحاكاة."}},{"h":{"fr":"Fournisseurs sous DORA","en":"Vendors under DORA","ar":"المزودون بموجب DORA"},"p":{"fr":"Modèles et plateformes inscrits au registre des prestataires TIC, tests de résilience, plan de sortie ; un tiers des cas d'usage britanniques sont des solutions tierces (BoE et FCA).","en":"Models and platforms entered in the ICT third-party register, resilience testing, exit plan; a third of UK use cases are third-party solutions (BoE and FCA).","ar":"نماذج ومنصات مدرجة في سجل مزودي تقنية المعلومات، واختبارات مرونة، وخطة خروج؛ وثلث حالات الاستخدام البريطانية حلول من أطراف ثالثة (BoE وFCA)."}}],"mpBbp":{"fr":"Construire, acheter ou s'associer : acheter le standard (intelligence documentaire générique, vision automobile), construire l'avantage (tarification, appétence, jumeaux numériques), s'associer pour les données externes.","en":"Build, buy or partner: buy the standard (generic document intelligence, motor vision), build the advantage (pricing, appetite, digital twins), partner for external data.","ar":"البناء أو الشراء أو الشراكة: شراء ما هو قياسي (ذكاء المستندات العام، الرؤية الحاسوبية للسيارات)، وبناء ما يصنع الميزة (التسعير، شهية المخاطر، التوائم الرقمية)، والشراكة من أجل البيانات الخارجية."},"mpPrecedents":{"fr":"Précédents : AXA a bâti Secure GPT en trois mois puis déployé Copilot mondialement en 2026 ; Ki annonce des coûts de ré-entraînement réduits de 90 % (chiffre de l'éditeur).","en":"Precedents: AXA built Secure GPT in three months then rolled out Copilot globally in 2026; Ki reports retraining costs cut by 90% (vendor figure).","ar":"سوابق: بنت AXA منصة Secure GPT في ثلاثة أشهر ثم نشرت Copilot عالميًا في 2026؛ وتعلن Ki عن تكاليف إعادة تدريب مخفضة بنسبة 90% (رقم من المورد)."},"agTitle":{"fr":"Anatomie d'un agent d'assurance : sept composants déclarés","en":"Anatomy of an insurance agent: seven declared components","ar":"تشريح وكيل التأمين: سبعة مكونات معلنة"},"agComps":[{"h":{"fr":"1 · Périmètre et niveau d'autonomie","en":"1 · Scope and autonomy level","ar":"1 · النطاق ومستوى الاستقلالية"},"p":{"fr":"Quels dossiers, quelles décisions, de L1 à L5 ; hors périmètre, l'agent refuse et escalade.","en":"Which files, which decisions, from L1 to L5; out of scope, the agent refuses and escalates.","ar":"أي ملفات، وأي قرارات، من L1 إلى L5؛ وخارج النطاق يرفض الوكيل ويصعّد."}},{"h":{"fr":"2 · Outils appelables","en":"2 · Callable tools","ar":"2 · الأدوات القابلة للاستدعاء"},"p":{"fr":"API des systèmes cœur, moteur tarifaire, paiement, gestion documentaire, modèles de machine learning ; jamais d'écran ni de macro.","en":"Core system APIs, rating engine, payment, document management, machine learning models; never screens or macros.","ar":"API الأنظمة الأساسية، ومحرك التسعير، والدفع، وإدارة المستندات، ونماذج التعلم الآلي؛ لا شاشات ولا وحدات ماكرو أبدًا."}},{"h":{"fr":"3 · Contexte et mémoire","en":"3 · Context and memory","ar":"3 · السياق والذاكرة"},"p":{"fr":"Produits de données, corpus documentaire gouverné, mémoire de dossier bornée et purgée.","en":"Data products, governed document corpus, bounded and purged file memory.","ar":"منتجات بيانات، ومجموعة نصوص مستندية محكومة، وذاكرة ملف محدودة وتُمحى."}},{"h":{"fr":"4 · Planification et seuils","en":"4 · Planning and thresholds","ar":"4 · التخطيط والعتبات"},"p":{"fr":"Décomposition des tâches, seuils de délégation en montant et en risque, escalade vers l'humain.","en":"Task decomposition, delegation thresholds by amount and risk, escalation to a human.","ar":"تفكيك المهام، وعتبات تفويض بالمبلغ وبالخطر، وتصعيد إلى الإنسان."}},{"h":{"fr":"5 · Journalisation rejouable","en":"5 · Replayable logging","ar":"5 · تسجيل قابل لإعادة التشغيل"},"p":{"fr":"Chaque appel, chaque décision, chaque source ; l'auditeur rejoue le dossier.","en":"Every call, every decision, every source; the auditor replays the file.","ar":"كل استدعاء، وكل قرار، وكل مصدر؛ ويعيد المدقق تشغيل الملف."}},{"h":{"fr":"6 · Évaluation et garde-fous","en":"6 · Evaluation and guardrails","ar":"6 · التقييم وضوابط الأمان"},"p":{"fr":"Jeu de test métier avant la mise en service, contrôle a posteriori par échantillon, détection d'injection.","en":"Business test set before go-live, post-hoc control by sampling, injection detection.","ar":"مجموعة اختبار مهنية قبل الدخول في الخدمة، ورقابة لاحقة بالعينة، وكشف الحقن."}},{"h":{"fr":"7 · Propriétaire humain","en":"7 · Human owner","ar":"7 · المالك البشري"},"p":{"fr":"Un responsable métier nommé par agent, qui révise les seuils en comité et répond des résultats.","en":"A named business owner per agent, who reviews the thresholds in committee and answers for the results.","ar":"مسؤول من الأعمال معيَّن لكل وكيل، يراجع العتبات في اللجنة ويتحمل مسؤولية النتائج."}}],"agOrch":{"h":{"fr":"Orchestration","en":"Orchestration","ar":"التنسيق"},"p":{"fr":"Un superviseur route vers les agents spécialisés (sept agents chez Allianz Australie), gère les files, les reprises et les escalades.","en":"A supervisor routes to the specialised agents (seven agents at Allianz Australia), manages queues, retries and escalations.","ar":"مشرف يوجّه نحو الوكلاء المتخصصين (سبعة وكلاء لدى Allianz أستراليا)، ويدير قوائم الانتظار وإعادة المحاولات والتصعيدات."}},"agStats":[{"v":{"fr":"84 / 957","en":"84 / 957","ar":"84 / 957"},"t":{"fr":"cas d'IA générative recensés par l'EIOPA sont agentiques (février 2026) : la vague arrive, elle n'est pas encore là.","en":"generative AI cases recorded by EIOPA are agentic (February :"Pilotage mixte humains-agents : seuils, exceptions, coût","en":"Mixed human-agent management: thresholds, exceptions, cost","ar":"إدارة مختلطة بين البشر والوكلاء: العتبات والاستثناءات والتكلفة"},"skills":{"fr":"Conduite du changement, redesign des processus","en":"Change management, process redesign","ar":"إدارة التغيير، إعادة تصميم العمليات"}}],"skillsNote":{"fr":"25 % des dirigeants de l'assurance citent la pénurie de talents comme premier frein (Accenture Pulse of Change, 2026) ; AXA accompagne son déploiement de Copilot en 2026 d'un programme de montée en compétences.","en":"25% of insurance executives cite the talent shortage as the first obstacle (Accenture Pulse of Change, 2026); AXA accompanies its 2026 Copilot roll-out with an upskilling programme.","ar":"25% من قادة التأمين يذكرون نقص المواهب عائقًا أول (Accenture Pulse of Change، 2026)؛ وترافق AXA نشر Copilot لديها في 2026 ببرنامج لرفع المهارات."},"matrixTitle":{"fr":"Prérequis par vague : le niveau de maturité exigé de chaque fondation","en":"Prerequisites by wave: the maturity level required of each foundation","ar":"المتطلبات المسبقة حسب الموجة: مستوى النضج المطلوب من كل أساس"},"matrixIntro":{"fr":"Un cas d'usage ne démarre pas si sa fondation est sous le niveau requis ; les niveaux renvoient à la grille de maturité ci-dessous. Cibles de plan, pas une mesure de marché.","en":"A use case does not start if its foundation is below the required level; the levels refer to the maturity grid below. Plan targets, not a market measurement.","ar":"لا تنطلق حالة استخدام إذا كان أساسها دون المستوى المطلوب؛ وتحيل المستويات إلى شبكة النضج أدناه. أهداف خطة، لا قياس للسوق."},"levels":[{"fr":"Initial","en":"Initial","ar":"أولي"},{"fr":"Piloté","en":"Managed","ar":"مُدار"},{"fr":"Industrialisé","en":"Industrialised","ar":"مصنَّع"},{"fr":"Délégué","en":"Delegated","ar":"مفوَّض"},{"fr":"Autonome encadré","en":"Supervised autonomy","ar":"مستقل مؤطَّر"}],"matrixRows":[{"f":{"fr":"1 · Produits de données","en":"1 · Data pr
