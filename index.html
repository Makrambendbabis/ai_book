nderwriting: orchestration, evaluation and core system APIs industrialised.","ar":"وكلاء L3 على المطالبات البسيطة والاكتتاب: تنسيق وتقييم وAPI للأنظمة الأساسية مصنَّعة."}},{"h":{"fr":"Vague 3 · autonomie encadrée","en":"Wave 3 · supervised autonomy","ar":"الموجة 3 · استقلالية مؤطَّرة"},"p":{"fr":"Règlements automatiques L4 et jumeaux numériques : tout au niveau 4, sauf le post-quantique, programme de fond jusqu'en 2030-2035.","en":"L4 automatic settlements and digital twins: everything at level 4, except post-quantum, a background programme until 2030-2035.","ar":"تسويات آلية L4 وتوائم رقمية: كل شيء في المستوى 4، باستثناء ما بعد الكمومي، وهو برنامج أساسي مستمر حتى 2030-2035."}}],"matTitle":{"fr":"Grille de maturité : cinq niveaux sur quatre axes","en":"Maturity grid: five levels on four axes","ar":"شبكة النضج: خمسة مستويات على أربعة محاور"},"matAxes":[{"a":{"fr":"Données","en":"Data","ar":"البيانات"},"l":[{"fr":"Extractions manuelles, qualité inconnue","en":"Manual extracts, quality unknown","ar":"استخراجات يدوية، جودة مجهولة"},{"fr":"Produits de données sur un domaine, qualité mesurée","en":"Data products on one domain, quality measured","ar":"منتجات بيانات على مجال واحد، جودة مقيسة"},{"fr":"Catalogue, lignage, contrats de qualité, API","en":"Catalogue, lineage, quality contracts, APIs","ar":"كتالوج، نسب، عقود جودة، API"},{"fr":"Temps réel, consentements tracés, données externes","en":"Real time, consents tracked, external data","ar":"الوقت الفعلي، موافقات متتبَّعة، بيانات خارجية"},{"fr":"Produits partagés au niveau du groupe, qualité pilotée","en":"Products shared at group level, quality managed","ar":"منتجات مشتركة على مستوى المجموعة، جودة مُدارة"}]},{"a":{"fr":"Plateforme et modèles","en":"Platform and models","ar":"المنصة والنماذج"},"l":[{"fr":"Outils isolés, accès individuels","en":"Isolated tools, individual access","ar":"أدوات معزولة، وصول فردي"},{"fr":"Passerelle commune, premiers jeux d'évaluation","en":"Common gateway, first evaluation sets","ar":"بوابة مشتركة، أولى مجموعات التقييم"},{"fr":"Registre, évaluation à chaque changement, coût suivi","en":"Registry, evaluation at every change, cost tracked","ar":"سجل، تقييم عند كل تغيير، تكلفة متابَعة"},{"fr":"Routage multi-modèles, réversibilité testée","en":"Multi-model routing, reversibility tested","ar":"توجيه متعدد النماذج، قابلية عكس مختبَرة"},{"fr":"Optimisation continue, modèles spécialisés","en":"Continuous optimisation, specialised models","ar":"تحسين مستمر، نماذج متخصصة"}]},{"a":{"fr":"Agents et contrôle","en":"Agents and control","ar":"الوكلاء والرقابة"},"l":[{"fr":"Pilotes sans propriétaire ni seuils","en":"Pilots without owner or thresholds","ar":"تجارب بلا مالك ولا عتبات"},{"fr":"Copilotes L2 avec journal, inventaire tenu","en":"L2 copilots with log, inventory maintained","ar":"مساعدون ذكيون L2 مع سجل، جرد محدَّث"},{"fr":"Agents L3 sous seuils, contrôle a posteriori","en":"L3 agents within thresholds, post-hoc control","ar":"وكلاء L3 ضمن العتبات، رقابة لاحقة"},{"fr":"Agents L4 bornés, contrôle sur population complète","en":"Bounded L4 agents, control on the full population","ar":"وكلاء L4 محدودو النطاق، رقابة على كامل المجتمع"},{"fr":"Portefeuille d'agents gouverné, niveaux pilotés","en":"Governed agent portfolio, levels managed","ar":"محفظة وكلاء محكومة، مستويات مُدارة"}]},{"a":{"fr":"Organisation et compétences","en":"Organisation and skills","ar":"التنظيم والمهارات"},"l":[{"fr":"Initiatives dispersées","en":"Scattered initiatives","ar":"مبادرات متفرقة"},{"fr":"Comité IA, politique, premiers métiers formés","en":"AI committee, policy, first roles trained","ar":"لجنة ذكاء اصطناعي، سياسة، أولى المهن المدرَّبة"},{"fr":"Usine IA, financement en portefeuille, cockpit","en":"AI factory, portfolio funding, cockpit","ar":"مصنع ذكاء اصطناعي، تمويل بالمحفظة، لوحة قيادة"},{"fr":"Métiers superviseurs d'agents, rôles redéfinis","en":"Roles supervising agents, redefined roles","ar":"مهن مشرفة على الوكلاء، أدوار معاد تعريفها"},{"fr":"Opérations humains-agents, un seul système","en":"Human-agent operations, a single system","ar":"عمليات بين البشر والوكلاء، نظام واحد"}]}],"matHow":{"fr":"Mode d'emploi : noter sur preuve (document, mesure, démonstration), jamais sur déclaration ; le niveau global est le plus faible des quatre ; cible de vague 1 : 2 partout, 3 en contrôle.","en":"How to use: score on evidence (document, measurement, demonstration), never on declaration; the overall level is the lowest of the four; wave 1 target: 2 everywhere, 3 in control.","ar":"طريقة الاستخدام: التقييم على أساس الدليل (مستند، قياس، عرض توضيحي)، لا على أساس التصريح أبدًا؛ والمستوى الإجمالي هو الأضعف بين المحاور الأربعة؛ وهدف الموجة 1: المستوى 2 في كل مكان، و3 في الرقابة."},"matMarket":{"fr":"Repère de marché : l'indice Evident 2026 classe les assureurs sur le talent, l'innovation, le leadership et la transparence, pas sur le nombre de pilotes. Grille proposée par le book, alignée sur les niveaux d'autonomie L1-L5 et l'Opinion EIOPA 2025.","en":"Market reference: the Evident 2026 index ranks insurers on talent, innovation, leadership and transparency, not on the number of pilots. Grid proposed by the book, aligned with the L1-L5 autonomy levels and the EIOPA Opinion 2025.","ar":"معلم من السوق: يصنّف مؤشر Evident 2026 شركات التأمين حسب المواهب والابتكار والقيادة والشفافية، لا حسب عدد التجارب. شبكة يقترحها الدليل، متوائمة مع مستويات الاستقلالية L1-L5 ورأي EIOPA 2025."}},"errors":{"intro":{"fr":"Les programmes d'IA échouent rarement sur la technologie ; ils échouent sur l'absence de propriétaire, de socles, de seuils, de mesure et de conduite du changement. Ce chapitre réunit huit pièges de passage à l'échelle et leur parade, cinq contre-exemples documentés et ce qu'ils enseignent, neuf anti-patterns techniques, et ce qu'il ne faut pas faire dans les cent premiers jours.","en":"AI programmes rarely fail on technology; they fail on the absence of an owner, capabilities, thresholds, measurement and change management. This chapter brings together eight scaling traps and their counter-measures, five documented counter-examples and what they teach, nine technical anti-patterns, and what not to do in the first hundred days.","ar":"نادرًا ما تفشل برامج الذكاء الاصطناعي بسبب التقنية؛ بل تفشل لغياب المالك والقدرات المشتركة والعتبات والقياس وإدارة التغيير. يجمع هذا الفصل ثمانية فخاخ في التوسع وتدبيرها المضاد، وخمسة أمثلة مضادة موثقة وما تعلّمه، وتسعة أنماط تقنية مضادة، وما لا ينبغي فعله في المئة يوم الأولى."},"trapsTitle":{"fr":"Huit pièges de passage à l'échelle, et la parade de chacun","en":"Eight scaling traps, and the counter-measure for each","ar":"ثمانية فخاخ في التوسع، والتدبير المضاد لكل منها"},"trapsNote":{"fr":"Les pièges 1, 2 et 4 produisent des programmes qui restent en productivité locale ; 3 et 6 produisent des contentieux ; 5 et 8 se paient vers 2029, quand les volumes montent.","en":"Traps 1, 2 and 4 produce programmes that stay in local productivity; 3 and 6 produce litigation; 5 and 8 are paid for around 2029, when volumes rise.","ar":"تنتج الفخاخ 1 و2 و4 برامج تبقى في الإنتاجية المحلية؛ وينتج الفخان 3 و6 نزاعات قضائية؛ ويُدفع ثمن الفخين 5 و8 نحو 2029، حين ترتفع الأحجام."},"lessonsTitle":{"fr":"Cinq contre-exemples documentés et ce qu'ils enseignent","en":"Five documented counter-examples and what they teach","ar":"خمسة أمثلة مضادة موثقة وما تعلّمه"},"lessons":[{"h":{"fr":"UnitedHealth, nH Predict (2023-2025)","en":"UnitedHealth, nH Predict (2023-2025)","ar":"UnitedHealth، nH Predict (2023-2025)"},"p":{"fr":"Action collective au Minnesota : refus de soins post-aigus allégués sans examen individuel ; plus de 90 % de refus annulés en appel selon les plaignants ; griefs maintenus en 2025. Les allégations n'ont pas été jugées au fond et l'entreprise les conteste.","en":"Class action in Minnesota: alleged refusals of post-acute care without individual review; more than 90% of refusals overturned on appeal according to the plaintiffs; claims upheld in 2025. The allegations have not been decided on the merits and the company disputes them.","ar":"دعوى جماعية في مينيسوتا: رفض مزعوم لرعاية ما بعد الحالات الحادة دون فحص فردي؛ وأكثر من 90% من حالات الرفض أُلغيت عند الاستئناف بحسب المدعين؛ وأُبقي على الادعاءات في 2025. لم يُفصل في الادعاءات موضوعيًا وتنفيها الشركة."},"l":{"fr":"Les refus de prestation restent humains ; le taux d'annulation en appel entre au cockpit.","en":"Benefit refusals remain human; the appeal overturn rate enters the cockpit.","ar":"رفض المنافع يبقى بشريًا؛ ومعدل الإلغاء عند الاستئناف يدخل لوحة القيادة."},"ref":"unitedhealth-nh"},{"h":{"fr":"Cigna, PxDx (2022-2023)","en":"Cigna, PxDx (2022-2023)","ar":"Cigna، PxDx (2022-2023)"},"p":{"fr":"300 000 demandes rejetées en deux mois, 1,2 seconde de revue médicale en moyenne selon ProPublica ; action collective en Californie ; Cigna décrit un appariement de codes sans IA.","en":"300,000 requests rejected in two months, 1.2 seconds of medical review on average according to ProPublica; class action in California; Cigna describes code matching without AI.","ar":"300 000 طلب مرفوض في شهرين، بمعدل 1,2 ثانية من المراجعة الطبية بحسب ProPublica؛ دعوى جماعية في كاليفورنيا؛ وتصف Cigna الأمر بمطابقة رموز دون ذكاء اصطناعي."},"l":{"fr":"Même des règles appliquées en masse exposent quand une revue individuelle est attendue.","en":"Even rules applied at scale create exposure when individual review is expected.","ar":"حتى القواعد المطبقة على نطاق واسع تعرّض للمساءلة حين تكون المراجعة الفردية متوقعة."},"ref":"cigna-pxdx"},{"h":{"fr":"SCOR, premiers pilotes (2023-2026)","en":"SCOR, first pilots (2023-2026)","ar":"SCOR، التجارب الأولى (2023-2026)"},"p":{"fr":"L'assistant interne a d'abord allongé les délais, le temps de vérifier les sorties contre les documents sources ; plus de cent utilisateurs et un million de pages par mois ensuite.","en":"The internal assistant initially lengthened cycle times, while outputs were checked against source documents; more than a hundred users and a million pages per month thereafter.","ar":"أطال المساعد الداخلي الآجال في البداية، ريثما تُتحقق المخرجات مقابل المستندات المصدرية؛ ثم أكثر من مئة مستخدم ومليون صفحة شهريًا لاحقًا."},"l":{"fr":"Planifier la courbe en J et les jeux d'évaluation avant le déploiement.","en":"Plan for the J-curve and the evaluation sets before deployment.","ar":"التخطيط لمنحنى J ومجموعات التقييم قبل النشر."},"ref":"scor-ai"},{"h":{"fr":"Marché britannique, enquête BoE et FCA (2024)","en":"UK market, BoE and FCA survey (2024)","ar":"السوق البريطانية، استطلاع BoE وFCA (2024)"},"p":{"fr":"46 % des entreprises déclarent ne comprendre que partiellement les technologies d'IA qu'elles utilisent ; un tiers des cas d'usage sont des implémentations tierces.","en":"46% of firms report only a partial understanding of the AI technologies they use; a third of use cases are third-party implementations.","ar":"46% من الشركات تصرّح بأنها لا تفهم سوى جزئيًا تقنيات الذكاء الاصطناعي التي تستخدمها؛ وثلث حالات الاستخدام تنفيذات من أطراف ثالثة."},"l":{"fr":"Gouvernance des fournisseurs et compétences internes avant l'achat.","en":"Vendor governance and internal skills before purchase.","ar":"حوكمة المزودين والمهارات الداخلية قبل الشراء."},"ref":"boe-fca-2024"},{"h":{"fr":"Trente grands assureurs, Evident (2026)","en":"Thirty large insurers, Evident (2026)","ar":"ثلاثون شركة تأمين كبرى، Evident (2026)"},"p":{"fr":"Sur 65 cas publiés avec résultats, 8 % seulement améliorent la qualité de décision de bout en bout ; la majorité reste en productivité locale.","en":"Of 65 published cases with results, only 8% improve end-to-end decision quality; the majority stays in local productivity.","ar":"من بين 65 حالة منشورة بنتائج، 8% فقط تحسّن جودة القرار من البداية إلى النهاية؛ وتبقى الغالبية في الإنتاجية المحلية."},"l":{"fr":"Viser les boucles de valeur entre maillons, pas les gains isolés.","en":"Target value loops between value-chain steps, not isolated gains.","ar":"استهداف حلقات القيمة بين الحلقات، لا المكاسب المعزولة."},"ref":"evident-2026"}],"apTitle":{"fr":"Neuf anti-patterns techniques qui coûtent le plus cher","en":"Nine technical anti-patterns that cost the most","ar":"تسعة أنماط تقنية مضادة هي الأكثر كلفة"},"ap":[{"h":{"fr":"Un RAG sans jeu d'évaluation","en":"A RAG without an evaluation set","ar":"RAG بلا مجموعة تقييم"},"p":{"fr":"Un assistant qui cite mal sans qu'on le sache ; 38 % des assureurs de l'Union utilisent la génération augmentée par recherche et les hallucinations sont leur première préoccupation (EIOPA, 2026).","en":"An assistant that cites wrongly without anyone knowing; 38% of EU insurers use retrieval-augmented generation and hallucinations are their first concern (EIOPA, 2026).","ar":"مساعد يستشهد خطأً من دون أن يُعلم ذلك؛ 38% من شركات التأمين في الاتحاد تستخدم التوليد المعزز بالاسترجاع والهلوسات شاغلها الأول (EIOPA، 2026)."}},{"h":{"fr":"Des agents qui pilotent des écrans","en":"Agents that drive screens","ar":"وكلاء يتحكمون في الشاشات"},"p":{"fr":"Robots qui cliquent dans les systèmes cœur faute d'API : fragiles, non journalisés, impossibles à auditer ; exposer les systèmes cœur d'abord.","en":"Robots clicking through core systems for want of APIs: fragile, unlogged, impossible to audit; expose the core systems first.","ar":"روبوتات تنقر في الأنظمة الأساسية لغياب API: هشة، وغير مسجلة، ويستحيل تدقيقها؛ فليُكشف عن الأنظمة الأساسية أولًا."}},{"h":{"fr":"Des prompts comme logique métier","en":"Prompts as business logic","ar":"تعليمات بوصفها منطق أعمال"},"p":{"fr":"Seuils, règles de délégation et exclusions écrits dans un prompt plutôt que dans un moteur de règles versionné et testable.","en":"Thresholds, delegation rules and exclusions written in a prompt rather than in a versioned, testable rules engine.","ar":"عتبات وقواعد تفويض واستثناءات مكتوبة في تعليمات بدلًا من محرك قواعد مؤرخ الإصدارات وقابل للاختبار."}},{"h":{"fr":"Des données personnelles dans les prompts","en":"Personal data in prompts","ar":"بيانات شخصية في التعليمات"},"p":{"fr":"Dossiers médicaux ou identités envoyés sans masquage ni base légale ; AXA a bâti Secure GPT précisément pour l'éviter dès 2023.","en":"Medical records or identities sent without masking or legal basis; AXA built Secure GPT precisely to avoid this from 2023.","ar":"ملفات طبية أو هويات تُرسل دون إخفاء ولا أساس قانوني؛ وقد بنت AXA منصة Secure GPT تحديدًا لتجنب ذلك منذ 2023."}},{"h":{"fr":"Une mesure sur le jeu d'entraînement","en":"Measurement on the training set","ar":"قياس على مجموعة التدريب"},"p":{"fr":"Précision annoncée sur des cas déjà vus ; exiger un jeu de test métier tenu à l'écart, annoté par des gestionnaires et rafraîchi.","en":"Accuracy announced on cases already seen; require a held-out business test set, annotated by handlers and refreshed.","ar":"دقة معلنة على حالات سبقت رؤيتها؛ فليُشترط مجموعة اختبار مهنية معزولة، يعلّمها المعالجون وتُجدَّد."}},{"h":{"fr":"Des variables proxy en tarification","en":"Proxy variables in pricing","ar":"متغيرات بديلة في التسعير"},"p":{"fr":"Des variables qui reconstituent une caractéristique protégée (arrêt Test-Achats, règles du Colorado, ACPR 2026) : tests d'équité par groupe obligatoires.","en":"Variables that reconstruct a protected characteristic (Test-Achats ruling, Colorado rules, ACPR 2026): fairness tests by group mandatory.","ar":"متغيرات تعيد تشكيل خاصية محمية (حكم Test-Achats، قواعد كولورادو، ACPR 2026): اختبارات عدالة لكل فئة إلزامية."}},{"h":{"fr":"Du code généré non validé","en":"Unvalidated generated code","ar":"كود مولَّد غير متحقق منه"},"p":{"fr":"Un modèle de langage produit du code actuariel plausible ; la SOA rappelle qu'un code généré n'est pas un code validé : revue, tests, reproductibilité.","en":"A language model produces plausible actuarial code; the SOA reminds us that generated code is not validated code: review, tests, reproducibility.","ar":"ينتج نموذج لغوي كودًا اكتواريًا معقولًا؛ وتذكّر SOA بأن الكود المولَّد ليس كودًا متحققًا منه: مراجعة، واختبارات، وقابلية للتكرار."}},{"h":{"fr":"Un modèle pour tout","en":"One model for everything","ar":"نموذج واحد لكل شيء"},"p":{"fr":"Le modèle le plus cher sur chaque requête ; router vers le modèle suffisant, mettre en cache, mesurer le coût par dossier.","en":"The most expensive model on every request; route to the sufficient model, cache, measure the cost per file.","ar":"النموذج الأغلى على كل طلب؛ فليُوجَّه إلى النموذج الكافي، مع ذاكرة مؤقتة، وقياس التكلفة لكل ملف."}},{"h":{"fr":"Pas de plan de sortie fournisseur","en":"No vendor exit plan","ar":"لا خطة خروج من المزود"},"p":{"fr":"Prompts, évaluations et données prisonniers d'une plateforme ; DORA exige un plan de sortie pour les prestataires critiques.","en":"Prompts, evaluations and data locked into a platform; DORA requires an exit plan for critical providers.","ar":"تعليمات وتقييمات وبيانات أسيرة منصة واحدة؛ وتشترط DORA خطة خروج للمزودين الحرجين."}}],"apRefs":{"fr":"Sources : EIOPA (fév. 2026) ; AXA (2023) ; CJUE C-236/09 ; ACPR (juil. 2026) ; SOA Research Institute (2025) ; DORA (UE) 2022/2554.","en":"Sources: EIOPA (Feb. 2026); AXA (2023); CJEU C-236/09; ACPR (Jul. 2026); SOA Research Institute (2025); DORA (EU) 2022/2554.","ar":"المصادر: EIOPA (فبراير 2026)؛ AXA (2023)؛ CJUE C-236/09؛ ACPR (يوليو 2026)؛ SOA Research Institute (2025)؛ DORA (الاتحاد الأوروبي) 2022/2554."},"dontTitle":{"fr":"Ce qu'on ne fait pas dans les cent premiers jours","en":"What not to do in the first hundred days","ar":"ما لا يُفعل في المئة يوم الأولى"},"dont":[{"fr":"Lancer dix pilotes en parallèle sans propriétaire ni indicateur.","en":"Launch ten pilots in parallel without an owner or an indicator.","ar":"إطلاق عشر تجارب بالتوازي بلا مالك ولا مؤشر."},{"fr":"Acheter une plateforme avant d'avoir des produits de données et des API.","en":"Buy a platform before having data products and APIs.","ar":"شراء منصة قبل امتلاك منتجات بيانات وAPI."},{"fr":"Promettre des millions d'euros au COMEX avant la mesure T0.","en":"Promise millions of euros to the COMEX before the T0 measurement.","ar":"الوعد بملايين اليورو أمام اللجنة التنفيذية (COMEX) قبل قياس T0."},{"fr":"Confier un refus de prestation ou une décision sur une personne à un modèle.","en":"Entrust a benefit refusal or a decision on a person to a model.","ar":"إسناد رفض منفعة أو قرار بشأن شخص إلى نموذج."}]},"how":{"intro":{"fr":"La démarche tient en une règle : chaque étape produit une mesure avant la suivante, et aucun cas n'est financé sans indicateur, référence T0 et propriétaire métier. Ce chapitre déroule les cinq étapes, les cent premiers jours, la trajectoire 2026-2030, le contenu des trois vagues, le modèle opérationnel, le financement, la mesure et la conduite du changement.","en":"The approach comes down to one rule: each step produces a measurement before the next, and no case is funded without an indicator, a T0 baseline and a business owner. This chapter walks through the five steps, the first hundred days, the 2026-2030 trajectory, the content of the three waves, the operating model, funding, measurement and change management.","ar":"تتلخص المنهجية في قاعدة واحدة: كل مرحلة تنتج قياسًا قبل التالية، ولا تُموَّل أي حالة دون مؤشر وخط أساس T0 ومالك من الأعمال. يعرض هذا الفصل المراحل الخمس، والمئة يوم الأولى، والمسار 2026-2030، ومحتوى الموجات الثلاث، ونموذج التشغيل، والتمويل، والقياس، وإدارة التغيير."},"approachTitle":{"fr":"La démarche en cinq étapes, de la mesure T0 à l'industrialisation","en":"The five-step approach, from T0 measurement to industrialisation","ar":"المنهجية في خمس مراحل، من قياس T0 إلى التصنيع"},"approach":[{"t":{"fr":"Étape 1 · 6 semaines","en":"Step 1 · 6 weeks","ar":"المرحلة 1 · 6 أسابيع"},"h":{"fr":"Diagnostic et références","en":"Diagnosis and baselines","ar":"التشخيص وخطوط الأساس"},"p":{"fr":"Mesure T0 des indicateurs du cockpit, grille de maturité sur preuve, inventaire des systèmes d'IA existants, cartographie des données.","en":"T0 measurement of the cockpit indicators, evidence-based maturity grid, inventory of existing AI systems, data mapping.","ar":"قياس T0 لمؤشرات لوحة القيادة، وشبكة نضج على أساس الدليل، وجرد أنظمة الذكاء الاصطناعي القائمة، ورسم خريطة البيانات."},"d":{"fr":"Baseline chiffrée, niveau de maturité","en":"Quantified baseline, maturity level","ar":"خط أساس مرقّم، مستوى نضج"}},{"t":{"fr":"Étape 2 · 4 semaines","en":"Step 2 · 4 weeks","ar":"المرحلة 2 · 4 أسابيع"},"h":{"fr":"Priorisation et value tree","en":"Prioritisation and value tree","ar":"تحديد الأولويات وشجرة القيمة"},"p":{"fr":"Catalogue filtré par ligne et segment, simulation recalculée avec vos données, choix des gains rapides et des paris, socles à financer.","en":"Catalogue filtered by line and segment, simulation recalculated with your data, choice of quick wins and bets, capabilities to fund.","ar":"كتالوج مصفّى حسب الخط والشريحة، ومحاكاة معاد حسابها ببياناتكم، واختيار المكاسب السريعة والرهانات، وقدرات مشتركة للتمويل."},"d":{"fr":"Portefeuille et value tree propres","en":"Own portfolio and value tree","ar":"محفظة وشجرة قيمة خاصتان بكم"}},{"t":{"fr":"Étape 3 · 6 mois","en":"Step 3 · 6 months","ar":"المرحلة 3 · 6 أشهر"},"h":{"fr":"Socles et premiers pilotes contrôlés","en":"Capabilities and first controlled pilots","ar":"القدرات المشتركة وأولى التجارب المضبوطة"},"p":{"fr":"Plateforme, produits de données sinistres et contrats, registre IA, deux pilotes avec groupe de contrôle (copilote sinistres, ingestion des soumissions).","en":"Platform, claims and policy data products, AI register, two pilots with a control group (claims copilot, submission ingestion).","ar":"منصة، ومنتجات بيانات للمطالبات والعقود، وسجل للذكاء الاصطناعي، وتجربتان مع مجموعة ضابطة (مساعد ذكي للمطالبات، استيعاب طلبات الاكتتاب)."},"d":{"fr":"Effets unitaires mesurés","en":"Measured unit effects","ar":"آثار وحدوية مقيسة"}},{"t":{"fr":"Étape 4 · 12 à 18 mois","en":"Step 4 · 12 to 18 months","ar":"المرحلة 4 · 12 إلى 18 شهرًا"},"h":{"fr":"Vagues et montée en autonomie","en":"Waves and rising autonomy","ar":"الموجات ورفع الاستقلالية"},"p":{"fr":"Déploiement par vague, passage de L2 à L3 sur preuve, orchestration multi-agents, cockpit mensuel, arrêt des cas qui ne bougent pas l'indicateur.","en":"Deployment by wave, move from L2 to L3 on evidence, multi-agent orchestration, monthly cockpit, stopping cases that do not move the indicator.","ar":"نشر حسب الموجة، وانتقال من L2 إلى L3 على أساس الدليل، وتنسيق متعدد الوكلاء، ولوحة قيادة شهرية، وإيقاف الحالات التي لا تحرّك المؤشر."},"d":{"fr":"Valeur constatée au cockpit","en":"Value observed in the cockpit","ar":"قيمة ملاحَظة في لوحة القيادة"}},{"t":{"fr":"Étape 5 · en continu","en":"Step 5 · ongoing","ar":"المرحلة 5 · بشكل مستمر"},"h":{"fr":"Industrialisation et gouvernance","en":"Industrialisation and governance","ar":"التصنيع والحوكمة"},"p":{"fr":"Usine IA groupe, financement en portefeuille, revue trimestrielle du book, re-classification AI Act, plan de compétences.","en":"Group AI factory, portfolio funding, quarterly review of the book, AI Act re-classification, skills plan.","ar":"مصنع ذكاء اصطناعي للمجموعة، وتمويل بالمحفظة، ومراجعة فصلية للدليل، وإعادة تصنيف وفق AI Act، وخطة مهارات."},"d":{"fr":"Un système opéré, pas un programme","en":"An operated system, not a programme","ar":"نظام يُشغَّل، لا برنامج"}}],"approachRule":{"fr":"Repères de marché : Allianz Australie est passée de l'idée à la production en moins de cent jours sur un périmètre étroit ; Hiscox de la preuve de concept (décembre 2023) à la production (août 2024) en huit mois. Durées indicatives pour un assureur de taille intermédiaire.","en":"Market references: Allianz Australia went from idea to production in under a hundred days on a narrow scope; Hiscox from proof of concept (December 2023) to production (August 2024) in eight months. Indicative durations for a mid-sized insurer.","ar":"معالم من السوق: انتقلت Allianz أستراليا من الفكرة إلى الإنتاج في أقل من مئة يوم على نطاق ضيق؛ وانتقلت Hiscox من إثبات المفهوم (ديسمبر 2023) إلى الإنتاج (أغسطس 2024) في ثمانية أشهر. مدد إرشادية لشركة تأمين متوسطة الحجم."},"f100Title":{"fr":"Les cent premiers jours","en":"The first hundred days","ar":"المئة يوم الأولى"},"f100":[{"h":{"fr":"Jours 1 à 30 · Décider","en":"Days 1 to 30 · Decide","ar":"الأيام 1 إلى 30 · القرار"},"items":[{"fr":"Mandat du COMEX et propriétaire exécutif","en":"COMEX mandate and executive owner","ar":"تفويض اللجنة التنفيذية (COMEX) ومالك تنفيذي"},{"fr":"Comité IA avec risques, conformité, DSI et métiers","en":"AI committee with risk, compliance, IT and the business lines","ar":"لجنة ذكاء اصطناعي تضم المخاطر والامتثال وإدارة نظم المعلومات والأعمال"},{"fr":"Politique IA et règle de financement","en":"AI policy and funding rule","ar":"سياسة الذكاء الاصطناعي وقاعدة التمويل"},{"fr":"Inventaire des systèmes d'IA existants, solutions tierces comprises","en":"Inventory of existing AI systems, third-party solutions included","ar":"جرد أنظمة الذكاء الاصطناعي القائمة، بما فيها حلول الأطراف الثالثة"},{"fr":"Choix des deux pilotes contrôlés et de leurs indicateurs","en":"Choice of the two controlled pilots and their indicators","ar":"اختيار التجربتين المضبوطتين ومؤشريهما"}],"out":{"fr":"Mandat, comité, politique, inventaire initial","en":"Mandate, committee, policy, initial inventory","ar":"تفويض، لجنة، سياسة، جرد أولي"}},{"h":{"fr":"Jours 31 à 60 · Mesurer","en":"Days 31 to 60 · Measure","ar":"الأيام 31 إلى 60 · القياس"},"items":[{"fr":"Mesure T0 des douze indicateurs du cockpit","en":"T0 measurement of the twelve cockpit indicators","ar":"قياس T0 لمؤشرات لوحة القيادة الاثني عشر"},{"fr":"Grille de maturité renseignée sur preuve","en":"Maturity grid completed on evidence","ar":"شبكة نضج مستوفاة على أساس الدليل"},{"fr":"Cartographie des données sinistres et contrats, qualité mesurée","en":"Mapping of claims and policy data, quality measured","ar":"رسم خريطة بيانات المطالبات والعقود، بجودة مقيسة"},{"fr":"Passerelle de modèles et identités d'agents en place","en":"Model gateway and agent identities in place","ar":"بوابة النماذج وهويات الوكلاء في مكانها"},{"fr":"Jeux d'évaluation des deux pilotes constitués","en":"Evaluation sets for the two pilots built","ar":"تكوين مجموعات التقييم للتجربتين"}],"out":{"fr":"Baseline, maturité, plateforme minimale","en":"Baseline, maturity, minimum platform","ar":"خط أساس، نضج، منصة دنيا"}},{"h":{"fr":"Jours 61 à 100 · Prouver","en":"Days 61 to 100 · Prove","ar":"الأيام 61 إلى 100 · الإثبات"},"items":[{"fr":"Pilotes en production sur périmètre borné, avec groupe de contrôle","en":"Pilots in production on a bounded scope, with a control group","ar":"تجارب في الإنتاج على نطاق محدود، مع مجموعة ضابطة"},{"fr":"Lecture hebdomadaire des indicateurs et du coût par transaction","en":"Weekly reading of the indicators and the cost per transaction","ar":"قراءة أسبوعية للمؤشرات والتكلفة لكل معاملة"},{"fr":"Value tree recalculée avec les premiers effets mesurés","en":"Value tree recalculated with the first measured effects","ar":"شجرة قيمة معاد حسابها بأولى الآثار المقيسة"},{"fr":"Plan de vague 1 et budget des socles présentés au COMEX","en":"Wave 1 plan and capabilities budget presented to the COMEX","ar":"خطة الموجة 1 وميزانية القدرات المشتركة معروضتان على COMEX"}],"out":{"fr":"Effets mesurés, plan de vague 1 financé","en":"Measured effects, wave 1 plan funded","ar":"آثار مقيسة، خطة موجة 1 ممولة"}}],"f100Team":{"fr":"Équipe : un propriétaire exécutif, un responsable de la valeur, un architecte données-IA, un responsable des risques IA, deux binômes métier-IA pour les pilotes ; huit à douze personnes.","en":"Team: an executive owner, a value lead, a data-AI architect, an AI risk lead, two business-AI pairs for the pilots; eight to twelve people.","ar":"الفريق: مالك تنفيذي، ومسؤول عن القيمة، ومهندس بيانات وذكاء اصطناعي، ومسؤول عن مخاطر الذكاء الاصطناعي، وثنائيان من الأعمال والذكاء الاصطناعي للتجربتين؛ ثمانية إلى اثني عشر شخصًا."},"roadTitle":{"fr":"Trajectoire 2026-2030 : trois vagues adossées aux fondations","en":"2026-2030 trajectory: three waves backed by the foundations","ar":"المسار 2026-2030: ثلاث موجات مستندة إلى الأسس"},"roadCols":[{"fr":"T4 2026","en":"Q4 2026","ar":"الربع الرابع 2026"},{"fr":"2027","en":"2027","ar":"2027"},{"fr":"2028","en":"2028","ar":"2028"},{"fr":"2029","en":"2029","ar":"2029"},{"fr":"2030","en":"2030","ar":"2030"}],"roadRows":[{"h":{"fr":"Cent premiers jours","en":"First hundred days","ar":"المئة يوم الأولى"},"bars":[{"a":0,"b":1,"t":{"fr":"Mandat, T0, deux pilotes contrôlés","en":"Mandate, T0, two controlled pilots","ar":"تفويض، T0، تجربتان مضبوطتان"}}]},{"h":{"fr":"Fondations (10)","en":"Foundations (10)","ar":"الأسس (10)"},"bars":[{"a":1,"b":3,"t":{"fr":"Construction : données, plateforme, registre, API","en":"Build: data, platform, register, APIs","ar":"البناء: البيانات، المنصة، السجل، API"}},{"a":3,"b":5,"t":{"fr":"Run, extension, post-quantique","en":"Run, extension, post-quantum","ar":"التشغيل، التوسع، ما بعد الكمومي"}}]},{"h":{"fr":"Vague 1 · prouver","en":"Wave 1 · prove","ar":"الموجة 1 · الإثبات"},"bars":[{"a":1,"b":2.5,"t":{"fr":"Copilotes L2, triage, fraude","en":"L2 copilots, triage, fraud","ar":"مساعدون ذكيون L2، فرز، احتيال"}}]},{"h":{"fr":"Vague 2 · orchestrer","en":"Wave 2 · orchestrate","ar":"الموجة 2 · التنسيق"},"bars":[{"a":2.5,"b":4,"t":{"fr":"Agents L3, jumeaux, haut risque","en":"L3 agents, twins, high risk","ar":"وكلاء L3، توائم، مخاطر عالية"}}]},{"h":{"fr":"Vague 3 · rupture","en":"Wave 3 · disruption","ar":"الموجة 3 · التحول الجذري"},"bars":[{"a":4,"b":5,"t":{"fr":"L4 bornés, agents clients","en":"Bounded L4, customer agents","ar":"L4 محدودو النطاق، وكلاء العملاء"}}]},{"h":{"fr":"Gouvernance et conformité","en":"Governance and compliance","ar":"الحوكمة والامتثال"},"bars":[{"a":1,"b":2,"t":{"fr":"30 janv. 2027 · Solvabilité II révisée","en":"30 Jan. 2027 · revised Solvency II","ar":"30 يناير 2027 · الملاءة 2 (Solvency II) المراجعة"}},{"a":2,"b":3,"t":{"fr":"2 déc. 2027 · AI Act haut risque","en":"2 Dec. 2027 · AI Act high risk","ar":"2 ديسمبر 2027 · AI Act المخاطر العالية"}}]},{"h":{"fr":"Compétences, changement","en":"Skills, change","ar":"المهارات والتغيير"},"bars":[{"a":1,"b":5,"t":{"fr":"Supervision d'agents, rôles redéfinis, plan de talents","en":"Agent supervision, redefined roles, talent plan","ar":"الإشراف على الوكلاء، أدوار معاد تعريفها، خطة مواهب"}}]}],"roadNet":{"fr":"Valeur nette (simulation)","en":"Net value (simulation)","ar":"القيمة الصافية (محاكاة)"},"roadNote":{"fr":"Une vague ne démarre que si ses fondations atteignent le niveau requis (chapitre 9) ; la conformité haut risque (vie, santé, évaluation des personnes) doit être prête avant le 2 décembre 2027, c'est-à-dire pendant la vague 1. Jalons : Règlement (UE) 2026/1744 ; révision de Solvabilité II.","en":"A wave starts only if its foundations reach the required level (chapter 9); high-risk compliance (life, health, assessment of persons) must be ready before 2 December 2027, that is during wave 1. Milestones: Regulation (EU) 2026/1744; Solvency II review.","ar":"لا تنطلق موجة إلا إذا بلغت أسسها المستوى المطلوب (الفصل 9)؛ ويجب أن يكون الامتثال للمخاطر العالية (الحياة، الصحة، تقييم الأشخاص) جاهزًا قبل 2 ديسمبر 2027، أي خلال الموجة 1. المعالم: اللائحة (الاتحاد الأوروبي) 2026/1744؛ مراجعة الملاءة 2 (Solvency II)."},"wavesTitle":{"fr":"Le contenu des trois vagues","en":"The content of the three waves","ar":"محتوى الموجات الثلاث"},"waves":[{"t":{"fr":"Vague 1 · 2027 – mi-2028","en":"Wave 1 · 2027 – mid-2028","ar":"الموجة 1 · 2027 – منتصف 2028"},"h":{"fr":"Prouver et industrialiser","en":"Prove and industrialise","ar":"الإثبات والتصنيع"},"p":{"fr":"Copilotes sinistres et souscription (L2), ingestion des soumissions, triage des sinistres, score de fraude en temps réel, assistants internes, intelligence documentaire, premiers agents sous seuils sur les avenants et les contacts simples.","en":"Claims and underwriting copilots (L2), submission ingestion, claims triage, real-time fraud score, internal assistants, document intelligence, first agents within thresholds on endorsements and simple contacts.","ar":"مساعدون ذكيون (copilot) للمطالبات والاكتتاب (L2)، واستيعاب طلبات الاكتتاب، وفرز المطالبات، ودرجة احتيال في الوقت الفعلي، ومساعدون داخليون، وذكاء المستندات، وأوائل الوكلاء ضمن العتبات على الملاحق والاتصالات البسيطة."},"f":{"fr":"Fondations : socle documentaire, plateforme de modèles, registre IA, identités d'agents, produits de données sinistres et contrats.","en":"Foundations: document capability, model platform, AI register, agent identities, claims and policy data products.","ar":"الأسس: القدرة المستندية المشتركة، ومنصة النماذج، وسجل الذكاء الاصطناعي، وهويات الوكلاء، ومنتجات بيانات المطالبات والعقود."},"s":{"fr":"{n1} cas H1 éligibles · valeur simulée 2028 : {g28} M€ bruts","en":"{n1} eligible H1 cases · simulated 2028 value: €{g28}m gross","ar":"{n1} حالة H1 مؤهلة · القيمة المحاكاة 2028: {g28} مليون يورو إجمالية"}},{"t":{"fr":"Vague 2 · mi-2028 – 2029","en":"Wave 2 · mid-2028 – 2029","ar":"الموجة 2 · منتصف 2028 – 2029"},"h":{"fr":"Orchestrer de bout en bout","en":"Orchestrate end to end","ar":"التنسيق من البداية إلى النهاية"},"p":{"fr":"Processus multi-agents sur les sinistres simples et la souscription PME (L3), remboursements santé automatisés, jumeaux numériques de tarification et de clôture, agent de clôture actuarielle, conformité haut risque vie et santé en production.","en":"Multi-agent processes on simple claims and SME underwriting (L3), automated health reimbursements, pricing and close digital twins, actuarial close agent, high-risk life and health compliance in production.","ar":"عمليات متعددة الوكلاء على المطالبات البسيطة واكتتاب الشركات الصغيرة والمتوسطة (L3)، وتعويضات صحية آلية، وتوائم رقمية للتسعير والإقفال، ووكيل إقفال اكتواري، وامتثال للمخاطر العالية في الحياة والصحة في الإنتاج."},"f":{"fr":"Fondations : orchestration et journalisation, produits de données étendus, moteur de simulation, API des systèmes cœur industrialisées.","en":"Foundations: orchestration and logging, extended data products, simulation engine, industrialised core system APIs.","ar":"الأسس: التنسيق والتسجيل، ومنتجات بيانات موسعة، ومحرك محاكاة، وAPI للأنظمة الأساسية مصنَّعة."},"s":{"fr":"{n2} cas H2 · valeur simulée 2029 : {g29} M€ bruts","en":"{n2} H2 cases · simulated 2029 value: €{g29}m gross","ar":"{n2} حالة H2 · القيمة المحاكاة 2029: {g29} مليون يورو إجمالية"}},{"t":{"fr":"Vague 3 · 2030","en":"Wave 3 · 2030","ar":"الموجة 3 · 2030"},"h":{"fr":"Préparer la rupture","en":"Prepare for disruption","ar":"الاستعداد للتحول الجذري"},"p":{"fr":"Règlements automatiques L4 bornés, dialogue avec les assistants personnels des clients, jumeau du bilan et ORSA continu, allocation du capital par maille, calcul hybride si l'avantage quantique est démontré.","en":"Bounded L4 automatic settlements, dialogue with customers' personal assistants, balance-sheet twin and continuous ORSA, capital allocation by cell, hybrid computing if the quantum advantage is demonstrated.","ar":"تسويات آلية L4 محدودة النطاق، وحوار مع المساعدين الشخصيين للعملاء، وتوأم الميزانية وORSA المستمر، وتخصيص رأس المال حسب الخلية، وحوسبة هجينة إن ثبتت الأفضلية الكمومية."},"f":{"fr":"Fondations : cryptographie post-quantique, partenariats de recherche, offres lisibles par machine, contrôle sur population complète.","en":"Foundations: post-quantum cryptography, research partnerships, machine-readable offers, control on the full population.","ar":"الأسس: التشفير ما بعد الكمومي، والشراكات البحثية، والعروض القابلة للقراءة آليًا، والرقابة على كامل المجتمع."},"s":{"fr":"{n3} cas H3 et extensions · valeur simulée 2030 : {g30} M€ bruts","en":"{n3} H3 cases and extensions · simulated 2030 value: €{g30}m gross","ar":"{n3} حالة H3 وتوسعات · القيمة المحاكاة 2030: {g30} مليون يورو إجمالية"}}],"opTitle":{"fr":"Modèle opérationnel : une usine, des équipes produit, une gouvernance","en":"Operating model: a factory, product teams, a governance","ar":"نموذج التشغيل: مصنع، وفرق منتجات، وحوكمة"},"op":[{"h":{"fr":"Usine IA groupe","en":"Group AI factory","ar":"مصنع ذكاء اصطناعي للمجموعة"},"p":{"fr":"Socles, plateforme, évaluation, FinOps et sécurité mutualisés ; elle livre des composants réutilisables, pas des cas d'usage, et mesure le coût par transaction.","en":"Pooled capabilities, platform, evaluation, FinOps and security; it delivers reusable components, not use cases, and measures the cost per transaction.","ar":"قدرات مشتركة ومنصة وتقييم وFinOps وأمن مشتركة؛ يسلّم مكونات قابلة لإعادة الاستخدام، لا حالات استخدام، ويقيس التكلفة لكل معاملة."}},{"h":{"fr":"Équipes produit par chaîne de valeur","en":"Product teams by value chain","ar":"فرق منتجات حسب سلسلة القيمة"},"p":{"fr":"Métier, actuariat, data et IT dans une même équipe, avec un propriétaire de valeur et un indicateur du cockpit ; une équipe par maillon prioritaire (sinistres, souscription, tarification, fraude).","en":"Business, actuarial, data and IT in the same team, with a value owner and a cockpit indicator; one team per priority value-chain step (claims, underwriting, pricing, fraud).","ar":"الأعمال والاكتواريا والبيانات وتقنية المعلومات في فريق واحد، مع مالك للقيمة ومؤشر في لوحة القيادة؛ فريق لكل حلقة ذات أولوية (المطالبات، الاكتتاب، التسعير، الاحتيال)."}},{"h":{"fr":"Centre d'expertise actuarielle augmentée","en":"Augmented actuarial centre of expertise","ar":"مركز خبرة اكتوارية معززة"},"p":{"fr":"Standards de modélisation, validation des sorties d'IA, jumeaux numériques, équité ; l'actuaire reste le valideur et le traducteur pour le COMEX.","en":"Modelling standards, validation of AI outputs, digital twins, fairness; the actuary remains the validator and the translator for the COMEX.","ar":"معايير النمذجة، والتحقق من مخرجات الذكاء الاصطناعي، والتوائم الرقمية، والعدالة؛ ويبقى الاكتواري المُحقق والمترجم للجنة التنفيذية (COMEX)."}},{"h":{"fr":"Gouvernance IA intégrée aux risques","en":"AI governance embedded in risk","ar":"حوكمة ذكاء اصطناعي مدمجة في المخاطر"},"p":{"fr":"Comité IA mensuel (métiers, risques, conformité, DSI, DPO), inventaire et classification continus, seuils de délégation révisés en comité, contrôle permanent de deuxième ligne.","en":"Monthly AI committee (business lines, risk, compliance, IT, DPO), continuous inventory and classification, delegation thresholds reviewed in committee, permanent second-line control.","ar":"لجنة ذكاء اصطناعي شهرية (الأعمال، المخاطر، الامتثال، إدارة نظم المعلومات، مسؤول حماية البيانات)، وجرد وتصنيف مستمران، وعتبات تفويض تُراجع في اللجنة، ورقابة دائمة من الخط الثاني."}},{"h":{"fr":"Plan de compétences","en":"Skills plan","ar":"خطة المهارات"},"p":{"fr":"Formation des métiers à la supervision d'agents et à l'usage critique, parcours actuaires (machine learning, modèles de langage, simulation), recrutement ciblé d'ingénieurs d'agents.","en":"Training of the business lines in agent supervision and critical use, actuary pathways (machine learning, language models, simulation), targeted recruitment of agent engineers.","ar":"تدريب موظفي الأعمال على الإشراف على الوكلاء والاستخدام النقدي، ومسارات للاكتواريين (التعلم الآلي، النماذج اللغوية، المحاكاة)، وتوظيف موجه لمهندسي الوكلاء."}},{"h":{"fr":"Rituels","en":"Rituals","ar":"الطقوس"},"p":{"fr":"Cockpit mensuel au COMEX, revue trimestrielle du portefeuille et du book, arrêt des cas sans effet mesuré, re-classification réglementaire à chaque évolution.","en":"Monthly cockpit at the COMEX, quarterly review of the portfolio and the book, stopping cases without measured effect, regulatory re-classification at every change.","ar":"لوحة قيادة شهرية أمام COMEX، ومراجعة فصلية للمحفظة والدليل، وإيقاف الحالات بلا أثر مقيس، وإعادة تصنيف تنظيمية عند كل تطور."}}],"fundTitle":{"fr":"Financer en portefeuille : les socles par le groupe, les cas par les métiers","en":"Portfolio funding: capabilities by the group, cases by the business lines","ar":"التمويل بالمحفظة: القدرات المشتركة من المجموعة، والحالات من الأعمال"},"fundChartTitle":{"fr":"Structure du coût de possession (simulation, M€ par an, borne haute en régime de croisière)","en":"Structure of the cost of ownership (simulation, €m per year, upper bound in steady state)","ar":"هيكل تكلفة الامتلاك (محاكاة، مليون يورو سنويًا، الحد الأعلى في الوضع المستقر)"},"fundNote":{"fr":"Fixe {fixLo} à {fixHi} M€ par an (0,4 à 0,5 % des primes), variable {varRate} de la valeur brute ; total {tcoLo} à {tcoHi} M€ en régime de croisière.","en":"Fixed €{fixLo}m to €{fixHi}m per year (0.4 to 0.5% of premiums), variable {varRate} of gross value; total €{tcoLo}m to €{tcoHi}m in steady state.","ar":"ثابتة {fixLo} إلى {fixHi} مليون يورو سنويًا (0,4 إلى 0,5% من الأقساط)، ومتغيرة {varRate} من القيمة الإجمالية؛ الإجمالي {tcoLo} إلى {tcoHi} مليون يورو في الوضع المستقر."},"fundRules":[{"h":{"fr":"Règle 1 · Les socles sur un budget pluriannuel groupe","en":"Rule 1 · Capabilities on a multi-year group budget","ar":"القاعدة 1 · القدرات المشتركة على ميزانية متعددة السنوات للمجموعة"},"p":{"fr":"Les dix fondations sont financées trois ans d'avance, sans justification cas par cas ; c'est le prix d'entrée, pas un retour.","en":"The ten foundations are funded three years ahead, without case-by-case justification; this is the entry ticket, not a return.","ar":"تُموَّل الأسس العشرة قبل ثلاث سنوات، دون تبرير حالة بحالة؛ إنه ثمن الدخول، لا عائد."}},{"h":{"fr":"Règle 2 · Les cas d'usage financés par les métiers","en":"Rule 2 · Use cases funded by the business lines","ar":"القاعدة 2 · حالات الاستخدام تمولها الأعمال"},"p":{"fr":"Sur la base d'un indicateur, d'une référence T0 et d'un propriétaire ; arrêtés s'ils ne bougent pas l'indicateur en deux trimestres.","en":"On the basis of an indicator, a T0 baseline and an owner; stopped if they do not move the indicator within two quarters.","ar":"على أساس مؤشر وخط أساس T0 ومالك؛ وتُوقف إن لم تحرّك المؤشر خلال فصلين."}},{"h":{"fr":"Règle 3 · Un rendement décalé assumé","en":"Rule 3 · A deferred return, accepted","ar":"القاعدة 3 · عائد متأخر مقبول"},"p":{"fr":"Frais en mois, sinistralité en 12 à 24 mois, capital à la clôture suivante : 2027 est négatif par construction, le cumul devient positif en 2028 ou 2029.","en":"Expenses in months, loss experience in 12 to 24 months, capital at the next close: 2027 is negative by construction, the cumulative turns positive in 2028 or 2029.","ar":"المصاريف في غضون أشهر، والخسائر في 12 إلى 24 شهرًا، ورأس المال عند الإقفال التالي: 2027 سالبة بحكم البناء، ويصبح التراكمي موجبًا في 2028 أو 2029."}}],"fundRefs":{"fr":"Repères : Generali, 1,2 à 1,3 milliard d'euros d'IA et de technologie sur 2025-2027, soit environ 0,4 à 0,5 % des primes par an ; 90 % des dirigeants de l'assurance augmentent l'investissement IA en 2026 (Accenture Pulse of Change).","en":"References: Generali, 1.2 to 1.3 billion euros of AI and technology over 2025-2027, i.e. around 0.4 to 0.5% of premiums per year; 90% of insurance executives are increasing AI investment in 2026 (Accenture Pulse of Change).","ar":"معالم: Generali، 1,2 إلى 1,3 مليار يورو للذكاء الاصطناعي والتقنية على 2025-2027، أي نحو 0,4 إلى 0,5% من الأقساط سنويًا؛ و90% من قادة التأمين يزيدون الاستثمار في الذكاء الاصطناعي في 2026 (Accenture Pulse of Change)."},"measTitle":{"fr":"Mesurer la valeur sans double compte : six règles","en":"Measuring value without double counting: six rules","ar":"قياس القيمة دون ازدواج: ست قواعد"},"meas":[{"h":{"fr":"1 · Un propriétaire par indicateur","en":"1 · One owner per indicator","ar":"1 · مالك لكل مؤشر"},"p":{"fr":"Un seul responsable métier, une référence T0 mesurée avant le déploiement, une lecture mensuelle.","en":"A single business owner, a T0 baseline measured before deployment, a monthly reading.","ar":"مسؤول واحد من الأعمال، وخط أساس T0 مقيس قبل النشر، وقراءة شهرية."}},{"h":{"fr":"2 · Des indicateurs avancés pour la sinistralité","en":"2 · Leading indicators for loss experience","ar":"2 · مؤشرات مبكرة للخسائر"},"p":{"fr":"Taux de traitement automatique, délais, fuite de valeur sur échantillon : lisibles en mois, quand le ratio sinistres exige 12 à 24 mois.","en":"Straight-through processing rate, cycle times, leakage on a sample: readable in months, when the loss ratio requires 12 to 24 months.","ar":"معدل المعالجة الآلية، والآجال، وتسرب القيمة على عينة: تُقرأ في غضون أشهر، في حين تتطلب نسبة الخسائر 12 إلى 24 شهرًا."}},{"h":{"fr":"3 · Des groupes de contrôle","en":"3 · Control groups","ar":"3 · مجموعات ضابطة"},"p":{"fr":"Déploiement progressif par région, portefeuille ou équipe, pour isoler l'effet de l'IA de l'inflation, du mix et de la saison.","en":"Phased deployment by region, portfolio or team, to isolate the effect of AI from inflation, mix and season.","ar":"نشر تدريجي حسب المنطقة أو المحفظة أو الفريق، لعزل أثر الذكاء الاصطناعي عن التضخم والمزيج والموسم."}},{"h":{"fr":"4 · Net du coût par transaction","en":"4 · Net of the cost per transaction","ar":"4 · صافٍ من التكلفة لكل معاملة"},"p":{"fr":"Chaque gain est net des modèles, des licences, de l'intégration et du contrôle humain résiduel ; le coût est mesuré par la plateforme, pas estimé.","en":"Every gain is net of models, licences, integration and residual human control; the cost is measured by the platform, not estimated.","ar":"كل مكسب صافٍ من النماذج والتراخيص والتكامل والرقابة البشرية المتبقية؛ وتُقاس التكلفة بالمنصة، لا تُقدَّر."}},{"h":{"fr":"5 · Une attribution au processus","en":"5 · Attribution to the process","ar":"5 · إسناد إلى العملية"},"p":{"fr":"Quand plusieurs cas touchent le même indicateur, la valeur est attribuée au niveau du processus ou du socle, jamais additionnée cas par cas.","en":"When several cases touch the same indicator, value is attributed at process or capability level, never added case by case.","ar":"حين تمسّ عدة حالات المؤشر نفسه، تُسند القيمة على مستوى العملية أو القدرة المشتركة، ولا تُجمع أبدًا حالة بحالة."}},{"h":{"fr":"6 · Constatée, pas déclarée","en":"6 · Observed, not declared","ar":"6 · ملاحَظة، لا معلنة"},"p":{"fr":"La valeur entre au cockpit quand le contrôle de gestion la lit dans les comptes ou les volumes ; les estimations de projet restent des estimations.","en":"Value enters the cockpit when management control reads it in the accounts or the volumes; project estimates remain estimates.","ar":"تدخل القيمة لوحة القيادة حين تقرؤها الرقابة الإدارية في الحسابات أو الأحجام؛ وتبقى تقديرات المشروع تقديرات."}}],"guard":{"fr":"Taux d'annulation en appel, réclamations, écarts d'équité par groupe, taux d'erreur des agents, part des systèmes inventoriés : ils ne doivent jamais se dégrader pendant qu'un indicateur de valeur s'améliore.","en":"Appeal overturn rate, complaints, fairness gaps by group, agent error rate, share of systems inventoried: they must never worsen while a value indicator improves.","ar":"معدل الإلغاء عند الاستئناف، والشكاوى، وفجوات العدالة لكل فئة، ومعدل خطأ الوكلاء، وحصة الأنظمة المجرودة: يجب ألا تتدهور أبدًا بينما يتحسن مؤشر قيمة."},"changeTitle":{"fr":"Conduite du changement : la capacité libérée ne se convertit pas seule","en":"Change management: released capacity does not convert on its own","ar":"إدارة التغيير: القدرة المحرَّرة لا تتحول من تلقاء نفسها"},"change":[{"h":{"fr":"Décider le devenir de la capacité","en":"Decide what becomes of the capacity","ar":"تقرير مصير القدرة"},"p":{"fr":"Attrition naturelle, redéploiement vers le conseil et le contrôle, absorption de la croissance : un choix RH explicite par fonction, pris avec les représentants du personnel ; sinon l'économie n'existe pas (sensibilité : {hrDelta} M€ de valeur nette si la moitié seulement est convertie).","en":"Natural attrition, redeployment to advice and control, absorption of growth: an explicit HR choice per function, taken with employee representatives; otherwise the saving does not exist (sensitivity: €{hrDelta}m of net value if only half is converted).","ar":"تناقص طبيعي، أو إعادة توزيع نحو الاستشارة والرقابة، أو استيعاب النمو: خيار صريح للموارد البشرية لكل وظيفة، يُتخذ مع ممثلي الموظفين؛ وإلا فلا وجود للوفر (الحساسية: {hrDelta} مليون يورو من القيمة الصافية إذا حُوِّل النصف فقط)."}},{"h":{"fr":"Redéfinir les rôles avant d'outiller","en":"Redefine roles before tooling","ar":"إعادة تعريف الأدوار قبل التجهيز بالأدوات"},"p":{"fr":"Fiches de poste, objectifs individuels et délégations réécrits pour la supervision d'agents ; le gestionnaire qui contrôle a posteriori n'est pas évalué sur le nombre de dossiers traités.","en":"Job descriptions, individual objectives and delegations rewritten for agent supervision; the handler who performs post-hoc control is not assessed on the number of files processed.","ar":"بطاقات الوظائف والأهداف الفردية والتفويضات معاد كتابتها للإشراف على الوكلاء؛ والمعالج الذي يراقب لاحقًا لا يُقيَّم بعدد الملفات المعالجة."}},{"h":{"fr":"Former à l'usage critique","en":"Train for critical use","ar":"التدريب على الاستخدام النقدي"},"p":{"fr":"Lire une sortie d'IA, la contredire, la tracer ; 46 % des firmes financières britanniques ne comprennent que partiellement les technologies qu'elles utilisent (BoE et FCA, 2024).","en":"Read an AI output, challenge it, trace it; 46% of UK financial firms only partially understand the technologies they use (BoE and FCA, 2024).","ar":"قراءة مخرج الذكاء الاصطناعي، ومناقضته، وتتبعه؛ 46% من الشركات المالية البريطانية لا تفهم سوى جزئيًا التقنيات التي تستخدمها (BoE وFCA، 2024)."}},{"h":{"fr":"Déployer par vagues avec des relais","en":"Deploy in waves with champions","ar":"النشر على موجات مع مراجع ميدانيين"},"p":{"fr":"Allstate a testé son copilote sinistres avec cinquante personnes avant de l'ouvrir aux 14 000 ; Zurich l'a lancé dans quatre bureaux avant extension ; un relais métier formé par équipe.","en":"Allstate tested its claims copilot with fifty people before opening it to 14,000; Zurich launched it in four offices before extension; one trained business champion per team.","ar":"اختبرت Allstate مساعدها الذكي للمطالبات مع خمسين شخصًا قبل فتحه أمام 14 000؛ وأطلقته Zurich في أربعة مكاتب قبل التوسع؛ مرجع ميداني مدرَّب من الأعمال لكل فريق."}},{"h":{"fr":"Accepter la courbe en J","en":"Accept the J-curve","ar":"تقبّل منحنى J"},"p":{"fr":"Les premiers pilotes de SCOR ont d'abord allongé les délais, le temps de vérifier les sorties contre les documents sources ; prévoir cette phase, ne pas la cacher.","en":"SCOR's first pilots initially lengthened cycle times, while outputs were checked against source documents; plan for this phase, do not hide it.","ar":"أطالت تجارب SCOR الأولى الآجال في البداية، ريثما تُتحقق المخرجات مقابل المستندات المصدرية؛ فليُخطط لهذه المرحلة ولا تُخفى."}}],"changeInd":{"h":{"fr":"Indicateurs de changement","en":"Change indicators","ar":"مؤشرات التغيير"},"p":{"fr":"Taux d'usage hebdomadaire par équipe, taux de correction des sorties, satisfaction des équipes, part des rôles redéfinis, heures de formation par personne.","en":"Weekly usage rate per team, output correction rate, team satisfaction, share of redefined roles, training hours per person.","ar":"معدل الاستخدام الأسبوعي لكل فريق، ومعدل تصحيح المخرجات، ورضا الفرق، وحصة الأدوار المعاد تعريفها، وساعات التدريب لكل شخص."}}},"sources":{"changelog3":[{"fr":"Édition 3 : trois chapitres ajoutés (marché et adoption, fondations et prérequis, erreurs à éviter) et deux chapitres refondus (value tree quantifiée, comment s'y prendre).","en":"Edition 3: three chapters added (market and adoption, foundations and prerequisites, mistakes to avoid) and two chapters reworked (quantified value tree, how to go about it).","ar":"الإصدار 3: ثلاثة فصول مضافة (السوق والتبني، الأسس والمتطلبات المسبقة، الأخطاء الواجب تجنبها) وفصلان معاد صياغتهما (شجرة القيمة المقدَّرة كميًا، كيف تبدأ)."},{"fr":"Value tree quantifiée sur un assureur type fictif : dix-sept blocs, fourchettes basses et hautes, trajectoire 2027-2030, pont de ratio combiné, sensibilités, cockpit de douze indicateurs tangibles, simulateur interactif et fichier de calcul Excel livré avec le book.","en":"Value tree quantified on a fictitious reference insurer: seventeen blocks, low and high ranges, 2027-2030 trajectory, combined ratio bridge, sensitivities, cockpit of twelve tangible indicators, interactive simulator and Excel calculation file delivered with the book.","ar":"شجرة قيمة مقدَّرة كميًا على شركة تأمين نموذجية افتراضية: سبع عشرة كتلة، ونطاقات دنيا وعليا، ومسار 2027-2030، وجسر النسبة المجمعة، وحساسيات، ولوحة قيادة باثني عشر مؤشرًا ملموسًا، ومحاكٍ تفاعلي وملف حساب Excel مرفق بالدليل."},{"fr":"Graphiques ajoutés dans tous les chapitres de cadrage : adoption, résultats publiés, potentiel par maillon, valeur par levier, maillon et ligne, montée en charge, pont de ratio combiné, tornado, structure du coût de possession.","en":"Charts added in all framing chapters: adoption, published results, potential by value-chain step, value by lever, step and line, ramp-up, combined ratio bridge, tornado, structure of the cost of ownership.","ar":"رسوم بيانية مضافة في جميع فصول التأطير: التبني، والنتائج المنشورة، والإمكانات حسب الحلقة، والقيمة حسب الرافعة والحلقة والخط، والتصاعد، وجسر النسبة المجمعة، ومخطط التورنادو، وهيكل تكلفة الامتلاك."},{"fr":"Fondations détaillées : exigences de données par famille de cas, plateforme de données en cinq couches, plateforme de modèles, anatomie d'un agent, échelle d'autonomie et contrôles, sécurité et post-quantique, compétences, prérequis par vague, grille de maturité.","en":"Detailed foundations: data requirements by case family, five-layer data platform, model platform, anatomy of an agent, autonomy scale and controls, security and post-quantum, skills, prerequisites by wave, maturity grid.","ar":"أسس مفصلة: متطلبات البيانات حسب عائلة الحالات، ومنصة بيانات من خمس طبقات، ومنصة النماذج، وتشريح الوكيل، وسلّم الاستقلالية والضوابط، والأمن وما بعد الكمومي، والمهارات، والمتطلبات المسبقة حسب الموجة، وشبكة النضج."},{"fr":"Démarche opérationnelle : cinq étapes, cent premiers jours, trajectoire 2026-2030, contenu des vagues, financement en portefeuille, six règles de mesure, conduite du changement ; cinq décisions demandées au COMEX en synthèse.","en":"Operational approach: five steps, first hundred days, 2026-2030 trajectory, content of the waves, portfolio funding, six measurement rules, change management; five decisions requested from the COMEX in the executive summary.","ar":"منهجية تشغيلية: خمس مراحل، والمئة يوم الأولى، والمسار 2026-2030، ومحتوى الموجات، والتمويل بالمحفظة، وست قواعد للقياس، وإدارة التغيير؛ وخمسة قرارات مطلوبة من اللجنة التنفيذية (COMEX) في الملخص."}],"limitsAdd":[{"fr":"La simulation de l'assureur type est un cas d'école fictif : dix blocs sur dix-sept reposent sur des hypothèses d'expert, signalées comme telles ; les résultats sont des fourchettes à recalculer avec les données de chaque assureur.","en":"The reference insurer simulation is a fictitious reference case: ten blocks out of seventeen rest on expert assumptions, flagged as such; the results are ranges to be recalculated with each insurer's data.","ar":"محاكاة شركة التأمين النموذجية حالة دراسية افتراضية: تستند عشر كتل من أصل سبع عشرة إلى فرضيات خبراء، مشار إليها بهذه الصفة؛ والنتائج نطاقات يجب إعادة حسابها ببيانات كل شركة تأمين."},{"fr":"Le simulateur et le fichier de calcul appliquent le même modèle ; ni l'un ni l'autre ne remplace une mesure T0 et des pilotes contrôlés.","en":"The simulator and the calculation file apply the same model; neither replaces a T0 measurement and controlled pilots.","ar":"يطبّق المحاكي وملف الحساب النموذج نفسه؛ ولا يحل أي منهما محل قياس T0 وتجارب مضبوطة."}],"fileTitle":{"fr":"Fichier de calcul","en":"Calculation file","ar":"ملف الحساب"},"fileText":{"fr":"value-tree-assureur-type.xlsx : hypothèses, dix-sept blocs, résultats, trajectoire, sensibilités, cockpit et catalogue des cas d'usage, en formules vivantes ; livré avec le book et reproduit par le simulateur du chapitre 5.","en":"value-tree-assureur-type.xlsx: assumptions, seventeen blocks, results, trajectory, sensitivities, cockpit and use case catalogue, in live formulas; delivered with the book and reproduced by the chapter 5 simulator.","ar":"value-tree-assureur-type.xlsx: الفرضيات، والكتل السبع عشرة، والنتائج، والمسار، والحساسيات، ولوحة القيادة، وكتالوج حالات الاستخدام، في صيغ حية؛ مرفق بالدليل ويعيد المحاكي في الفصل 5 إنتاجه."}}};

const WITH_RE = new Set(["strat","res","cap","risk","supp"]);

/* ---------- Dérivations ---------- */
UC.forEach(x=>{
  const lobs = new Set();
  if (x.p[0]==="*"){ PRIMARY.forEach(l=>lobs.add(l)); if (WITH_RE.has(x.c)) lobs.add("reins"); }
  else x.p.forEach(p=>{ if(!PROD[p]) console.warn("Produit inconnu", x.id, p); else lobs.add(PROD[p].lob); });
  x.lobs = [...lobs];
  x.prods = x.p[0]==="*" ? Object.keys(PROD).filter(p=>lobs.has(PROD[p].lob)) : x.p;
  x.segs = x.s[0]==="*" ? Object.keys(SEG) : x.s;
});
const UCI = Object.fromEntries(UC.map(x=>[x.id,x]));
const BI = Object.fromEntries(BENCH.map(b=>[b.id,b]));
const RI = Object.fromEntries(REFS.map(r=>[r.id,r]));

function matrix(){
  const m = {}; CHAIN.forEach(c=>{ m[c.id]={}; LOB.forEach(l=>m[c.id][l.id]={v:0,n:0}); });
  UC.forEach(x=>x.lobs.forEach(l=>{ m[x.c][l].v += x.v; m[x.c][l].n++; }));
  return m;
}
const M = matrix();
const MAXV = Math.max(...CHAIN.flatMap(c=>LOB.map(l=>M[c.id][l.id].v)));
function heatColor(v){
  if (!v) return ["transparent","var(--muted)"];
  const r = v / MAXV;
  if (r > .8) return ["#460073","#fff"];
  if (r > .6) return ["#7500C0","#fff"];
  if (r > .4) return ["#A100FF","#fff"];
  if (r > .2) return ["#BE82FF","#14001F"];
  return ["#E6DCFF","#14001F"];
}

let PXL = "auto";
function prodChain(){
  const prods = Object.entries(PROD).filter(([k,p])=>p.lob===PXL).map(([k,p])=>[k,tx(p.n)]);
  return matrixTable(prods, CHAIN.map(c=>[c.id,tx(c.s)]), (pk,c)=>UC.filter(x=>x.prods.includes(pk)&&x.c===c).length, "prod");
}
function matrixTable(rows, cols, f, kind){
  const vals = rows.map(r=>cols.map(c=>f(r[0],c[0])));
  const mx = Math.max(1,...vals.flat());
  const head = `<tr><th></th>${cols.map(c=>`<th>${esc(c[1])}</th>`).join("")}<th>Σ</th></tr>`;
  const body = rows.map((r,i)=>{ const tot = vals[i].reduce((a,b)=>a+b,0);
    return `<tr><th>${esc(r[1])}</th>${cols.map((c,j)=>{ const v=vals[i][j]; const [bg,fg]=v?heatColor(v/mx*MAXV):["transparent","var(--muted)"];
      return `<td data-m="${kind}" data-r="${r[0]}" data-col="${c[0]}" style="background:${bg};color:${fg}" title="${esc(u("cellTip"))}">${v||""}</td>`; }).join("")}<td class="tot">${tot}</td></tr>`; }).join("");
  return `<div class="tablewrap"><table class="heat mini"><thead>${head}</thead><tbody>${body}</tbody></table></div>`;
}
function quadrant(){
  const W=720,H=460,P=52, sx=v=>P+(v-0.5)/5*(W-P-20), sy=v=>H-P-(v-0.5)/5*(H-P-20);
  const groups = {}; UC.forEach(x=>{ const k=x.x+"-"+x.v; (groups[k]=groups[k]||[]).push(x); });
  let dots = "";
  Object.values(groups).forEach(g=>{
    const n=g.length, cols=Math.ceil(Math.sqrt(n)), step=13;
    g.forEach((x,i)=>{ const cx=sx(x.x)+((i%cols)-(cols-1)/2)*step, cy=sy(x.v)+(Math.floor(i/cols)-(Math.ceil(n/cols)-1)/2)*step;
      dots += `<circle data-uc="${x.id}" cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${x.h===1?6:x.h===2?5:4}" fill="${FAM[x.f].c}"><title>${esc(x.id)} · ${esc(tx(x.t))}</title></circle>`; });

function filtered(){
  const q = S.q.trim().toLowerCase();
  return UC.filter(x=>{
    if (S.c && x.c!==S.c) return false;
    if (S.lob && !x.lobs.includes(S.lob)) return false;
    if (S.p && !x.prods.includes(S.p)) return false;
    if (S.f && x.f!==S.f) return false;
    if (S.h && String(x.h)!==S.h) return false;
    if (S.r && x.r!==S.r) return false;
    if (S.kpi && !x.k.includes(S.kpi)) return false;
    if (S.lv && !x.lv.includes(S.lv)) return false;
    if (S.seg && !x.segs.includes(S.seg)) return false;
    if (q){
      const hay = [x.id, x.t.fr, x.t.en, x.t.ar, x.d[lang], chainName(x.c), ...x.prods.map(p=>tx(PROD[p].n)), ...x.k.map(k=>tx(KPI[k].n))].join(" ").toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  }).sort((a,b)=>CH[a.c].i-CH[b.c].i || a.id.localeCompare(b.id, undefined, {numeric:true}));
}

function colchart(R){

  const bar = (lo, hi, cls, label) => {
    const top = v => H - (v - mn) / span * H;
    const seg = (a, b, c) => { const t = Math.min(top(a), top(b)), h = Math.abs(top(a) - top(b)); return `<i class="${c}" style="top:${t.toFixed(1)}px;height:${Math.max(h, 1).toFixed(1)}px"></i>`; };
    const l = Math.min(lo, hi), h = Math.max(lo, hi);

    return `<span class="col" title="${esc(label)} : ${esc(rng(lo, hi, 0))} ${esc(tx(VT.UNITN["M€"]))}">${s}</span>`;

/* pont de ratio combiné (cascade) */
function waterfall(R, w){
  const c = R.cor, steps = [
    { l: u("corBefore"), v: c.cor0, kind: "start" },
    { l: u("lrGain"), d: -c[w].lr },
    { l: u("erGain"), d: -c[w].er },
    { l: u("tcoCost"), d: c[w].tco },
    { l: u("corAfter"), v: c[w].cor, kind: "end" }
  ];
  const H = 170, top = Math.max(c.cor0, c[w].cor) + 0.004, bot = Math.min(c.cor0, c[w].cor) - 0.012, span = top - bot;
  const y = v => (top - v) / span * H;
  let cur = c.cor0;
  const cols = steps.map(s => {
    let a, b, cls, label;
    if (s.kind) { a = bot; b = s.v; cls = s.kind; label = pc(s.v, 1); }
    else { a = cur; b = cur + s.d; cur = b; cls = s.d < 0 ? "minus" : "plus"; label = (s.d < 0 ? "−" : "+") + fmt(Math.abs(s.d) * 100, 1) + " pt"; }
    const t = Math.min(y(a), y(b)), h = Math.abs(y(a) - y(b));
    return `<div class="wfc" title="${esc(s.l)} : ${esc(label)}"><b style="top:${(t - 22).toFixed(1)}px">${esc(label)}</b><i class="${cls}" style="top:${t.toFixed(1)}px;height:${Math.max(h, 2).toFixed(1)}px"></i><span>${esc(s.l)}</span></div>`;
  }).join("");
  return `<div class="wf"><div class="wfh">${esc(w === "lo" ? u("low") : u("high"))}</div><div class="wfplot" style="height:${H}px">${cols}</div></div>`;
}

function simRead(){
  const I = VT.clone(SIM); I.eff = I.eff || {};
  document.querySelectorAll("[data-sim]").forEach(e => {
    const p = e.dataset.sim.split("."), v = parseFloat(String(e.value).replace(",", "."));
    if (isNaN(v)) return;
    const isP = e.nextElementSibling && e.nextElementSibling.tagName === "EM";
    const val = isP ? v / 100 : v;
    if (p[0] === "eff") { I.eff[p[1]] = I.eff[p[1]] || {}; I.eff[p[1]][p[2]] = val; }
    else if (p.length === 2) I[p[0]][p[1]] = val; else I[p[0]] = val;
  });
  return I;
}

  const skills = `<div class="tablewrap"><table class="scale skills"><thead><tr><th>${esc(u("job"))}</th><th>${esc(u("tomorrow"))}</th><th>${esc(u("skillsCol"))}</th></tr></thead><tbody>${F.skillsRows.map(r => `<tr><td style="font-weight:700">${esc(tx(r.job))}</td><td>${esc(tx(r.tomorrow))}</td><td>${esc(tx(r.skills))}</td></tr>`).join("")}</tbody></table></div>`;
  const lv = F.levels.map(l => tx(l));
  const cell = n => `<td class="lv lv${n}">${n} · ${esc(lv[n - 1])}</td>`;
  const matrix = `<div class="tablewrap"><table class="scale matrix"><thead><tr><th>${esc(u("foundation"))}</th><th>${esc(u("wave1"))}</th><th>${esc(u("wave2"))}</th><th>${esc(u("wave3"))}</th></tr></thead><tbody>${F.matrixRows.map(r => `<tr><td style="font-weight:700">${esc(tx(r.f))}</td>${r.w.map(cell).join("")}</tr>`).join("")}</tbody></table></div>`;
  const mat = `<div class="tablewrap"><table class="scale maturity"><thead><tr><th>${esc(u("axis"))}</th>${lv.map((l, i) => `<th>${i + 1} · ${esc(l)}</th>`).join("")}</tr></thead><tbody>${F.matAxes.map(a => `<tr><td style="font-weight:700">${esc(tx(a.a))}</td>${a.l.map(x => `<td>${esc(tx(x))}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
  return chapterHead(9) + `<p class="lead">${esc(tx(F.intro))}</p>
   <h3>${esc(tx(F.tenTitle))}</h3>${ten}<p class="small">${esc(tx(F.cost))}</p><div class="callout">${esc(tx(F.order))}</div>
   <h3>${esc(tx(F.dataTitle))}</h3>${data}<p class="muted small">${esc(tx(F.dataNote))}</p>
   <h3>${esc(tx(F.dpTitle))}</h3><p>${esc(tx(F.dpIntro))}</p>${dp}<p class="small"><strong>${esc(tx(F.dpMin))}</strong></p>
   <h3>${esc(tx(F.mpTitle))}</h3>${cards(F.mpCards.map(c => ({ h: tx(c.h), p: tx(c.p) })), "cards3")}<p class="small">${esc(tx(F.mpBbp))}</p><p class="muted small">${esc(tx(F.mpPrecedents))}</p>
   <h3>${esc(tx(F.agTitle))}</h3>${cards(F.agComps.map(c => ({ h: tx(c.h), p: tx(c.p) })), "cards4")}
   <div class="two wide"><div class="callout"><h4>${esc(tx(F.agOrch.h))}</h4><p>${esc(tx(F.agOrch.p))}</p><p class="small">${esc(tx(F.agAxa))}</p></div>${tiles(F.agStats.map(s => ({ v: esc(tx(s.v)), l: "", p: tx(s.t) })))}</div>
   <h3>${esc(tx(F.autoTitle))}</h3>${auto}<p class="small"><strong>${esc(tx(F.autoRule))}</strong></p><p class="muted small">${esc(tx(F.autoLesson))}</p>
   <h3>${esc(tx(F.secTitle))}</h3>${cards(F.secCards.map(c => ({ h: tx(c.h), p: tx(c.p) })), "cards4")}
   <div class="two wide"><div><h4 class="sub">${esc(tx(F.pqcTitle))}</h4>${pqc}</div><div class="callout"><h4>${esc(tx(F.secWave1.h))}</h4><p>${esc(tx(F.secWave1.p))}</p></div></div>
   <h3>${esc(tx(F.skillsTitle))}</h3>${skills}<p class="muted small">${esc(tx(F.skillsNote))}</p>
   <h3>${esc(tx(F.matrixTitle))}</h3><p>${esc(tx(F.matrixIntro))}</p>${matrix}${cards(F.matrixWaves.map(c => ({ h: tx(c.h), p: tx(c.p) })), "cards3")}
   <h3>${esc(tx(F.matTitle))}</h3>${mat}<p class="small">${esc(tx(F.matHow))}</p><p class="muted small">${esc(tx(F.matMarket))}</p>`;
}

   <h3>${esc(tx(E.lessonsTitle))}</h3>${cards(E.lessons.map(l => ({ h: tx(l.h), p: tx(l.p), l: tx(l.l), s: BI[l.ref] ? BI[l.ref].org + " · " + BI[l.ref].y : "", ref: l.ref })), "cards3")}<p class="muted small">${esc(u("lessonNote"))}</p>
   <h3>${esc(tx(E.apTitle))}</h3>${cards(E.ap.map(a => ({ h: tx(a.h), p: tx(a.p) })), "cards3")}<p class="muted small">${esc(tx(E.apRefs))}</p>

/* ---------- 16. Comment s'y prendre ---------- */
function chHow(){
  const Hh = N5.how, m = tok(), R = R0;
  const steps = `<div class="steps">${Hh.approach.map((s, i) => `<div class="step"><span class="ct">${esc(tx(s.t))}</span><h4>${esc(tx(s.h))}</h4><p>${esc(tx(s.p))}</p><p class="cd"><strong>${esc(u("deliverable"))} —</strong> ${esc(tx(s.d))}</p></div>`).join("")}</div>`;
  const f100 = `<div class="cards3 f100">${Hh.f100.map(f => `<div class="card"><h4>${esc(tx(f.h))}</h4><ul>${f.items.map(i => `<li>${esc(tx(i))}</li>`).join("")}</ul><p class="cd"><strong>${esc(u("outcome"))} —</strong> ${esc(tx(f.out))}</p></div>`).join("")}</div>`;
  const cols = Hh.roadCols.map(c => tx(c));
  const gantt = `<div class="gantt" style="grid-template-columns:minmax(150px,1.3fr) repeat(10,minmax(0,1fr))"><div class="gh"></div>${cols.map(c => `<div class="gh" style="grid-column:span 2">${esc(c)}</div>`).join("")}
   ${Hh.roadRows.map((r, ri) => `<div class="gl" style="grid-row:${ri + 2};grid-column:1">${esc(tx(r.h))}</div>${r.bars.map(b => `<div class="gb" style="grid-row:${ri + 2};grid-column:${2 + Math.round(b.a * 2)} / ${2 + Math.round(b.b * 2)}" title="${esc(tx(b.t))}">${esc(tx(b.t))}</div>`).join("")}`).join("")}
   <div class="gl" style="grid-row:${Hh.roadRows.length + 2};grid-column:1">${esc(tx(Hh.roadNet))}</div><div class="gb net" style="grid-row:${Hh.roadRows.length + 2};grid-column:2 / 4"></div>${VT.YEARS.map((y, i) => `<div class="gb net" style="grid-row:${Hh.roadRows.length + 2};grid-column:${4 + i * 2} / ${6 + i * 2}">${esc(rng(R.years[y].lo.net, R.years[y].hi.net, 0))}</div>`).join("")}</div>`;
  const waves = `<div class="cards3">${Hh.waves.map(w => `<div class="card wave2"><span class="ct">${esc(tx(w.t))}</span><h4>${esc(tx(w.h))}</h4><p>${esc(tx(w.p))}</p><p class="cd">${esc(tx(w.f))}</p><p class="big2">${esc(fv(tx(w.s), m))}</p></div>`).join("")}</div>`;
  const tf = VT.DEF.tcoFixed, keys = ["plat", "integ", "data", "change", "compl"];
  const fund = rbars([...keys.map(k => ({ l: tx(VT.TCON[k]), lo: Math.min(...VT.YEARS.map(y => tf[y][k])), hi: Math.max(...VT.YEARS.map(y => tf[y][k])) })), { l: tx(VT.TCON.var), lo: R.steady_lo.var, hi: R.steady_hi.var }]);
  return chapterHead(16) + `<p class="lead">${esc(tx(Hh.intro))}</p>
   <h3>${esc(tx(Hh.approachTitle))}</h3>${steps}<p class="muted small">${esc(tx(Hh.approachRule))}</p>
   <h3>${esc(tx(Hh.f100Title))}</h3>${f100}<p class="small">${esc(tx(Hh.f100Team))}</p>
   <h3>${esc(tx(Hh.roadTitle))}</h3><div class="tablewrap">${gantt}</div><p class="muted small">${esc(tx(Hh.roadNote))}</p>
   <h3>${esc(tx(Hh.wavesTitle))}</h3>${waves}
   <h3>${esc(tx(Hh.opTitle))}</h3>${cards(Hh.op.map(o => ({ h: tx(o.h), p: tx(o.p) })), "cards3")}
   <h3>${esc(tx(Hh.fundTitle))}</h3><h4 class="sub">${esc(tx(Hh.fundChartTitle))}</h4>${fund}<p class="small">${esc(fv(tx(Hh.fundNote), m))}</p>${cards(Hh.fundRules.map(r => ({ h: tx(r.h), p: tx(r.p) })), "cards3")}<p class="muted small">${esc(tx(Hh.fundRefs))}</p>
   <h3>${esc(tx(Hh.measTitle))}</h3>${cards(Hh.meas.map(r => ({ h: tx(r.h), p: tx(r.p) })), "cards3")}<div class="callout"><strong>${esc(u("guardrails"))} —</strong> ${esc(tx(Hh.guard))}</div>
   <div class="two"><div><h4 class="sub">${esc(u("cockpit"))}</h4><ul class="list">${N.cockpit.map(x => `<li>${esc(tx(x))}</li>`).join("")}</ul></div><div><h4 class="sub">${esc(u("change"))}</h4><ul class="list">${N.change.map(x => `<li>${esc(tx(x))}</li>`).join("")}</ul></div></div>
   <h3>${esc(tx(Hh.changeTitle))}</h3>${cards(Hh.change.map(c => ({ h: tx(c.h), p: fv(tx(c.p), m) })), "cards3")}<div class="callout soft"><h4>${esc(tx(Hh.changeInd.h))}</h4><p>${esc(tx(Hh.changeInd.p))}</p></div>
   <h3>${esc(u("bookGovTitle"))}</h3><div class="callout">${esc(tx(N.bookGov))}</div>`;
}

/* ---------- Assemblage ---------- */
const CHS = [ch1,ch2,chMarket,ch4,ch3,ch5,ch6,ch7,chFound,ch8,ch9,ch10,ch11,ch12,chErrors,chHow,ch13,ch15,ch16];
function renderAll(){
  T0 = null;
  document.documentElement.lang = lang; document.documentElement.dir = u("dir");
  document.title = u("docTitle");
  $("#brandDoc").textContent = u("docTitle");
  $("#printBtn").textContent = u("print"); $("#menuBtn").textContent = u("menu"); $("#themeBtn").textContent = u("theme");
  document.querySelectorAll("#langSeg button").forEach(b=>b.setAttribute("aria-pressed", b.dataset.lang===lang));
  renderHero(); renderToc();
  $("#chapters").innerHTML = CHS.map((f,i)=>`<section class="ch" id="ch${i+1}"><div class="wrap">${f()}</div></section>`).join("") +
    `<footer><div class="wrap">${esc(u("owner"))} — ${esc(u("edition"))}</div></footer>`;
  renderList(); renderBench(); observe();
}

/* ---------- Interactions ---------- */
function goCatalogue(){ document.getElementById("ch6").scrollIntoView({behavior:"smooth"}); }
function openUC(id){
  Object.keys(S).forEach(k=>S[k]=""); syncFilters(); renderList();
  const el = document.getElementById("uc-"+id); if (!el) return;
  el.open = true; el.scrollIntoView({behavior:"smooth", block:"center"});
}
function syncFilters(){
  const map = {fq:"q",fc:"c",fl:"lob",fp:"p",ff:"f",fh:"h",fr:"r"};
  Object.entries(map).forEach(([id,k])=>{ const e=document.getElementById(id); if(e) e.value=S[k]; });
}
document.addEventListener("input", e=>{ if (e.target.id==="fq"){ S.q=e.target.value; renderList(); } });
document.addEventListener("change", e=>{
  const map = {fc:"c",fl:"lob",fp:"p",ff:"f",fh:"h",fr:"r"};
  if (map[e.target.id]){ S[map[e.target.id]] = e.target.value; renderList(); }
  if (e.target.id==="pxl"){ PXL = e.target.value; document.getElementById("pxc").innerHTML = prodChain(); }
  if (e.target.dataset && e.target.dataset.sim!==undefined){ simApply(false); }
});
document.addEventListener("click", e=>{
  const t = e.target.closest("[data-kpi],[data-m],[data-c],[data-open],[data-bf],[data-uc],[data-lobfilter],#freset,#langSeg button,#printBtn,#themeBtn,#menuBtn,.toc a,#simrecalc,#simreset");
  if (!t) return;
  if (t.id==="simrecalc"){ simApply(false); return; }
  if (t.id==="simreset"){ simApply(true); return; }
  if (t.dataset.kpi){ Object.keys(S).forEach(k=>S[k]=""); S.kpi=t.dataset.kpi; syncFilters(); renderList(); goCatalogue(); }
  else if (t.dataset.m){ Object.keys(S).forEach(k=>S[k]="");
    if (t.dataset.m==="lv"){ S.lv=t.dataset.r; S.lob=t.dataset.col; }
    else if (t.dataset.m==="seg"){ S.seg=t.dataset.r; S.c=t.dataset.col; }
    else { S.p=t.dataset.r; S.c=t.dataset.col; }
    syncFilters(); renderList(); goCatalogue(); }
  else if (t.dataset.lobfilter){ Object.keys(S).forEach(k=>S[k]=""); S.lob=t.dataset.lobfilter; syncFilters(); renderList(); goCatalogue(); }
  else if (t.dataset.c){ Object.keys(S).forEach(k=>S[k]=""); S.c=t.dataset.c; S.lob=t.dataset.l; syncFilters(); renderList(); goCatalogue(); }
  else if (t.dataset.open){ e.preventDefault(); openUC(t.dataset.open); }
  else if (t.dataset.uc){ openUC(t.dataset.uc); }
  else if (t.dataset.bf!==undefined){ BF=t.dataset.bf; renderBench(); }
  else if (t.id==="freset"){ Object.keys(S).forEach(k=>S[k]=""); syncFilters(); renderList(); }
  else if (t.dataset.lang){ lang=t.dataset.lang; try{ localStorage.setItem("aibook-lang",lang);}catch(err){} renderAll(); }
  else if (t.id==="printBtn"){ window.print(); }
  else if (t.id==="themeBtn"){
    const r=document.documentElement, dark = r.dataset.theme ? r.dataset.theme==="dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    r.dataset.theme = dark ? "light" : "dark"; try{ localStorage.setItem("aibook-theme", r.dataset.theme);}catch(err){}
  }
  else if (t.id==="menuBtn"){ $("#toc").classList.toggle("open"); }
  else if (t.matches(".toc a")){ $("#toc").classList.remove("open"); }
});
let saved = null;
window.addEventListener("beforeprint", ()=>{
  saved = {...S}; Object.keys(S).forEach(k=>S[k]=""); BF=""; renderList(); renderBench();
  document.querySelectorAll("details.uc").forEach(d=>d.open=true);
});
window.addEventListener("afterprint", ()=>{
  if (saved){ Object.assign(S,saved); syncFilters(); renderList(); saved=null; }
});
let io;
function observe(){
  if (io) io.disconnect();
  if (!("IntersectionObserver" in window)) return;
  io = new IntersectionObserver(es=>es.forEach(en=>{ if(en.isIntersecting){
    document.querySelectorAll(".toc a").forEach(a=>a.classList.toggle("on", a.getAttribute("href")==="#"+en.target.id)); } }), {rootMargin:"-40% 0px -55% 0px"});
  document.querySelectorAll("section.ch").forEach(s=>io.observe(s));
}
try { const th = localStorage.getItem("aibook-theme"); if (th) document.documentElement.dataset.theme = th; } catch(e){}
renderAll();
window.__BOOK__ = { UC, M, filtered, S };
})();

</script>
