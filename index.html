<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Book des opportunités IA — Assurance & Actuariat</title>
<meta name="description" content="Plan d'occupation des sols de l'IA sur la chaîne de valeur de l'assurance : 205 cas d'usage, value tree, synergies, framework agentique, benchmark sourcé, vision IA avancée et quantique. FR / EN / AR.">
<meta property="og:title" content="Book des opportunités IA — Assurance &amp; Actuariat">
<meta property="og:description" content="205 cas d'usage, value tree quantifiée et simulateur, fondations, erreurs à éviter, démarche. FR / EN / AR.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23A100FF'/%3E%3Ctext x='32' y='43' font-size='32' font-family='Arial' font-weight='700' text-anchor='middle' fill='white'%3EIA%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Palette inspirée de la charte Accenture : Core Purple #A100FF, violets #7500C0 / #460073, accents #BE82FF / #E6DCFF, noir et blanc */
:root{
  --purple:#A100FF; --purple2:#7500C0; --purple3:#460073; --lilac:#BE82FF; --mist:#E6DCFF; --mist2:#F5F0FF;
  --ink:#000000; --paper:#FFFFFF; --muted:#5B5B66; --line:#E3DEEA; --soft:#F7F5FA; --card:#FFFFFF;
  --hero-bg:#000000; --hero-ink:#FFFFFF;
  --latin:"Hanken Grotesk", "Helvetica Neue", Arial, sans-serif;
  --arabic:"IBM Plex Sans Arabic", "Noto Sans Arabic", Tahoma, sans-serif;
  --r1:2px; --r2:6px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#FFFFFF; --paper:#000000; --muted:#B4AEC0; --line:#2A2533; --soft:#0E0B13; --card:#0A080D; --mist2:#160E22;
  }
}
:root[data-theme="dark"]{ --ink:#FFFFFF; --paper:#000000; --muted:#B4AEC0; --line:#2A2533; --soft:#0E0B13; --card:#0A080D; --mist2:#160E22; }
*,*::before,*::after{ box-sizing:inherit; }
html{ scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px); -webkit-text-size-adjust:100%; }
body{ margin:0; background:var(--paper); color:var(--ink); font-family:var(--latin); font-size:16px; line-height:1.55; }
html[lang="ar"] body{ font-family:var(--arabic); line-height:1.75; }
a{ color:var(--purple2); text-underline-offset:2px; }
:root[data-theme="dark"] a{ color:var(--lilac); }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) a{ color:var(--lilac); } }
button,select,input{ font:inherit; color:inherit; }
:focus-visible{ outline:2px solid var(--purple); outline-offset:2px; }
img,svg{ max-width:100%; }

/* ---------- Barre supérieure ---------- */
.bar{ position:sticky; top:env(safe-area-inset-top,0px); z-index:30; background:var(--paper); border-bottom:1px solid var(--line);
  display:flex; align-items:center; gap:12px; padding:10px clamp(14px,3vw,32px); }
.bar .brand{ font-weight:800; letter-spacing:-.01em; font-size:15px; white-space:nowrap; }
.bar .brand b{ color:var(--purple); font-weight:800; }
.bar .doc{ color:var(--muted); font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; min-width:0; }
.seg{ display:inline-flex; border:1px solid var(--line); border-radius:var(--r2); overflow:hidden; }
.seg button{ background:none; border:0; padding:6px 10px; cursor:pointer; font-size:14px; }
.seg button[aria-pressed="true"]{ background:var(--purple); color:#fff; }
.btn{ background:none; border:1px solid var(--line); border-radius:var(--r2); padding:6px 12px; cursor:pointer; font-size:14px; }
.btn:hover{ border-color:var(--purple); }
.btn.primary{ background:var(--purple); border-color:var(--purple); color:#fff; }
.menuBtn{ display:none; }

/* ---------- Disposition ---------- */
.layout{ display:grid; grid-template-columns:minmax(220px,260px) minmax(0,1fr); gap:0; }
.toc{ position:sticky; top:57px; align-self:start; height:calc(100vh - 57px); overflow:auto; padding:24px 18px 40px; border-inline-end:1px solid var(--line); }
.toc ol{ list-style:none; margin:0; padding:0; counter-reset:c; }
.toc li{ counter-increment:c; }
.toc a{ display:grid; grid-template-columns:28px 1fr; gap:6px; padding:7px 8px; border-radius:var(--r2); color:var(--ink); text-decoration:none; font-size:14px; line-height:1.3; }
.toc a::before{ content:counter(c, decimal-leading-zero); color:var(--purple); font-weight:700; font-variant-numeric:tabular-nums; }
.toc a:hover,.toc a.on{ background:var(--mist2); }
main{ min-width:0; }
.wrap{ max-width:1080px; margin:0 auto; padding:0 clamp(16px,4vw,48px); }

/* ---------- Couverture ---------- */
.hero{ background:var(--hero-bg); color:var(--hero-ink); padding:clamp(40px,7vw,88px) 0 clamp(36px,5vw,56px); }
.hero .kick{ color:var(--lilac); font-weight:600; font-size:15px; margin:0 0 14px; }
.hero h1{ font-size:clamp(34px,5.6vw,68px); line-height:1.02; letter-spacing:-.025em; font-weight:800; margin:0 0 20px; max-width:17ch; }
html[lang="ar"] .hero h1{ letter-spacing:0; line-height:1.25; }
.hero .sub{ font-size:clamp(17px,1.8vw,20px); max-width:62ch; color:#E9E3F2; margin:0 0 22px; }
.hero .meta{ color:#A79FB3; font-size:14px; margin:0 0 32px; }
.stats{ display:flex; flex-wrap:wrap; gap:clamp(18px,4vw,48px); margin:0 0 36px; }
.stats div{ display:flex; flex-direction:column; }
.stats strong{ font-size:clamp(30px,4vw,44px); font-weight:800; line-height:1; color:#fff; font-variant-numeric:tabular-nums; }
.stats span{ color:#B9B1C6; font-size:14px; margin-top:6px; }
.cad{ border-top:1px solid #2B2433; padding-top:20px; }
.cad p{ color:#A79FB3; font-size:13px; margin:0 0 10px; }
.cadgrid{ display:grid; gap:3px; }
.cadgrid .h{ font-size:11px; color:#9C94A8; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; align-self:end; padding-bottom:2px; }
.cadgrid .rh{ font-size:12px; color:#D6CFE0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; padding-inline-end:8px; align-self:center; }
.cadgrid .c{ height:20px; border-radius:1px; }

/* ---------- Chapitres ---------- */
.ch{ padding:clamp(48px,7vw,84px) 0 8px; border-bottom:1px solid var(--line); }
.chhead{ display:grid; grid-template-columns:auto 1fr; gap:4px 18px; align-items:baseline; margin-bottom:22px; }
.chnum{ font-size:clamp(40px,5vw,60px); font-weight:800; color:var(--purple); line-height:.9; font-variant-numeric:tabular-nums; }
.ch h2{ font-size:clamp(26px,3.2vw,38px); line-height:1.1; letter-spacing:-.015em; margin:0; font-weight:800; }
html[lang="ar"] .ch h2{ letter-spacing:0; line-height:1.35; }
.lead{ font-size:clamp(17px,1.7vw,19px); max-width:70ch; margin:0 0 28px; }
h3{ font-size:20px; line-height:1.25; margin:34px 0 12px; font-weight:750; }
h4{ font-size:16px; margin:0 0 6px; font-weight:700; }
p{ max-width:75ch; }
.muted{ color:var(--muted); }
.small{ font-size:13.5px; }

/* Synthèse */
.msgs{ display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:0; border-top:2px solid var(--ink); }
.msg{ padding:20px 22px 22px 0; border-bottom:1px solid var(--line); }
html[dir="rtl"] .msg{ padding:20px 0 22px 22px; }
.msg h4{ font-size:18px; line-height:1.3; margin-bottom:8px; }
.msg p{ margin:0; color:var(--muted); }
.msg .n{ display:block; color:var(--purple); font-weight:800; font-size:14px; margin-bottom:6px; }

/* Lecture */
.personas{ display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:12px; }
.persona{ border:1px solid var(--line); border-radius:var(--r2); padding:14px 16px; }
.persona h4{ margin-bottom:10px; }
.chips{ display:flex; flex-wrap:wrap; gap:6px; }
.chip{ display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line); border-radius:999px; padding:3px 10px; font-size:13px; background:var(--card); color:var(--ink); text-decoration:none; line-height:1.4; }
a.chip:hover,button.chip:hover{ border-color:var(--purple); }
button.chip{ cursor:pointer; }
.chip.p{ background:var(--mist); border-color:var(--mist); color:#2B0047; }
.dot{ width:9px; height:9px; border-radius:50%; display:inline-block; flex:none; }
.scale{ width:100%; border-collapse:collapse; font-size:14.5px; }
.scale th,.scale td{ text-align:start; padding:10px 12px 10px 0; border-bottom:1px solid var(--line); vertical-align:top; }
html[dir="rtl"] .scale th,html[dir="rtl"] .scale td{ padding:10px 0 10px 12px; }
.scale th{ font-size:13px; color:var(--muted); font-weight:600; }
.tablewrap{ overflow-x:auto; -webkit-overflow-scrolling:touch; }
.fams{ display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:12px; margin-bottom:8px; }
.fam{ border-top:4px solid; padding-top:10px; }
.fam p{ margin:4px 0 0; font-size:14px; color:var(--muted); }

/* Value tree */
.vt{ display:grid; gap:0; }
.vtroot{ background:var(--ink); color:var(--paper); padding:14px 18px; font-weight:750; font-size:18px; border-radius:var(--r2) var(--r2) 0 0; }
.lever{ display:grid; grid-template-columns:minmax(170px,230px) minmax(0,1fr); border:1px solid var(--line); border-top:0; }
.lever .lh{ padding:16px 18px; background:var(--mist2); border-inline-end:1px solid var(--line); }
.lever .lh h4{ font-size:17px; margin-bottom:8px; }
.lever .lh .cnt{ font-size:13px; color:var(--muted); }
.lever .lb{ padding:14px 18px; display:grid; gap:12px; }
.drv{ display:flex; flex-wrap:wrap; gap:6px; }
.drv span{ font-size:13px; color:var(--muted); }
.drv span:not(:last-child)::after{ content:" ·"; }
.kpis{ display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:6px; }
.kpi{ display:flex; justify-content:space-between; align-items:center; gap:10px; border:1px solid var(--line); border-radius:var(--r2); padding:7px 10px; background:var(--card); cursor:pointer; text-align:start; font-size:14px; }
.kpi:hover{ border-color:var(--purple); }
.kpi b{ background:var(--purple); color:#fff; border-radius:999px; padding:0 8px; font-size:12px; font-variant-numeric:tabular-nums; }

/* Heatmap */
.heat{ border-collapse:separate; border-spacing:3px; width:100%; min-width:720px; font-size:13px; }
.heat th{ font-weight:600; color:var(--muted); text-align:start; padding:4px; vertical-align:bottom; }
.heat thead th{ font-size:12px; line-height:1.2; }
.heat td{ height:38px; text-align:center; border-radius:2px; cursor:pointer; font-variant-numeric:tabular-nums; font-weight:600; font-size:12.5px; }
.heat td:hover{ outline:2px solid var(--purple); }
.heat .tot{ background:none!important; color:var(--muted); cursor:default; font-weight:700; }
.heat .tot:hover{ outline:0; }
.legend{ display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--muted); margin:10px 0 0; }
.legend i{ width:22px; height:12px; display:inline-block; border-radius:2px; }

/* Quadrant */
.quad{ width:100%; max-width:760px; display:block; }
.quad text{ fill:var(--muted); font-size:12px; font-family:inherit; }
.quad .zone{ font-weight:700; fill:var(--ink); font-size:13px; }
.quad circle{ cursor:pointer; stroke:var(--paper); stroke-width:1.5; }
.quad circle:hover{ stroke:var(--ink); stroke-width:2; }

/* Catalogue */
.filters{ display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:10px; margin-bottom:12px; }
.filters label{ display:flex; flex-direction:column; gap:4px; font-size:12.5px; color:var(--muted); font-weight:600; }
.filters select,.filters input{ border:1px solid var(--line); border-radius:var(--r2); padding:8px 10px; background:var(--card); font-size:14.5px; width:100%; }
.search{ grid-column:1 / -1; }
.count{ display:flex; flex-wrap:wrap; gap:10px; align-items:center; font-size:14px; margin:0 0 14px; }
.count strong{ font-size:22px; color:var(--purple); font-variant-numeric:tabular-nums; }
.uclist{ border-top:2px solid var(--ink); }
details.uc{ border-bottom:1px solid var(--line); }
details.uc summary{ list-style:none; cursor:pointer; display:grid; grid-template-columns:76px minmax(0,1fr) 150px; gap:6px 14px; padding:12px 4px; align-items:center; }
details.uc summary::-webkit-details-marker{ display:none; }
details.uc summary:hover{ background:var(--mist2); }
details.uc[open] summary{ background:var(--mist2); }
.ucid{ font-size:12.5px; font-weight:700; color:var(--purple2); font-variant-numeric:tabular-nums; }
:root[data-theme="dark"] .ucid{ color:var(--lilac); }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .ucid{ color:var(--lilac); } }
.uct{ font-weight:650; line-height:1.3; }
.ucsub{ font-size:12.5px; color:var(--muted); display:flex; flex-wrap:wrap; gap:4px 10px; margin-top:3px; }
.bars{ display:grid; gap:4px; font-size:11.5px; color:var(--muted); }
.bars div{ display:grid; grid-template-columns:62px 1fr; align-items:center; gap:6px; }
.meter{ height:6px; background:var(--line); border-radius:3px; overflow:hidden; }
.meter i{ display:block; height:100%; background:var(--purple); }
.meter.f i{ background:var(--ink); }
.ucbody{ padding:4px 4px 20px 94px; display:grid; gap:14px; }
html[dir="rtl"] .ucbody{ padding:4px 94px 20px 4px; }
.ucbody p{ margin:0; }
.kv{ display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:12px 20px; }
.kv h5{ margin:0 0 6px; font-size:12px; color:var(--muted); font-weight:700; }
.badge{ display:inline-block; font-size:12px; padding:2px 8px; border-radius:var(--r1); font-weight:600; }
.b-H{ background:#000; color:#fff; } .b-T{ background:var(--purple); color:#fff; } .b-M{ background:var(--mist); color:#2B0047; }
:root[data-theme="dark"] .b-H{ background:#fff; color:#000; }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .b-H{ background:#fff; color:#000; } }
.empty{ padding:24px 0; color:var(--muted); }

/* Synergies */
.syn{ width:100%; border-collapse:collapse; font-size:14.5px; min-width:560px; }
.syn th,.syn td{ padding:9px 10px 9px 0; border-bottom:1px solid var(--line); text-align:start; }
html[dir="rtl"] .syn th,html[dir="rtl"] .syn td{ padding:9px 0 9px 10px; }
.syn th{ font-size:12.5px; color:var(--muted); font-weight:600; }
.syn td.num{ font-variant-numeric:tabular-nums; width:90px; }
.hbar{ height:10px; background:var(--purple); border-radius:1px; }
.loops{ display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:14px; margin-top:18px; }
.loop{ border-inline-start:3px solid var(--purple); padding:4px 0 4px 16px; }
html[dir="rtl"] .loop{ padding:4px 16px 4px 0; }
.loop p{ color:var(--muted); margin:6px 0 10px; font-size:15px; }
.flow{ display:flex; flex-wrap:wrap; align-items:center; gap:4px; font-size:12.5px; }
.flow span{ background:var(--mist2); border:1px solid var(--line); padding:2px 8px; border-radius:var(--r1); }
.flow em{ font-style:normal; color:var(--purple); }

/* Actuariat */
.act{ width:100%; border-collapse:collapse; font-size:14.5px; min-width:680px; }
.act th,.act td{ padding:12px 14px 12px 0; border-bottom:1px solid var(--line); vertical-align:top; text-align:start; }
html[dir="rtl"] .act th,html[dir="rtl"] .act td{ padding:12px 0 12px 14px; }
.act thead th{ font-size:12.5px; color:var(--muted); font-weight:600; }
.act td:first-child{ font-weight:700; width:150px; }
.twin{ background:var(--ink); color:var(--paper); padding:22px 24px; border-radius:var(--r2); margin:26px 0 0; }
.twin h4{ color:var(--lilac); font-size:15px; }
.twin p{ margin:0; max-width:none; font-size:16.5px; }
.roles{ display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:12px; margin-top:12px; padding:0; list-style:none; }
.roles li{ border-top:2px solid var(--purple); padding-top:8px; font-size:15px; }

/* Framework agentique */
.stack{ display:grid; grid-template-columns:minmax(0,1fr) 64px; gap:6px; }
.layers{ display:grid; gap:6px; }
.layer{ display:grid; grid-template-columns:170px 1fr; gap:14px; padding:14px 16px; border-radius:var(--r2); background:var(--mist2); border:1px solid var(--line); }
.layer:nth-child(1){ background:var(--purple3); color:#fff; border-color:var(--purple3); }
.layer:nth-child(2){ background:var(--purple2); color:#fff; border-color:var(--purple2); }
.layer:nth-child(3){ background:var(--purple); color:#fff; border-color:var(--purple); }
.layer:nth-child(4){ background:var(--lilac); color:#14001F; border-color:var(--lilac); }
.layer:nth-child(5){ background:var(--mist); color:#14001F; border-color:var(--mist); }
.layer h4{ margin:0; font-size:15.5px; }
.layer p{ margin:0; font-size:14px; }
.trust{ background:var(--ink); color:var(--paper); border-radius:var(--r2); writing-mode:vertical-rl; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:14px; padding:10px 0; letter-spacing:.02em; }
html[lang="ar"] .trust{ writing-mode:horizontal-tb; font-size:12px; text-align:center; padding:8px 4px; }
.princ{ display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:12px; list-style:none; padding:0; margin:0; }
.princ li{ border-top:2px solid var(--ink); padding-top:8px; font-size:15px; }
.agt{ width:100%; border-collapse:collapse; font-size:14px; min-width:720px; }
.agt th,.agt td{ padding:9px 12px 9px 0; border-bottom:1px solid var(--line); text-align:start; vertical-align:top; }
html[dir="rtl"] .agt th,html[dir="rtl"] .agt td{ padding:9px 0 9px 12px; }
.agt th{ font-size:12.5px; color:var(--muted); font-weight:600; }
.journeys{ display:grid; grid-template-columns:repeat(auto-fit,minmax(340px,1fr)); gap:26px; }
.journey ol{ list-style:none; margin:0; padding:0; counter-reset:s; }
.journey li{ counter-increment:s; display:grid; grid-template-columns:30px 1fr; gap:10px; padding:10px 0; border-bottom:1px solid var(--line); }
.journey li::before{ content:counter(s); width:26px; height:26px; border-radius:50%; background:var(--purple); color:#fff; font-weight:700; font-size:13px; display:flex; align-items:center; justify-content:center; }
.journey li.hm::before{ background:var(--ink); color:var(--paper); }
.journey li b{ display:block; font-size:14.5px; }
.journey li span{ font-size:14px; color:var(--muted); }
.hmtag{ display:inline-block; margin-inline-start:6px; font-size:11.5px; font-weight:700; color:var(--paper); background:var(--ink); padding:1px 6px; border-radius:var(--r1); }

/* Comparaison */
.cmp{ width:100%; border-collapse:collapse; font-size:14.5px; min-width:720px; }
.cmp th,.cmp td{ padding:12px 14px 12px 0; border-bottom:1px solid var(--line); vertical-align:top; text-align:start; }
html[dir="rtl"] .cmp th,html[dir="rtl"] .cmp td{ padding:12px 0 12px 14px; }
.cmp thead th{ font-size:13px; font-weight:700; }
.cmp thead th:last-child{ color:var(--purple); }
.cmp td:first-child{ font-weight:700; width:190px; }
.cmp td:nth-child(2){ color:var(--muted); }

/* Benchmark */
.bfil{ display:flex; flex-wrap:wrap; gap:6px; margin:0 0 16px; }
.bfil button[aria-pressed="true"]{ background:var(--purple); color:#fff; border-color:var(--purple); }
.bench{ display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:14px; }
.bcard{ border:1px solid var(--line); border-radius:var(--r2); padding:16px 18px; display:flex; flex-direction:column; gap:10px; background:var(--card); }
.bcard header{ display:flex; justify-content:space-between; gap:10px; align-items:start; }
.bcard h4{ font-size:17px; margin:0; }
.bcard .geo{ font-size:13px; color:var(--muted); }
.st{ font-size:11.5px; font-weight:700; padding:2px 8px; border-radius:var(--r1); white-space:nowrap; }
.st-prod{ background:var(--purple); color:#fff; } .st-research{ background:var(--ink); color:var(--paper); } .st-survey{ background:var(--mist); color:#2B0047; } .st-pilot{ background:var(--lilac); color:#14001F; }
.bcard p{ margin:0; font-size:14.5px; }
.bcard .res{ border-inline-start:3px solid var(--purple); padding-inline-start:10px; }
.srcs{ list-style:none; margin:0; padding:0; font-size:12.5px; display:grid; gap:4px; }
.srcs li span{ color:var(--muted); }

/* Gouvernance */
.tl{ list-style:none; margin:0; padding:0; border-inline-start:2px solid var(--purple); }
.tl li{ position:relative; padding:0 0 16px 22px; }
html[dir="rtl"] .tl li{ padding:0 22px 16px 0; }
.tl li::before{ content:""; position:absolute; inset-inline-start:-7px; top:6px; width:12px; height:12px; border-radius:50%; background:var(--paper); border:2px solid var(--purple); }
.tl li.future::before{ background:var(--purple); }
.tl time{ font-weight:800; font-variant-numeric:tabular-nums; display:block; font-size:14px; }
.classes{ display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:12px; }
.cls{ border:1px solid var(--line); border-radius:var(--r2); padding:14px 16px; }
.cls .big{ font-size:34px; font-weight:800; line-height:1; font-variant-numeric:tabular-nums; }
.cls p{ font-size:14px; color:var(--muted); margin:8px 0 0; }
.callout{ border:2px solid var(--purple); border-radius:var(--r2); padding:16px 20px; font-size:16px; margin-top:20px; }
.dist{ display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:22px; }
.distrow{ display:grid; grid-template-columns:minmax(110px,1fr) 2fr 34px; gap:8px; align-items:center; font-size:13.5px; padding:3px 0; }
.distrow .meter{ height:10px; }
.distrow b{ text-align:end; font-variant-numeric:tabular-nums; }

/* Vision */
.hz{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:0; border-top:2px solid var(--ink); }
.hz > div{ padding:16px 18px 18px 0; border-inline-end:1px solid var(--line); }
html[dir="rtl"] .hz > div{ padding:16px 0 18px 18px; }
.hz > div:last-child{ border-inline-end:0; }
.hz > div + div{ padding-inline-start:18px; }
.hz .t{ font-size:13px; color:var(--purple); font-weight:700; }
.hz p{ font-size:14.5px; color:var(--muted); margin:6px 0 0; }
.two{ display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:26px; }
.list{ margin:0; padding-inline-start:20px; }
.list li{ margin-bottom:8px; }

/* Feuille de route */
.waves{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; }
.wave{ border:1px solid var(--line); border-radius:var(--r2); padding:16px; display:flex; flex-direction:column; gap:8px; }
.wave .big{ font-size:30px; font-weight:800; color:var(--purple); line-height:1; }
.wave p{ margin:0; font-size:14.5px; }
.wave .f{ color:var(--muted); font-size:13.5px; }
.wave ul{ margin:4px 0 0; padding-inline-start:18px; font-size:13.5px; }
.ops{ display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:12px; }
.ops div{ border-top:2px solid var(--purple); padding-top:8px; }
.ops p{ margin:4px 0 0; font-size:14px; color:var(--muted); }

/* Sources */
.srcgroup{ margin-bottom:22px; }
.srclist{ list-style:none; margin:0; padding:0; display:grid; gap:10px; }
.srclist li{ border-bottom:1px solid var(--line); padding-bottom:10px; font-size:14px; }
.srclist li p{ margin:4px 0 0; color:var(--muted); font-size:13.5px; }
.q{ font-size:11px; font-weight:700; padding:1px 6px; border-radius:var(--r1); margin-inline-start:6px; white-space:nowrap; }
.q1{ background:var(--purple); color:#fff; } .q2{ background:var(--mist); color:#2B0047; } .q3{ background:var(--line); color:var(--ink); }
footer{ padding:40px 0 60px; color:var(--muted); font-size:13px; }

/* Extension V2 */
.orders{ width:100%; border-collapse:collapse; font-size:14.5px; min-width:520px; }
.orders th,.orders td{ padding:10px 12px 10px 0; border-bottom:1px solid var(--line); text-align:start; vertical-align:top; }
html[dir="rtl"] .orders th,html[dir="rtl"] .orders td{ padding:10px 0 10px 12px; }
.orders th{ font-size:12.5px; color:var(--muted); font-weight:600; }
.orders .fig{ font-weight:800; color:var(--purple); white-space:nowrap; font-variant-numeric:tabular-nums; font-size:17px; direction:ltr; }
.raci,.eco,.found{ width:100%; border-collapse:collapse; font-size:14.5px; min-width:640px; }
.raci th,.raci td,.eco th,.eco td,.found th,.found td{ padding:10px 12px 10px 0; border-bottom:1px solid var(--line); text-align:start; vertical-align:top; }
html[dir="rtl"] :is(.raci,.eco,.found) :is(th,td){ padding:10px 0 10px 12px; }
.raci th,.eco th,.found th{ font-size:12.5px; color:var(--muted); font-weight:600; }
.found .num{ color:var(--purple); font-weight:800; width:28px; font-variant-numeric:tabular-nums; }
.eco td:last-child{ font-family:inherit; }
.frames{ display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:12px; }
.frame{ border:1px solid var(--line); border-radius:var(--r2); padding:14px 16px; }
.frame p{ margin:4px 0 6px; font-size:14px; color:var(--muted); }
.traps{ display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:12px; }
.trap{ position:relative; border-top:2px solid var(--ink); padding:10px 0 0 40px; }
html[dir="rtl"] .trap{ padding:10px 40px 0 0; }
.trap .tn{ position:absolute; inset-inline-start:0; top:10px; width:28px; height:28px; border-radius:50%; background:var(--purple); color:#fff; font-weight:800; font-size:13px; display:flex; align-items:center; justify-content:center; }
.trap h4{ margin-bottom:4px; }
.trap p{ margin:0; font-size:14px; color:var(--muted); }
.markets{ display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:14px; }
.market{ border-inline-start:3px solid var(--purple); padding:4px 0 4px 16px; }
html[dir="rtl"] .market{ padding:4px 16px 4px 0; }
.market p{ margin:6px 0 0; font-size:14.5px; }
.st-lesson{ background:#fff; color:#000; border:1px solid #000; } .st-plan{ background:var(--purple3); color:#fff; }
:root[data-theme="dark"] .st-lesson{ background:#000; color:#fff; border-color:#fff; }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .st-lesson{ background:#000; color:#fff; border-color:#fff; } }
@media print{ .orders,.raci,.eco,.found{ min-width:0; } .trap,.frame,.market{ break-inside:avoid; } }

/* ---------- Responsive ---------- */
@media (max-width: 980px){
  .layout{ grid-template-columns:1fr; }
  .toc{ display:none; position:fixed; inset:57px 0 0 0; height:auto; background:var(--paper); z-index:25; border:0; }
  .toc.open{ display:block; }
  .menuBtn{ display:inline-block; }
  .bar .doc{ display:none; }
  .waves,.hz{ grid-template-columns:1fr; }
  .hz > div{ border-inline-end:0; border-bottom:1px solid var(--line); padding-inline-start:0!important; }
}
@media (max-width: 640px){
  details.uc summary{ grid-template-columns:62px minmax(0,1fr); }
  details.uc summary .bars{ grid-column:2; }
  .ucbody,html[dir="rtl"] .ucbody{ padding:4px 4px 18px 4px; }
  .lever{ grid-template-columns:1fr; }
  .lever .lh{ border-inline-end:0; border-bottom:1px solid var(--line); }
  .layer{ grid-template-columns:1fr; gap:4px; }
  .stack{ grid-template-columns:1fr; }
  .trust{ writing-mode:horizontal-tb; padding:10px; }
  .bar .brand{ font-size:13px; }
  .seg button{ padding:6px 8px; }
}
@media (prefers-reduced-motion: no-preference){
  .hero h1,.hero .sub,.stats{ animation:rise .7s ease-out both; }
  .hero .sub{ animation-delay:.08s; } .stats{ animation-delay:.16s; }
  @keyframes rise{ from{ opacity:0; transform:translateY(10px); } to{ opacity:1; transform:none; } }
}

/* ---------- Impression ---------- */
@media print{
  :root{ --ink:#000; --paper:#fff; --muted:#444; --line:#D8D2E0; --soft:#fff; --card:#fff; --mist2:#F5F0FF; padding:0; }
  @page{ size:A4; margin:14mm 12mm; }
  body{ font-size:10.5pt; background:#fff; color:#000; }
  .bar,.toc,.filters,.count .btn,.bfil,.menuBtn,.noprint{ display:none!important; }
  .layout{ display:block; }
  .wrap{ max-width:none; padding:0; }
  .hero{ -webkit-print-color-adjust:exact; print-color-adjust:exact; padding:24mm 10mm 12mm; min-height:260mm; break-after:page; }
  .ch{ break-before:page; padding-top:0; border:0; }
  .heat td,.cadgrid .c,.layer,.vtroot,.twin,.b-H,.b-T,.b-M,.st,.q,.journey li::before,.hbar,.meter i,.chip.p,.lever .lh,.trust{ -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  details.uc summary{ grid-template-columns:62px 1fr 120px; padding:6px 0; }
  details.uc{ break-inside:avoid; }
  .ucbody{ padding:0 0 10px 62px!important; gap:6px; font-size:9.5pt; }
  .bcard,.wave,.cls,.persona,.msg,.layer,.loop{ break-inside:avoid; }
  a{ color:#000; text-decoration:none; }
  .srclist a::after{ content:" — " attr(href); font-size:8pt; color:#555; word-break:break-all; }
  .heat{ min-width:0; font-size:8pt; } .tablewrap{ overflow:visible; }
  .quad{ max-width:150mm; }
  .ucbody .kv{ grid-template-columns:repeat(3,1fr); gap:4px 12px; }
  .ucbody .kv > div:last-child{ display:none; }
  .ucbody .chip{ font-size:7.5pt; padding:0 5px; border:0; background:none; }
  .ucbody .chip:not(:last-child)::after{ content:","; }
  .ucbody .chip.p{ background:none; color:#000; }
  .ucbody .chips{ gap:0 3px; }
  .kv h5{ margin:0 0 1px; font-size:7.5pt; }
  details.uc summary .bars{ font-size:7pt; }
  .uct{ font-size:10pt; } .ucsub{ font-size:8pt; }
}
/* Ajustements post-audit */
.heat{ table-layout:fixed; }
.heat thead th:first-child,.heat tbody th{ width:190px; }
.heat thead th:last-child{ width:44px; }
.hero h1{ max-width:20ch; }
@media (max-width: 560px){
  .bar{ gap:8px; padding:8px 12px; }
  .bar .bs,#themeBtn{ display:none; }
  .bar .brand{ flex:1; }
  .btn{ padding:6px 9px; }
}
/* Extension d'exhaustivité */
.formula{ border-inline-start:4px solid var(--purple); background:var(--mist2); padding:14px 18px; margin:10px 0 18px; font-size:15.5px; }
.formula .lbl{ display:block; font-size:12px; color:var(--purple); font-weight:700; margin-bottom:4px; }
.heat.mini{ min-width:640px; } .heat.mini td{ height:30px; font-size:12px; } .heat.mini th{ font-size:11.5px; }
.pickLob{ display:inline-flex; gap:10px; align-items:center; font-size:14px; margin:0 0 10px; }
.pickLob select{ border:1px solid var(--line); border-radius:var(--r2); padding:6px 10px; background:var(--card); }
.lobsheets{ display:grid; gap:18px; }
.lobsheet{ border:1px solid var(--line); border-radius:var(--r2); padding:18px 20px; }

.lobsheet h5{ margin:14px 0 6px; font-size:12px; color:var(--muted); font-weight:700; }
.lobgrid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:4px 18px; }
.lobgrid h5{ margin-top:4px; }
.chip b{ font-weight:700; color:var(--purple); }
.toplist{ list-style:none; margin:0; padding:0; display:grid; gap:4px; font-size:14.5px; }
.capgrid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:12px; }

.capcard p.small strong{ color:var(--ink); }
.gloss td{ font-size:14px; }
@media print{ .lobsheet,.capcard{ break-inside:avoid; } .heat.mini{ min-width:0; } }
.heat.mini{ min-width:820px; }
.heat.mini thead th{ white-space:normal; overflow-wrap:anywhere; hyphens:auto; font-size:11px; line-height:1.15; padding:4px 2px; }
@media print{ .heat.mini{ min-width:0; } .heat.mini thead th{ font-size:7pt; } }
/* Consolidation V2 : correctifs */
.pickLob{ display:flex; flex-wrap:wrap; align-items:center; gap:8px; max-width:100%; }
.pickLob select{ max-width:100%; min-width:0; border:1px solid var(--line); border-radius:var(--r2); padding:6px 10px; background:var(--card); }

/* ============================================================
   ÉDITION 3 — tuiles, graphiques, cartes, simulateur, fondations, démarche
   ============================================================ */
:root{ --bar-lo:#A100FF; --bar-hi:#E6DCFF; --bar-neg:#460073; --bar-t:#B4AEC0; --bar-t2:#E3DEEA; --bar-n:#16121D; --bar-n2:#CFC6DD; }
:root[data-theme="dark"]{ --bar-lo:#BE82FF; --bar-hi:#3B2358; --bar-neg:#E6DCFF; --bar-t:#8F86A0; --bar-t2:#3A3545; --bar-n:#F4F1F8; --bar-n2:#6E6580; }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bar-lo:#BE82FF; --bar-hi:#3B2358; --bar-neg:#E6DCFF; --bar-t:#8F86A0; --bar-t2:#3A3545; --bar-n:#F4F1F8; --bar-n2:#6E6580; } }
h4.sub{ font-size:15px; color:var(--muted); font-weight:600; margin:18px 0 8px; letter-spacing:.01em; }
.list.small li{ margin-bottom:5px; }
.two.wide{ grid-template-columns:minmax(0,1.4fr) minmax(280px,1fr); align-items:start; }
.callout.soft{ border-color:var(--line); background:var(--mist2); }
.callout h4{ margin-bottom:6px; } .callout p{ margin:0; font-size:15px; }
/* tuiles chiffrées */
.tiles{ display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:12px; margin:14px 0 18px; }
.tile{ border:1px solid var(--line); border-radius:var(--r2); padding:16px 18px 14px; background:var(--card); display:flex; flex-direction:column; gap:4px; }
.tile strong{ font-size:clamp(26px,2.6vw,34px); font-weight:800; line-height:1.05; letter-spacing:-.02em; color:var(--purple); font-variant-numeric:tabular-nums; }
:root[data-theme="dark"] .tile strong{ color:var(--lilac); } @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .tile strong{ color:var(--lilac); } }
.tile span{ font-weight:700; font-size:14.5px; } .tile span:empty{ display:none; }
.tile p{ margin:2px 0 0; font-size:13.5px; color:var(--muted); line-height:1.4; }
.tile small{ font-size:12.5px; color:var(--muted); margin-top:auto; padding-top:6px; }
/* barres horizontales */
.hb{ display:grid; gap:7px; margin:10px 0; }
.hbr{ display:grid; grid-template-columns:minmax(150px,1.1fr) minmax(0,2fr) 58px; gap:10px; align-items:center; font-size:14px; }
.hbl{ line-height:1.25; } .hbl small{ display:block; color:var(--muted); font-size:12px; }
.hbt{ height:14px; background:var(--bar-t2); border-radius:2px; overflow:hidden; } .hbt i{ display:block; height:100%; background:var(--bar-lo); border-radius:0 2px 2px 0; }
html[dir="rtl"] .hbt i{ border-radius:2px 0 0 2px; }
.hbv{ text-align:end; font-variant-numeric:tabular-nums; font-size:14px; }
/* barres à fourchette */
.rb{ display:grid; gap:7px; margin:10px 0; }
.rbr{ display:grid; grid-template-columns:minmax(150px,1.1fr) minmax(0,2fr) 90px; gap:10px; align-items:center; font-size:14px; }
.rbl{ line-height:1.25; } .rbl .tag{ font-style:normal; font-size:11.5px; color:var(--muted); border:1px solid var(--line); border-radius:999px; padding:0 6px; }
.rbt{ position:relative; height:16px; background:var(--bar-t2); border-radius:2px; overflow:hidden; }
.rbt i{ position:absolute; inset-inline-start:0; top:0; height:100%; display:block; } .rbt i.hi{ background:var(--bar-hi); } .rbt i.lo{ background:var(--bar-lo); }
.rbv{ text-align:end; font-variant-numeric:tabular-nums; white-space:nowrap; }
.rbleg{ display:flex; flex-wrap:wrap; gap:16px; font-size:12.5px; color:var(--muted); margin-top:4px; }
.rbleg i{ display:inline-block; width:14px; height:10px; vertical-align:-1px; margin-inline-end:5px; border-radius:2px; }
.rbleg i.lo{ background:var(--bar-lo); } .rbleg i.hi{ background:var(--bar-hi); } .rbleg i.neg{ background:var(--bar-neg); } .rbleg i.pos{ background:var(--bar-lo); }
/* colonnes à fourchette */
.cc{ margin:10px 0 4px; }
.ccplot{ position:relative; display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:18px; border-bottom:1px solid var(--line); }
.ccplot .zero{ position:absolute; left:0; right:0; height:1px; background:var(--muted); opacity:.6; }
.ccg{ position:relative; display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:5px; padding:0 8%; }
.col{ position:relative; display:block; height:100%; }
.col i{ position:absolute; left:0; right:0; display:block; border-radius:2px 2px 0 0; }
.col i.g.hi{ background:var(--bar-hi); } .col i.g.lo{ background:var(--bar-lo); }
.col i.t.hi{ background:var(--bar-t2); } .col i.t.lo{ background:var(--bar-t); }
.col i.n.hi{ background:var(--bar-n2); } .col i.n.lo{ background:var(--bar-n); }
.ccx{ display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:18px; text-align:center; font-size:13px; font-weight:700; padding-top:6px; font-variant-numeric:tabular-nums; }
.ccleg{ display:flex; flex-wrap:wrap; gap:16px; font-size:12.5px; color:var(--muted); margin-top:8px; }
.ccleg i{ display:inline-block; width:9px; height:10px; vertical-align:-1px; } .ccleg i + i{ margin-inline-end:6px; }
.ccleg i.g.lo{ background:var(--bar-lo); } .ccleg i.g.hi{ background:var(--bar-hi); } .ccleg i.t.lo{ background:var(--bar-t); } .ccleg i.t.hi{ background:var(--bar-t2); } .ccleg i.n.lo{ background:var(--bar-n); } .ccleg i.n.hi{ background:var(--bar-n2); }
/* cascade */
.wf{ border:1px solid var(--line); border-radius:var(--r2); padding:14px 14px 10px; }
.wfh{ font-size:13px; font-weight:700; color:var(--purple); margin-bottom:26px; text-transform:uppercase; letter-spacing:.04em; }
.wfplot{ position:relative; display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:10px; margin-bottom:46px; }
.wfc{ position:relative; }
.wfc i{ position:absolute; left:8%; right:8%; display:block; border-radius:2px; }
.wfc i.start,.wfc i.end{ background:var(--bar-n); } .wfc i.minus{ background:var(--bar-lo); } .wfc i.plus{ background:var(--bar-t); }
.wfc b{ position:absolute; left:0; right:0; text-align:center; font-size:12.5px; font-variant-numeric:tabular-nums; white-space:nowrap; }
.wfc span{ position:absolute; left:0; right:0; top:100%; padding-top:6px; text-align:center; font-size:11.5px; color:var(--muted); line-height:1.2; }
/* tornado */
.tor{ display:grid; gap:8px; margin:10px 0; }
.torr{ display:grid; grid-template-columns:minmax(170px,1.2fr) minmax(0,2fr); gap:10px; align-items:center; font-size:14px; }
.torl{ line-height:1.25; }
.tort{ display:grid; grid-template-columns:1fr 1fr; height:22px; }
.torn,.torp{ display:flex; align-items:center; gap:6px; font-size:12.5px; font-variant-numeric:tabular-nums; }
.torn{ justify-content:flex-end; border-inline-end:1px solid var(--ink); } .torp{ justify-content:flex-start; }
.torn i{ display:block; height:16px; background:var(--bar-neg); border-radius:2px 0 0 2px; } .torp i{ display:block; height:16px; background:var(--bar-lo); border-radius:0 2px 2px 0; }
/* cartes */
.cards3,.cards4,.cards5{ display:grid; gap:12px; margin:12px 0; }
.cards3{ grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); } .cards4{ grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); } .cards5{ grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); }
.card{ border:1px solid var(--line); border-top:3px solid var(--purple); border-radius:var(--r2); padding:14px 16px; background:var(--card); display:flex; flex-direction:column; gap:4px; }
.card h4{ font-size:15.5px; margin:0 0 2px; } .card p{ margin:0; font-size:14px; color:var(--muted); }
.card .ct{ font-size:12px; font-weight:700; color:var(--purple); letter-spacing:.02em; }
:root[data-theme="dark"] .card .ct{ color:var(--lilac); } @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .card .ct{ color:var(--lilac); } }
.card .cd{ color:var(--ink); font-size:13.5px; margin-top:4px; } .card .cd strong{ color:var(--purple); }
.card small{ margin-top:auto; padding-top:8px; font-size:12.5px; color:var(--muted); }
.card.fnd{ border-top-color:var(--ink); }
.card.wave2 .big2{ font-weight:700; color:var(--ink); font-size:14px; margin-top:6px; border-top:1px solid var(--line); padding-top:8px; }
.card ul{ margin:4px 0; padding-inline-start:18px; font-size:14px; } .card ul li{ margin-bottom:4px; }
/* tableaux */
.scale .num{ text-align:end; font-variant-numeric:tabular-nums; white-space:nowrap; }
.scale tr.tot td{ font-weight:700; border-top:2px solid var(--ink); }
.scale.blocks{ font-size:13.5px; } .scale.blocks td,.scale.blocks th{ padding:9px 10px 9px 0; }
.scale.blocks .chips{ margin-top:6px; gap:4px; } .scale.blocks .chip{ font-size:11.5px; padding:1px 7px; }
.scale.cockpit tr.guard td{ background:var(--mist2); }

/* ============================================================
   CATALOGUE DES CAS D'USAGE
   U(id, maillon, famille, autonomie, horizon, valeur 1-5, faisabilité 1-5,
     classe AI Act, produits, segments, leviers, KPI, socles, benchmarks,
     [titre fr,en,ar], [description fr,en,ar])
   Valeur et faisabilité = scoring qualitatif d'expert (échelle 1-5),
   pas une mesure de marché. "*" = tous produits / tous segments.
   ============================================================ */
const UC = [];
/* Les leviers déclarés sont complétés par ceux des KPI rattachés (cohérence value tree). */
const U = (id, c, f, a, h, v, x, r, p, s, lv, k, cap, b, t, d) =>
  UC.push({ id, c, f, a, h, v, x, r, p: p.split(" "), s: s.split(" "),
            lv: [...new Set([...lv.split(" "), ...k.split(" ").map(z => KPI[z] ? KPI[z].lv : null).filter(Boolean)])],
            k: k.split(" "), cap: cap.split(" "), b: b ? b.split(" ") : [],
            t: { fr: t[0], en: t[1], ar: t[2] }, d: { fr: d[0], en: d[1], ar: d[2] } });

       "عرض «aiSure»: ضمانات أداء وتغطيات مسؤولية لأنظمة الذكاء الاصطناعي (ضعف الأداء والهلوسة والتحيز والملكية الفكرية والخسائر المالية) لمزودي ومستخدمي الذكاء الاصطناعي. وتذكر ميونيخ ري أنها بدأت تأمين الذكاء الاصطناعي عام 2018."),
   r:L("Signal de marché : le risque IA devient un risque assurable et un sujet de souscription pour les lignes financières et RC. Pas de chiffre de primes publié.",
       "Market signal: AI risk is becoming insurable and an underwriting topic for financial and liability lines. No premium figure published.",
       "إشارة سوق: مخاطر الذكاء الاصطناعي تصبح قابلة للتأمين وموضوع اكتتاب في الخطوط المالية والمسؤولية. لم يُنشر رقم للأقساط."),
   src:[{t:"Munich Re — Insure AI (aiSure)", u:"https://www.munichre.com/en/solutions/for-industry-clients/insure-ai.html", q:1}] },
 { id:"generali-shift", org:"Generali France", geo:L("France","France","فرنسا"), y:"2016–2023", c:"fraud", lob:["auto","home"], f:"ml", st:"prod",

 { id:"swissre-uwease", org:"Swiss Re", geo:L("Amérique du Nord","North America","أمريكا الشمالية"), y:"2025", c:"uw", lob:["prot","life"], f:"gen", st:"prod",
   w:L("« Underwriting Ease » : OCR, traitement du langage et grands modèles de langage pour extraire et organiser les éléments des dossiers vie complexes (dossiers médicaux, prescriptions, résultats de laboratoire) ; moteur d'automatisation « Magnum ».",
       "\"Underwriting Ease\": OCR, NLP and large language models to extract and organise evidence in complex life cases (medical records, prescriptions, lab results); \"Magnum\" automated underwriting engine.",
       "«Underwriting Ease»: تعرف ضوئي ومعالجة لغة ونماذج لغوية كبيرة لاستخراج وتنظيم عناصر ملفات الحياة المعقدة (السجلات الطبية والوصفات ونتائج المختبر)؛ ومحرك الاكتتاب الآلي «Magnum»."),
   r:L("Selon la presse spécialisée (14 août 2025) : optimisation du travail de sélection manuelle jusqu'à 50 % rapportée par l'assureur SBLI ; jusqu'à 90 % des demandes traitées sans intervention manuelle sur certains marchés, environ 75 % en moyenne mondiale.",
       "According to trade press (14 Aug 2025): up to 50% optimisation of manual underwriting work reported by insurer SBLI; up to 90% of applications processed without manual intervention in some markets, around 75% on global average.",
       "وفق الصحافة المتخصصة (14 أغسطس 2025): تحسين عمل الاكتتاب اليدوي حتى 50٪ كما أفادت شركة SBLI؛ ومعالجة حتى 90٪ من الطلبات دون تدخل يدوي في بعض الأسواق، ونحو 75٪ كمتوسط عالمي."),
   src:[{t:"Insurance Business — Swiss Re launches AI-powered Underwriting Ease (14 Aug 2025)", u:"https://www.insurancebusinessmag.com/reinsurance/news/breaking-news/swiss-re-launches-aipowered-underwriting-ease-to-streamline-life-insurance-reviews-546156.aspx", q:2}] },
 { id:"marsh-lenai", org:"Marsh McLennan (courtage)", geo:L("International","Global","دولي"), y:"2023", c:"supp", lob:[], f:"gen", st:"prod",
   w:L("« LenAI », assistant d'IA générative interne (technologies Microsoft et OpenAI, hébergement interne) : synthèse de réunions, extraction de données de documents, rédaction d'e-mails et de présentations.",
       "\"LenAI\", internal generative AI assistant (Microsoft and OpenAI technology, internally hosted): meeting summaries, document data extraction, email and presentation drafting.",

   r:L("Accès ouvert aux 85 000 collaborateurs ; gain déclaré d'environ huit heures par semaine en moyenne et 20 % de temps en moins sur les tâches simples et répétitives (annonce de novembre 2023).",
       "Access opened to 85,000 employees; reported saving of about eight hours a week on average and 20% less time on simple, repetitive tasks (November 2023 announcement).",
       "وصول متاح لـ85000 موظف؛ وتوفير معلن بنحو ثماني ساعات أسبوعيًا في المتوسط و20٪ وقتًا أقل في المهام البسيطة والمتكررة (إعلان نوفمبر 2023)."),
   src:[{t:"Insurance News (AU) — Marsh staff save eight hours a week with new LenAI tool (27 Nov 2023)", u:"https://insurancenews.com.au/insurtech/marsh-staff-save-eight-hours-a-week-with-new-len-ai-tool", q:2}] },
 { id:"saudi-ai-interactions", org:"Marché saoudien (Bupa Arabia, entretien)", geo:L("Arabie saoudite","Saudi Arabia","المملكة العربية السعودية"), y:"2024", c:"pol", lob:["health"], f:"gen", st:"survey",
   w:L("Entretien d'un dirigeant de Bupa Arabia dans Middle East Insurance Review (avril 2024) sur la place de l'IA dans les interactions clients du marché saoudien.",
       "Interview of a Bupa Arabia executive in Middle East Insurance Review (April 2024) on AI's role in customer interactions in the Saudi market.",
       "مقابلة مع أحد قادة بوبا العربية في Middle East Insurance Review (أبريل 2024) حول دور الذكاء الاصطناعي في تفاعلات العملاء بالسوق السعودي."),
   r:L("L'IA serait présente dans plus de 50 % des interactions clients du secteur et plus de 80 millions de transactions d'assurance auraient transité par l'IA. Chiffres cités en entretien, sans source statistique identifiée : à confirmer.",

   src:[{t:"Middle East Insurance Review — AI dominates over half of insurance customer interactions in Saudi (Apr 2024)", u:"https://meinsurancereview.com/Magazine/ReadMagazineArticle/aid/48099/AI-dominates-over-half-of-insurance-customer-interactions-in-Saudi", q:3}] },
 { id:"unitedhealth-nh", org:"UnitedHealth (contre-exemple)", geo:L("États-Unis","United States","الولايات المتحدة"), y:"2023–2025", c:"clm", lob:["health"], f:"ml", st:"lesson",
   w:L("Action collective devant le tribunal fédéral du Minnesota : les plaignants allèguent l'usage de l'outil « nH Predict » pour refuser des soins post-aigus à des assurés Medicare Advantage sans examen médical individuel.",
       "Class action in the federal court for the District of Minnesota: plaintiffs allege the \"nH Predict\" tool was used to deny post-acute care to Medicare Advantage members without individual physician review.",
       "دعوى جماعية أمام المحكمة الفيدرالية في مينيسوتا: يزعم المدعون استخدام أداة «nH Predict» لرفض رعاية ما بعد الحالات الحادة لمشتركي Medicare Advantage دون فحص طبي فردي."),
   r:L("Les plaignants avancent que plus de 90 % des refus sont annulés en appel ; en février 2025, le juge a laissé prospérer les griefs de rupture de contrat et de manquement à la bonne foi. UnitedHealth conteste l'usage de l'outil pour décider et affirme suivre les règles Medicare. Leçon : refus de prestation humains, taux d'annulation en appel comme indicateur de contrôle.",
       "Plaintiffs claim over 90% of denials are overturned on appeal; in February 2025 the judge let the breach-of-contract and good-faith claims proceed. UnitedHealth disputes using the tool to decide and says it follows Medicare rules. Lesson: human benefit refusals, appeal overturn rate as a control indicator.",
       "يزعم المدعون أن أكثر من 90٪ من حالات الرفض تُلغى عند الاستئناف؛ وفي فبراير 2025 سمح القاضي بالمضي في دعاوى الإخلال بالعقد وحسن النية. وتنفي يونايتد هيلث استخدام الأداة لاتخاذ القرار وتؤكد اتباع قواعد Medicare. الدرس: رفض المزايا قرار بشري، ومعدل الإلغاء عند الاستئناف مؤشر رقابي."),
   src:[{t:"Skilled Nursing News — Lawsuit against UnitedHealth over AI-based denials of post-acute care moves ahead (Feb 2025)", u:"https://skillednursingnews.com/2025/02/lawsuit-against-unitedhealth-over-ai-based-denials-of-post-acute-care-moves-ahead/", q:2}] },
 { id:"cigna-pxdx", org:"Cigna (contre-exemple)", geo:L("États-Unis","United States","الولايات المتحدة"), y:"2022–2023", c:"clm", lob:["health"], f:"ml", st:"lesson",
   w:L("Enquête ProPublica (2023) : sur deux mois de 2022, 300 000 demandes de remboursement rejetées via le processus « PxDx », avec en moyenne 1,2 seconde de revue par dossier par les médecins ; action collective déposée en juillet 2023 devant un tribunal fédéral de Californie.",
       "ProPublica investigation (2023): over two months in 2022, 300,000 claims rejected through the \"PxDx\" process, with doctors spending an average of 1.2 seconds per file; class action filed in July 2023 in a California federal court.",
       "تحقيق ProPublica (2023): خلال شهرين من 2022 رُفضت 300000 مطالبة عبر عملية «PxDx» بمتوسط 1.2 ثانية مراجعة لكل ملف من الأطباء؛ ورُفعت دعوى جماعية في يوليو 2023 أمام محكمة فيدرالية في كاليفورنيا."),
   r:L("Cigna décrit PxDx comme un simple appariement de codes après service, sans IA, portant sur environ 1 % des demandes, et conteste que les plaignants aient été concernés. Leçon : même un traitement par règles en masse expose à un risque juridique et réputationnel lorsque la revue individuelle est attendue.",
       "Cigna describes PxDx as simple post-service code matching, without AI, covering about 1% of claims, and disputes that the plaintiffs were affected. Lesson: even rules-based batch processing carries legal and reputational risk where individual review is expected.",
       "تصف سيغنا PxDx بأنه مطابقة بسيطة للرموز بعد الخدمة دون ذكاء اصطناعي، يخص نحو 1٪ من المطالبات، وتنفي تأثر المدعين. الدرس: حتى المعالجة الجماعية بالقواعد تحمل مخاطر قانونية وسمعة حين تكون المراجعة الفردية متوقعة."),
   src:[{t:"Fierce Healthcare — Cigna hit with class action alleging it used an algorithm to reject claims (25 Jul 2023)", u:"https://fiercehealthcare.com/payers/cigna-hit-class-action-alleging-it-used-algorithm-reject-claims", q:2}] },
 { id:"eiopa-genai", org:"EIOPA (enquête IA générative)", geo:L("Union européenne & EEE","European Union & EEA","الاتحاد الأوروبي والمنطقة الاقتصادية الأوروبية"), y:"2026", c:"strat", lob:[], f:"gen", st:"survey",
   w:L("Enquête de marché sur l'IA générative publiée le 2 février 2026 auprès de 347 organismes d'assurance dans 25 pays.",
       "Market survey on generative AI published on 2 February 2026, covering 347 insurance undertakings in 25 countries.",
       "استطلاع سوق حول الذكاء التوليدي نُشر في 2 فبراير 2026 وشمل 347 مؤسسة تأمين في 25 دولة."),
   r:L("Environ 65 % des assureurs utilisent déjà l'IA générative et 23 % prévoient de le faire sous trois ans ; 64 % des cas d'usage concernent la productivité interne, les opérations et l'aide à la décision ; 49 % disposent d'une politique IA dédiée ; 38 % utilisent le RAG ; 84 cas agentiques sur 957 recensés ; les hallucinations sont la première préoccupation citée.",
       "About 65% of insurers already use generative AI and 23% plan to within three years; 64% of use cases concern internal productivity, operations and decision support; 49% have a dedicated AI policy; 38% use RAG; 84 agentic cases out of 957 identified; hallucinations are the top concern cited.",
       "نحو 65٪ من شركات التأمين تستخدم الذكاء التوليدي بالفعل و23٪ تخطط لذلك خلال ثلاث سنوات؛ و64٪ من حالات الاستخدام تخص الإنتاجية الداخلية والعمليات ودعم القرار؛ و49٪ لديها سياسة مخصصة؛ و38٪ تستخدم تقنية RAG؛ و84 حالة وكيلية من أصل 957؛ والهلوسة هي الشاغل الأول."),
   src:[{t:"EIOPA — Survey on generative AI shows swift but cautious adoption among Europe's insurers (2 Feb 2026)", u:"https://www.eiopa.europa.eu/eiopa-survey-generative-ai-shows-swift-cautious-adoption-among-europes-insurers-2026-02-02_en", q:1},
        {t:"DLA Piper — EIOPA survey on GenAI and insurance: where are we now?", u:"https://www.dlapiper.com/en/insights/publications/law-in-tech/2026/eiopa-survey-on-genai-and-insurance", q:2}] },
 { id:"evident-2026", org:"Evident AI Index (Allianz, AXA, Manulife, Zurich…)", geo:L("Amérique du Nord & Europe","North America & Europe","أمريكا الشمالية وأوروبا"), y:"2026", c:"strat", lob:[], f:"ag", st:"survey",
   w:L("Indice annuel de maturité IA de 30 grands assureurs (talents, innovation, leadership, transparence). Édition de juin 2026 : Allianz première, AXA deuxième, Manulife troisième, Zurich quatrième après un gain de huit places.",
       "Annual AI maturity index of 30 large insurers (talent, innovation, leadership, transparency). June 2026 edition: Allianz first, AXA second, Manulife third, Zurich fourth after climbing eight places.",
       "مؤشر سنوي لنضج الذكاء الاصطناعي لدى 30 شركة تأمين كبرى (المواهب والابتكار والقيادة والشفافية). نسخة يونيو 2026: أليانز أولًا وأكسا ثانيًا ومانولايف ثالثًا وزيورخ رابعًا بعد صعود ثماني مراتب."),
   r:L("Allianz déclare plus de 900 cas d'usage IA déployés ; sur 65 cas publiés avec résultats, 75 % rapportent des gains de productivité, 2 % une hausse de revenus et 8 % seulement une amélioration de la qualité de décision sur des processus de bout en bout ; les sinistres représentent 28 % des déploiements.",
       "Allianz reports over 900 AI use cases deployed; of 65 publicly disclosed cases with outcomes, 75% report productivity gains, 2% revenue uplift and only 8% improved decision quality across end-to-end workflows; claims account for 28% of deployments.",
       "تعلن أليانز أكثر من 900 حالة استخدام منشورة؛ ومن بين 65 حالة معلنة بنتائج، 75٪ تذكر مكاسب إنتاجية و2٪ زيادة في الإيرادات و8٪ فقط تحسنًا في جودة القرار عبر العمليات المتكاملة؛ وتمثل المطالبات 28٪ من عمليات النشر."),
   src:[{t:"Allianz — Allianz ranks #1 in the 2026 Evident AI Index for Insurance (16 Jun 2026)", u:"https://allianz.com/en/mediacenter/news/articles/260616-allianz-ranked-first-in-2026-evident-ai-Index-for-insurance.html", q:1},
        {t:"Insurance Business — Allianz claims top spot as gap between insurers opens up (Jun 2026)", u:"https://www.insurancebusinessmag.com/uk/news/technology/allianz-claims-top-spot-as-gap-between-insurers-opens-up-over-successful-ai-competitive-advantage-579110.aspx", q:2},
        {t:"Reinsurance News — Insurance AI deployments jump 87% as GenAI and agentic systems expand (Evident, 6 Mar 2026)", u:"https://www.reinsurancene.ws/insurance-ai-deployments-jump-87-as-genai-and-agentic-systems-expand-says-evident/", q:2}] },
 { id:"manulife-maude", org:"Manulife", geo:L("Canada","Canada","كندا"), y:"2026", c:"uw", lob:["prot","life"], f:"ml", st:"prod",

 { id:"scor-ai", org:"SCOR", geo:L("International","Global","دولي"), y:"2023–2026", c:"uw", lob:["prot","health","reins"], f:"gen", st:"prod",
   w:L("« AI Assistant » interne pour la souscription et les sinistres vie et santé (lecture de dossiers médicaux) ; outil de souscription terrorisme fondé sur l'IA en cours de mise en service ; déploiement prévu en souscription catastrophe à partir de 2027.",
       "Internal \"AI Assistant\" for life and health underwriting and claims (medical file reading); AI-based terrorism underwriting tool being brought into service; roll-out to catastrophe underwriting planned from 2027.",

       "According to trade press: over 100 underwriters and claims staff as users, over a million pages processed per month; early pilots initially lengthened turnaround while AI outputs were checked against source documents.",
       "وفق الصحافة المتخصصة: أكثر من 100 مكتتب وموظف مطالبات يستخدمونه، وأكثر من مليون صفحة تُعالج شهريًا؛ وقد أطالت التجارب الأولى الآجال في البداية ريثما تُراجع مخرجات الذكاء الاصطناعي مقابل الوثائق المصدرية."),

function clone(o){ return JSON.parse(JSON.stringify(o)); }
function compute(inp){
  const I = inp || DEF;
  const eff = b => ({ lo: (I.eff && I.eff[b.id] ? I.eff[b.id].lo : b.lo), hi: (I.eff && I.eff[b.id] ? I.eff[b.id].hi : b.hi) });
  const steady = (b, w) => { const e = eff(b)[w]; const u = b.base(I) * b.addr(I) * e * (I.adoption ?? 1); return [u, u * b.pnl(I)]; };
  const R = { blocks: [], lever: {}, chain: {}, lob: {}, years: {}, total: { lo: 0, hi: 0 } };
  B.forEach(b => {
    const [lu, lv] = steady(b, "lo"), [hu, hv] = steady(b, "hi");
    const lobs = b.lobs(I);
    R.blocks.push({ ...b, effLo: eff(b).lo, effHi: eff(b).hi, baseV: b.base(I), addrV: b.addr(I), pnlV: b.pnl(I), lo_unit: lu, hi_unit: hu, lo_val: lv, hi_val: hv, lobsV: lobs });
    [["lo", lv], ["hi", hv]].forEach(([w, v]) => {
      (R.lever[b.lever] = R.lever[b.lever] || { lo: 0, hi: 0 })[w] += v;
      (R.chain[b.chain] = R.chain[b.chain] || { lo: 0, hi: 0 })[w] += v;
      Object.entries(lobs).forEach(([l, s]) => { (R.lob[l] = R.lob[l] || { lo: 0, hi: 0 })[w] += v * s; });
      R.total[w] += v;
    });
  });
  const tcoScale = I.tcoScale ?? 1;
  YEARS.forEach((y, i) => {
    const yr = { lo: { gross: 0, lever: {} }, hi: { gross: 0, lever: {} } };
    B.forEach(b => { const r = I.ramp[b.kind][i]; ["lo", "hi"].forEach(w => { const v = steady(b, w)[1] * r; yr[w].gross += v; yr[w].lever[b.lever] = (yr[w].lever[b.lever] || 0) + v; }); });
    const fixed = Object.values(I.tcoFixed[y]).reduce((a, b) => a + b, 0) * tcoScale;
    ["lo", "hi"].forEach(w => { const v = I.varRate * yr[w].gross; yr[w].fixed = fixed; yr[w].var = v; yr[w].tco = fixed + v; yr[w].net = yr[w].gross - fixed - v; });
    R.years[y] = yr;
  });
  ["lo", "hi"].forEach(w => { let cum = 0, be = null; YEARS.forEach(y => { cum += R.years[y][w].net; R.years[y][w].cum = cum; if (be === null && cum > 0) be = y; }); R["breakeven_" + w] = be; });
  const fixed30 = Object.values(I.tcoFixed[2030]).reduce((a, b) => a + b, 0) * tcoScale;
  ["lo", "hi"].forEach(w => { const v = I.varRate * R.total[w]; R["steady_" + w] = { gross: R.total[w], fixed: fixed30, var: v, tco: fixed30 + v, net: R.total[w] - fixed30 - v }; });
  const gwpAll = LOBS.reduce((a, l) => a + I.gwp[l], 0), gwpNL = NONLIFE.reduce((a, l) => a + I.gwp[l], 0), clNL = sumc(I, NONLIFE), nlShare = gwpNL / gwpAll;
  const cor = { lr0: clNL / gwpNL, er0: I.commission + I.internalExp * nlShare / gwpNL };
  cor.cor0 = cor.lr0 + cor.er0;
  ["lo", "hi"].forEach(w => {
    const lrG = R.lever.lr[w] / gwpNL, erG = R.lever.er[w] * nlShare / gwpNL, tcoP = R["steady_" + w].tco * nlShare / gwpNL;
    cor[w] = { lr: lrG, er: erG, tco: tcoP, cor: cor.cor0 - lrG - erG + tcoP };
  });
  R.cor = cor; R.gwpAll = gwpAll; R.gwpNL = gwpNL; R.claimsNL = clNL; R.fteTotal = Object.values(I.fte).reduce((a, b) => a + b, 0);
  R.pct = { lo: R.total.lo / gwpAll, hi: R.total.hi / gwpAll };
  // sensibilités autour du cas médian
  const midV = b => (steady(b, "lo")[1] + steady(b, "hi")[1]) / 2;
  const netWith = (g = 1, t = 1, er = 1, lr = 1) => { let s = 0; B.forEach(b => { let v = midV(b); if (b.lever === "er") v *= er; if (b.lever === "lr") v *= lr; s += v; }); s *= g; return s - fixed30 * t - I.varRate * s; };
  const midNet = netWith();
  const half = lev => B.filter(b => b.lever === lev).reduce((a, b) => a + (steady(b, "hi")[1] - steady(b, "lo")[1]) / 2, 0);
  R.mid_net = midNet;
  R.sens = [
    { k: "adopt", lo: netWith(0.7), hi: netWith(1.3) },
    { k: "hr", lo: netWith(1, 1, 0.5), hi: netWith(1, 1, 1) },
    { k: "lr", lo: midNet - half("lr"), hi: midNet + half("lr") },
    { k: "tco", lo: netWith(1, 1.4), hi: netWith(1, 0.8) },
